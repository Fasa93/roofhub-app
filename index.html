          <div style={{flex:1}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#1a1a2e"}}>🎓 {staff.name}</div>
            <div style={{color:staff.color,fontSize:11,fontWeight:700,textTransform:"uppercase"}}>Certifications & Training</div>
          </div>
          <button onClick={onClose} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:14,fontWeight:700}}>✕</button>
        </div>
        
        {!showForm&&<>
          {/* Each cert type */}
          {CERT_TYPES.map(ct=>{
            const cert=certs.find(c=>c.type===ct.id);
            const st=cert?certStatus(cert):null;
            return(
              <div key={ct.id} style={{background:cert?st.bg:"#f9fafb",border:"1px solid "+(cert?st.color:"#e5e7eb"),borderRadius:10,padding:12,marginBottom:10,borderLeft:"4px solid "+ct.color}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:160}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                      <span style={{fontSize:16}}>{ct.icon}</span>

                    </div>
                    {cert?<>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4,marginBottom:4}}>
                        <span style={{background:st.color,color:"#fff",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{st.label}</span>

function TeamView({ts=[],jobs=[],certs=[],setCerts}){
  const[sel,setSel]=React.useState(null);
  const[weekOffset,setWeekOffset]=React.useState(0); // 0 = this week, -1 = last week
  const[certView,setCertView]=React.useState(null); // staff member to view certs for
  
  // Calculate week range (Mon-Sun) based on offset
  function getWeekRange(offset){
    const now=new Date();
    const day=now.getDay(); // 0=Sun, 1=Mon...
    const diff=now.getDate()-day+(day===0?-6:1); // adjust to Monday
    const monday=new Date(now.setDate(diff+offset*7));
    monday.setHours(0,0,0,0);
    const sunday=new Date(monday);
    sunday.setDate(monday.getDate()+6);
    sunday.setHours(23,59,59,999);
    return{start:monday,end:sunday};
  }
  
  // Calculate hours from clockIn/clockOut
  function calcHours(clockIn,clockOut,travel=0){
    if(!clockIn||!clockOut)return 0;
    const[h1,m1]=clockIn.split(":").map(Number);
    const[h2,m2]=clockOut.split(":").map(Number);
    const mins=(h2*60+m2)-(h1*60+m1);
    return Math.max(0,(mins+(travel||0))/60);
  }
  
  function getStaffTimesheets(staffId,offset){
    const{start,end}=getWeekRange(offset);
    return ts.filter(t=>{
      if(t.staffId!==staffId)return false;
      const d=new Date(t.date);
      return d>=start&&d<=end;
    }).sort((a,b)=>a.date.localeCompare(b.date));
  }
  
  function formatHours(h){
    const hours=Math.floor(h);
    const mins=Math.round((h-hours)*60);
    return hours+"h "+(mins<10?"0":"")+mins+"m";
  }
  
  // Calculate overall training stats
  const allStaffCerts=STAFF.map(s=>getStaffCertSummary(s.id,certs));
  const totalExpired=allStaffCerts.reduce((sum,c)=>sum+c.expired,0);
  const totalExpiring=allStaffCerts.reduce((sum,c)=>sum+c.expiring,0);
  const totalRequired=STAFF.length*CERT_TYPES.length;
  const totalCurrent=allStaffCerts.reduce((sum,c)=>sum+c.count,0)-totalExpired;
  
  function generateTrainingMatrixPDF(){
    const win=window.open("","_blank");
    if(!win)return;
    const staffRows=STAFF.map(s=>{
      const cells=CERT_TYPES.map(ct=>{
        const cert=certs.find(c=>c.staffId===s.id&&c.type===ct.id);
        if(!cert||!cert.expiryDate)return'<td style="text-align:center;padding:8px;background:#f3f4f6;color:#9ca3af;">—<\/td>';
        const st=certStatus(cert);
        return'<td style="text-align:center;padding:8px;background:'+st.bg+';color:'+st.color+';font-weight:700;font-size:11px;">'+cert.expiryDate+'<br/><span style="font-size:9px;font-weight:500;">'+st.label+'<\/span><\/td>';
      }).join("");
      return'<tr><td style="padding:10px;font-weight:700;border-left:4px solid '+s.color+';background:#fafafa;">'+s.name+'<br/><span style="font-size:10px;color:#6b7280;font-weight:500;">'+s.role+'<\/span><\/td>'+cells+'<\/tr>';
    }).join("");
    const headerCells=CERT_TYPES.map(ct=>'<th style="padding:10px;background:'+ct.color+';color:#fff;font-size:11px;text-transform:uppercase;">'+ct.icon+' '+ct.name+'<\/th>').join("");

function SSSPView({jobs,setJobs}){
  const[mode,setMode]=React.useState("list");
  const[selJobId,setSelJobId]=React.useState(null);
  const[saved,setSaved]=React.useState(false);
  
  const jobsNeedingSSSP = jobs.filter(j=>j.ssspRequired);
  const pending = jobsNeedingSSSP.filter(j=>!j.ssspCompleted);
  const done = jobsNeedingSSSP.filter(j=>j.ssspCompleted);

  const blankSSSP = {
    packType:"red", // red = main contractor, yellow = subcontractor
    projectName:"",
    mainContractor:"The Roof Hub Limited",
    siteAddress:"",
    startDate:"",
    expectedDuration:"",
    siteContact:"David Sopi",
    siteContactPhone:"",
    firstAider:"David Sopi",
    firstAidLocation:"Truck",
    nearestHospital:"Auckland City Hospital — 09 367 0000",
    evacuationPoint:"",
    accessPoints:"",
    utilitiesLocation:"",
    asbestosChecked:false,
    asbestosNotes:"",
    hazards:DEFAULT_SSSP_HAZARDS.map(h=>({...h,selected:true})),
    extraHazards:[],
    additionalHazard:"",
    additionalControl:"",
    publicProtection:"",
    emergencyProcedure:"",
    specificInstructions:"",
    signedBy:"David Sopi",
    signedDate:new Date().toISOString().split("T")[0],
  };
  const[s,setS]=React.useState(blankSSSP);

  function startNew(jobId){
    const job = jobs.find(j=>j.id===jobId);
    if(!job) return;
    const existing = job.sssp;
    if(existing){
      setS(existing);
    } else {
      setS({
        ...blankSSSP,
        projectName:job.type+" — "+job.client,
        siteAddress:job.address,
        startDate:job.date,
      });
    }
    setSelJobId(jobId);
    setMode("edit");
    setSaved(false);
  }

  function toggleHazard(idx){
    setS(x=>({...x,hazards:x.hazards.map((h,i)=>i===idx?{...h,selected:!h.selected}:h)}));
  }
  function updateHazardControl(idx,val){
    setS(x=>({...x,hazards:x.hazards.map((h,i)=>i===idx?{...h,control:val}:h)}));
  }
  function toggleExtra(hz){
    setS(x=>({...x,extraHazards:x.extraHazards.includes(hz)?x.extraHazards.filter(h=>h!==hz):[...x.extraHazards,hz]}));
  }

  function save(){
    setJobs(jobs.map(j=>j.id===selJobId?{...j,sssp:s,ssspCompleted:true}:j));
    setSaved(true);
    setTimeout(()=>{setMode("list");setSaved(false);},1500);
  }

  function genPDF(){
    const job = jobs.find(j=>j.id===selJobId);
    const activeHazards = s.hazards.filter(h=>h.selected);

  jobs:{table:"jobs",keyMap:{endDate:"end_date",startTime:"start_time",endTime:"end_time",ssspRequired:"sssp_required",ssspCompleted:"sssp_completed",confirmationSent:"confirmation_sent",confirmationSentDate:"confirmation_sent_date",quoteId:"quote_id",quoteNumber:"quote_number"}},

};

// Convert camelCase keys to snake_case for DB
function toDbRow(key,obj){
  const map=CLOUD_TABLES[key]?.keyMap||{};
  const out={};
  for(const k in obj){
    const dbKey=map[k]||k;
    out[dbKey]=obj[k];
  }
  return out;
}
// Convert snake_case keys from DB back to camelCase
function fromDbRow(key,row){
  const map=CLOUD_TABLES[key]?.keyMap||{};
  const reverseMap={};
  for(const k in map)reverseMap[map[k]]=k;
  const out={};
  for(const k in row){
    if(k==="created_at"||k==="updated_at")continue;
    const jsKey=reverseMap[k]||k;
    out[jsKey]=row[k];
  }
  return out;
}

// ── DATA PERSISTENCE (local + cloud) ───────────────────────────
function loadData(key,fallback){
  try{
    const d=localStorage.getItem("roofhub_"+key);
    return d?JSON.parse(d):fallback;
  }catch(e){return fallback;}
}
function saveData(key,value){
  try{localStorage.setItem("roofhub_"+key,JSON.stringify(value));}catch(e){console.error(e);}
}

// Load data from cloud (returns Promise)
async function cloudLoad(key){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    // Paginate through all rows (Supabase returns max 1000 per request)
    const all=[];
    const PAGE=1000;
    let from=0;
    while(true){
      const{data,error}=await sb.from(cfg.table).select("*").range(from,from+PAGE-1);
      if(error){console.error("Cloud load "+key+":",error);return all.length>0?all.map(r=>fromDbRow(key,r)):null;}
      if(!data||data.length===0)break;
      all.push(...data);
      if(data.length<PAGE)break; // last page
      from+=PAGE;
    }
    return all.map(r=>fromDbRow(key,r));
  }catch(e){console.error("Cloud load exception:",e);return null;}
}
// Save a single item to cloud
async function cloudUpsert(key,item){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    const row=toDbRow(key,item);
    const{error}=await sb.from(cfg.table).upsert(row);
    if(error){console.error("Cloud upsert "+key+":",error);}
    return!error;
  }catch(e){console.error("Cloud upsert exception:",e);return false;}
}
// Delete an item from cloud
async function cloudDelete(key,id){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    const{error}=await sb.from(cfg.table).delete().eq("id",id);
    if(error)console.error("Cloud delete "+key+":",error);
    return!error;
  }catch(e){console.error("Cloud delete exception:",e);return false;}
}
// Sync entire array to cloud (upsert all in batches, delete items not in the list)
async function cloudSyncAll(key,items){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  let upsertOk=true;
  try{
    // First, upsert current items in batches (Supabase has payload limits)
    const rows=(items||[]).map(i=>toDbRow(key,{...i,id:key==="clients"?String(i.id):i.id}));
    const BATCH=200;
    for(let i=0;i<rows.length;i+=BATCH){
      const batch=rows.slice(i,i+BATCH);
      const{error}=await sb.from(cfg.table).upsert(batch);
      if(error){
        console.error("Cloud upsert "+key+" batch "+i+":",error);
        upsertOk=false;
      }
    }
    // Then try to delete any stale rows (non-critical — if this fails we still consider sync successful)
    try{
      const currentIds=(items||[]).map(i=>key==="clients"?String(i.id):i.id);
      const{data:cloudRows}=await sb.from(cfg.table).select("id");
      if(cloudRows){
        const toDelete=cloudRows.filter(r=>!currentIds.includes(r.id)).map(r=>r.id);
        for(let i=0;i<toDelete.length;i+=BATCH){
          await sb.from(cfg.table).delete().in("id",toDelete.slice(i,i+BATCH));
        }
      }
    }catch(e){
      console.warn("Cloud cleanup "+key+" failed (non-critical):",e);
    }
    return upsertOk;
  }catch(e){console.error("Cloud sync-all exception:",e);return false;}
}

// ── CLIENTS DATABASE ───────────────────────────────────────────
function parseCSV(text){
  // Simple but robust CSV parser (handles quoted fields with commas)
  const rows=[];
  let cur=[""];let inQuote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];const n=text[i+1];
    if(c==='"'&&inQuote&&n==='"'){cur[cur.length-1]+='"';i++;}
    else if(c==='"'){inQuote=!inQuote;}
    else if(c===','&&!inQuote){cur.push("");}
    else if((c==='\n'||c==='\r')&&!inQuote){
      if(cur.length>1||cur[0]!==""){rows.push(cur);}
      cur=[""];
      if(c==='\r'&&n==='\n')i++;
    }
    else{cur[cur.length-1]+=c;}
  }
  if(cur.length>1||cur[0]!=="")rows.push(cur);
  return rows;
}

function mapXeroRow(headers,row){
  // Strip asterisks, lowercase, and trim (Xero uses *FieldName for required fields)
  const h=headers.map(x=>x.toLowerCase().replace(/^\*/,"").trim());
  function get(...names){
    for(const n of names){
      const key=n.toLowerCase().replace(/^\*/,"").trim();
      const i=h.indexOf(key);
      if(i>=0&&row[i])return row[i].trim();
    }
    return"";
  }
  // Xero's primary contact name field (required, marked with *)
  const contact=get("contactname","contact name","name");
  const first=get("firstname","first name");
  const last=get("lastname","last name","surname");
  const legal=get("legalname","legal name");
  // Build name: prefer ContactName, then First+Last, then LegalName
  const name=contact||(first+" "+last).trim()||legal;
  if(!name||name===".")return null;
  // Xero has postal (PO) and street (SA) addresses - prefer postal
  const addrParts=[
    get("poaddressline1","poaddress line 1","address line 1","saaddressline1","street","streetaddress"),
    get("poaddressline2","poaddress line 2","address line 2","saaddressline2"),
    get("pocity","city","poaddress city","sacity","suburb"),
    get("poregion","region","state","saregion"),
    get("popostalcode","postcode","zip","sapostalcode")
  ].filter(x=>x&&x!==".");
  // Try multiple phone field names, prefer mobile
  const phone=get("mobilenumber","mobile number","mobile","phonenumber","phone number","phone","ddinumber");
  // Detect if this is a company (legal name differs from contact name, or no first/last name)
  const looksLikeCompany = legal && legal!==name;
  return{
    id:Date.now()+Math.random(),
    name:name,
    email:get("emailaddress","email","email address"),
    phone:phone,
    address:addrParts.join(", "),
    company:looksLikeCompany?legal:"",
    notes:"",
    source:"Xero import",
  };
}

    const file=e.target.files[0];

    if(file.size>10*1024*1024){alert("File too large (max 10MB)");return;}
    setUploadStatus({uploading:true,name:file.name});
    const reader=new FileReader();
    reader.onload=ev=>{
      const att={
        id:Date.now(),
        name:file.name,
        size:file.size,
        type:file.type,
        data:ev.target.result, // base64
        uploadedAt:new Date().toISOString(),
      };
      setFm(f=>({...f,attachments:[...(f.attachments||[]),att]}));
      setUploadStatus({success:true,name:file.name});
      setTimeout(()=>setUploadStatus({}),2000);
    };
    reader.onerror=()=>{setUploadStatus({error:"Upload failed"});};
    reader.readAsDataURL(file);
    e.target.value="";
  }

  function removeAttachment(attId){
    setFm(f=>({...f,attachments:f.attachments.filter(a=>a.id!==attId)}));
  }

    const a=document.createElement("a");

      (ev.location?"Location: "+ev.location+"\n":"")+
      (ev.notes?"\nNotes:\n"+ev.notes+"\n":"")+
      (ev.attachments&&ev.attachments.length>0?"\n⚠️ Attachments: "+ev.attachments.map(a=>a.name).join(", ")+"\n(Download from the app)\n":"")+
      "\nCheers,\nFasa\nThe Roof Hub"

// ── LOGIN SCREEN ──────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[email,setEmail]=React.useState("");
  const[password,setPassword]=React.useState("");
  const[error,setError]=React.useState("");
  const[loading,setLoading]=React.useState(false);
  
  async function handleLogin(){
    setError("");
    if(!email||!password){setError("Please enter your email and password");return;}
    setLoading(true);
    try{
      const{data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){setError(error.message);setLoading(false);return;}
      onLogin(data.user);
    }catch(e){
      setError("Connection failed. Check your internet and try again.");
      setLoading(false);
    }
  }
  
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a1a2e 0%,#cc0000 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:16,padding:"32px 28px",width:"100%",maxWidth:400,boxShadow:"0 25px 60px rgba(0,0,0,0.4)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <img src={LOGO} alt="The Roof Hub" style={{height:80,objectFit:"contain",marginBottom:8}}/>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#1a1a2e",letterSpacing:1}}>BUSINESS MANAGER</div>
          <div style={{fontSize:12,color:"#6b7280",marginTop:4}}>Sign in to access your team dashboard</div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="your@email.com" style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"}} autoComplete="email" autoFocus/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="Enter your password" style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"}} autoComplete="current-password"/>
        </div>
        {error&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",color:"#991b1b",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>⚠️ {error}</div>}
        <button onClick={handleLogin} disabled={loading} style={{width:"100%",background:loading?"#9ca3af":"#e85d04",color:"#fff",border:"none",padding:"12px",borderRadius:8,fontWeight:700,fontSize:14,cursor:loading?"wait":"pointer",boxShadow:"0 4px 12px rgba(232,93,4,0.3)"}}>{loading?"Signing in...":"Sign In →"}</button>
        <div style={{marginTop:16,padding:10,background:"#f9fafb",borderRadius:8,fontSize:11,color:"#6b7280",textAlign:"center"}}>
          🔒 Secured by Supabase · Your data syncs across all devices
        </div>
      </div>
    </div>
  );
}

// ── AUTH WRAPPER ──────────────────────────────────────────────
function AuthWrapper(){
  const[user,setUser]=React.useState(null);
  const[checking,setChecking]=React.useState(true);
  
  React.useEffect(()=>{
    if(!sb){setChecking(false);return;}
    // Check if already logged in
    sb.auth.getSession().then(({data})=>{
      if(data.session)setUser(data.session.user);
      setChecking(false);
    });
    // Listen for auth changes
    const{data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{
      setUser(session?.user||null);
    });
    return()=>subscription.unsubscribe();
  },[]);
  
  async function signOut(){
    if(confirm("Sign out of The Roof Hub?")){
      await sb.auth.signOut();
      setUser(null);
    }
  }
  
  if(checking){
    return(
      <div style={{minHeight:"100vh",background:"#f4f5f7",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{textAlign:"center"}}>
          <img src={LOGO} alt="" style={{height:80,objectFit:"contain",opacity:0.7,marginBottom:14}}/>
          <div style={{color:"#6b7280",fontSize:13}}>Loading...</div>
        </div>
      </div>
    );
  }
  
  if(!sb){
    return(
      <div style={{minHeight:"100vh",background:"#f4f5f7",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#fff",borderRadius:12,padding:24,maxWidth:400,textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:10}}>⚠️</div>
          <div style={{fontSize:15,fontWeight:700,color:"#dc2626",marginBottom:8}}>Connection Error</div>
          <div style={{fontSize:12,color:"#6b7280"}}>Could not connect to the cloud. Please check your internet connection and refresh the page.</div>
        </div>
      </div>
    );
  }
  
  if(!user){
    return <LoginScreen onLogin={setUser}/>;
  }
  
  return <App user={user} onSignOut={signOut}/>;
}

function App({user,onSignOut}){
  const[tab,setTab]=React.useState(()=>loadData("tab","calendar"));
  const[jobs,setJobs]=React.useState(()=>loadData("jobs",INIT_JOBS));
  const[ts,setTs]=React.useState(()=>loadData("ts",INIT_TS));
  const[clients,setClients]=React.useState(()=>loadData("clients",[]));
  const[events,setEvents]=React.useState(()=>loadData("events",INIT_EVENTS));
  const[incidents,setIncidents]=React.useState(()=>loadData("incidents",[]));
  const[quotes,setQuotes]=React.useState(()=>loadData("quotes",[]));
  const[certs,setCerts]=React.useState(()=>loadData("certs",[]));
  const[savedIndicator,setSavedIndicator]=React.useState(false);
  const[syncStatus,setSyncStatus]=React.useState("loading"); // loading | synced | syncing | offline
  const initialLoadDone=React.useRef(false);
  
  // ── CLOUD: Initial load when user logs in ────────────────
  React.useEffect(()=>{
    let cancelled=false;
    async function loadFromCloud(){
      setSyncStatus("loading");
      try{
        const[cloudJobs,cloudClients,cloudEvents,cloudTs,cloudIncidents,cloudQuotes,cloudCerts]=await Promise.all([
          cloudLoad("jobs"),
          cloudLoad("clients"),
          cloudLoad("events"),
          cloudLoad("ts"),
          cloudLoad("incidents"),
          cloudLoad("quotes"),
          cloudLoad("certs"),
        ]);
        if(cancelled)return;
        
        // Load local data
        const localJobs=loadData("jobs",[]);
        const localClients=loadData("clients",[]);
        const localEvents=loadData("events",[]);
        const localTs=loadData("ts",[]);
        const localIncidents=loadData("incidents",[]);
        const localQuotes=loadData("quotes",[]);
        const localCerts=loadData("certs",[]);
        
        // Per-table migration: if cloud is empty for a table but local has data, push local up
        // Otherwise, use cloud data
        async function migrateOrLoad(key,cloudData,localData,setter){
          if((cloudData||[]).length===0&&localData.length>0){
            console.log("Migrating "+localData.length+" "+key+" to cloud...");
            const ok=await cloudSyncAll(key,localData);
            if(ok){
              console.log("✓ Migrated "+key);
              setter(localData);
            }else{
              console.error("⚠️ Failed to migrate "+key+", keeping local only");
              setter(localData);
            }
          }else{
            setter(cloudData||localData);
          }
        }
        
        await Promise.all([
          migrateOrLoad("jobs",cloudJobs,localJobs,setJobs),
          migrateOrLoad("clients",cloudClients,localClients,setClients),
          migrateOrLoad("events",cloudEvents,localEvents,setEvents),
          migrateOrLoad("ts",cloudTs,localTs,setTs),
          migrateOrLoad("incidents",cloudIncidents,localIncidents,setIncidents),
          migrateOrLoad("quotes",cloudQuotes,localQuotes,setQuotes),
          migrateOrLoad("certs",cloudCerts,localCerts,setCerts),
        ]);
        
        setSyncStatus("synced");
        initialLoadDone.current=true;
      }catch(e){
        console.error("Initial cloud load failed:",e);
        setSyncStatus("offline");
        initialLoadDone.current=true;
      }
    }
    loadFromCloud();
    return()=>{cancelled=true;};
  },[]);
  
  // Auto-save whenever data changes (local + cloud)
  React.useEffect(()=>{saveData("tab",tab);},[tab]);
  
  // Local save + cloud sync on every data change
  React.useEffect(()=>{
    saveData("jobs",jobs);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("jobs",jobs).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[jobs]);
  React.useEffect(()=>{
    saveData("ts",ts);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("ts",ts).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[ts]);
  React.useEffect(()=>{
    saveData("clients",clients);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("clients",clients).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[clients]);
  React.useEffect(()=>{
    saveData("events",events);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("events",events).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[events]);
  React.useEffect(()=>{
    saveData("incidents",incidents);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("incidents",incidents).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[incidents]);
  React.useEffect(()=>{
    saveData("quotes",quotes);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("quotes",quotes).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[quotes]);
  React.useEffect(()=>{
    saveData("certs",certs);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("certs",certs).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[certs]);
  
  function resetAllData(){
    if(confirm("⚠️ This will reset ALL your data back to the starting demo data. Are you sure? This cannot be undone.")){
      localStorage.removeItem("roofhub_jobs");
      localStorage.removeItem("roofhub_ts");
      localStorage.removeItem("roofhub_tab");
      localStorage.removeItem("roofhub_clients");
      localStorage.removeItem("roofhub_events");
      localStorage.removeItem("roofhub_incidents");
      localStorage.removeItem("roofhub_quotes");
      localStorage.removeItem("roofhub_certs");
      window.location.reload();
    }
  }

  function exportAllData(){
    const data={jobs,ts,clients,events,incidents,quotes,certs,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="roofhub-backup-"+new Date().toISOString().split("T")[0]+".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.jobs&&data.ts){
          if(confirm("This will replace all current data with the backup from "+new Date(data.exportedAt).toLocaleDateString()+". Continue?")){
            setJobs(data.jobs);
            setTs(data.ts);
            if(data.clients)setClients(data.clients);
            if(data.events)setEvents(data.events);
            if(data.incidents)setIncidents(data.incidents);
            if(data.quotes)setQuotes(data.quotes);
            if(data.certs)setCerts(data.certs);
            alert("✓ Data restored successfully!");
          }
        }else{alert("❌ Invalid backup file");}
      }catch(e){alert("❌ Could not read backup file");}
    };
    reader.readAsText(file);
  }

  const tabs=[
    {id:"work",icon:"🔨",label:"Work"},
    {id:"safety",icon:"📋",label:"Safety"},
    {id:"time",icon:"⏱️",label:"Time"},
    {id:"team",icon:"👥",label:"Team"},
  ];
  
  // Sub-tabs for each main section
  const subTabs={
    work:[
      {id:"calendar",icon:"🗓️",label:"Calendar"},
      {id:"jobs",icon:"🔨",label:"Jobs"},
      {id:"schedule",icon:"👷",label:"Schedule"},
      {id:"events",icon:"📅",label:"Events"},
    ],
    safety:[
      {id:"toolbox",icon:"📋",label:"Toolbox"},
      {id:"sssp",icon:"⚠️",label:"SSSP"},
      {id:"forms",icon:"📄",label:"Forms"},
    ],
    team:[
      {id:"staff",icon:"👥",label:"Staff"},
      {id:"clients",icon:"👤",label:"Clients"},
    ],
  };
  
  // Migrate old single tab names to new main/sub structure
  const tabMigration={
    jobs:{main:"work",sub:"jobs"},
    calendar:{main:"work",sub:"calendar"},
    schedule:{main:"work",sub:"schedule"},
    events:{main:"work",sub:"events"},
    toolbox:{main:"safety",sub:"toolbox"},
    sssp:{main:"safety",sub:"sssp"},
    forms:{main:"safety",sub:"forms"},
    time:{main:"time",sub:"time"},
    clients:{main:"team",sub:"clients"},
    staff:{main:"team",sub:"staff"},
    team:{main:"team",sub:"staff"},
  };
  
  // Figure out which main & sub tab based on current `tab` state
  const current=tabMigration[tab]||{main:"work",sub:"jobs"};
  const mainTab=current.main;
  const activeSub=current.sub;
  
  function switchMain(newMain){
    // Use first sub-tab of new main section
    if(newMain==="time"){setTab("time");return;}
    const firstSub=(subTabs[newMain]||[])[0];
    if(firstSub)setTab(firstSub.id);
  }
  function switchSub(newSub){setTab(newSub);}
  
  const pendingSSSP = jobs.filter(j=>j.ssspRequired&&!j.ssspCompleted).length;
  return(
    <div style={{minHeight:"100vh",background:"#f4f5f7"}}>
      <Header savedIndicator={savedIndicator} syncStatus={syncStatus} user={user} onBackup={exportAllData} onRestore={importData} onReset={resetAllData} onSignOut={onSignOut}/>
      <StatBar jobs={jobs}/>
      {pendingSSSP>0&&<div style={{background:"#fef2f2",borderBottom:"1px solid #fca5a5",padding:"8px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:16}}>⚠️</span>
          <span style={{fontSize:12,fontWeight:700,color:"#991b1b"}}>{pendingSSSP} job{pendingSSSP>1?"s":""} pending SSSP</span>
        </div>
        <button onClick={()=>setTab("sssp")} style={{background:"#dc2626",color:"#fff",border:"none",padding:"5px 12px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer"}}>View →</button>
      </div>}
      
      {/* Sub-tab bar (if main section has multiple sub-tabs) */}
      {subTabs[mainTab]&&subTabs[mainTab].length>1&&(
        <div style={{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"8px 12px",display:"flex",gap:6,overflowX:"auto"}}>
          {subTabs[mainTab].map(st=>(
            <button key={st.id} onClick={()=>switchSub(st.id)} style={{border:"none",padding:"7px 14px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:700,background:activeSub===st.id?"#e85d04":"#f4f5f7",color:activeSub===st.id?"#fff":"#6b7280",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
              <span>{st.icon}</span>{st.label}
            </button>
          ))}
        </div>
      )}
      
      <div style={{padding:"14px 14px 80px",maxWidth:860,margin:"0 auto"}}>
        {tab==="jobs"&&<JobsView jobs={jobs} setJobs={setJobs} clients={clients}/>}
        {tab==="calendar"&&<CalendarView jobs={jobs} setJobs={setJobs} clients={clients} events={events}/>}
        {tab==="schedule"&&<ScheduleView jobs={jobs} setJobs={setJobs} events={events}/>}
        {tab==="events"&&<EventsView events={events} setEvents={setEvents}/>}
        {tab==="clients"&&<ClientsView clients={clients} setClients={setClients} jobs={jobs}/>}
        {tab==="toolbox"&&<ToolboxView jobs={jobs}/>}
        {tab==="sssp"&&<SSSPView jobs={jobs} setJobs={setJobs}/>}
        {tab==="time"&&<TimesheetsView jobs={jobs} ts={ts} setTs={setTs}/>}
        {tab==="forms"&&<FormsView jobs={jobs} clients={clients} incidents={incidents} setIncidents={setIncidents} quotes={quotes} setQuotes={setQuotes} setJobs={setJobs} setTab={setTab}/>}
        {(tab==="staff"||tab==="team")&&<TeamView ts={ts} jobs={jobs} certs={certs} setCerts={setCerts}/>}
      </div>
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1px solid #e5e7eb",display:"flex",justifyContent:"space-around",padding:"8px 0 10px",boxShadow:"0 -2px 10px rgba(0,0,0,0.06)"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>switchMain(t.id)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"2px 10px",flex:1}}>
            <span style={{fontSize:24}}>{t.icon}</span>
            <span style={{fontSize:11,fontWeight:700,color:mainTab===t.id?"#e85d04":"#9ca3af",letterSpacing:0.3,textTransform:"uppercase"}}>{t.label}</span>
            {mainTab===t.id&&<div style={{width:22,height:3,background:"#e85d04",borderRadius:2}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthWrapper/>);
</script>
</body>
</html>
