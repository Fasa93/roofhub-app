      </div>

      {showAdd&&<div style={card}>
        <SHd t="⚡ Quick Schedule Job"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div><label style={lb}>Client Name</label><input value={fm.client} onChange={e=>setFm(f=>({...f,client:e.target.value}))} style={inp} placeholder="Client name..."/></div>
          <div><label style={lb}>Phone</label><input value={fm.phone} onChange={e=>setFm(f=>({...f,phone:e.target.value}))} style={inp} placeholder="021 XXX XXXX"/></div>
          <div style={{gridColumn:"span 2"}}>
            <label style={lb}>🔍 Site Address (auto-suggests NZ addresses)</label>
            <AddressInput value={fm.address} onChange={v=>setFm(f=>({...f,address:v}))} placeholder="Start typing... e.g. 14 Queen Street"/>
          </div>
          <div><label style={lb}>Job Type</label><select value={fm.type} onChange={e=>setFm(f=>({...f,type:e.target.value}))} style={inp}>{JT.map(t=><option key={t}>{t}</option>)}</select></div>
          <div><label style={lb}>Date</label><input type="date" value={fm.date} onChange={e=>setFm(f=>({...f,date:e.target.value}))} style={inp}/></div>
        </div>
        <label style={lb}>Assign Staff</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12,marginTop:6}}>
          {STAFF.map(s=>(
            <button key={s.id} onClick={()=>setFm(f=>({...f,staff:f.staff.includes(s.id)?f.staff.filter(x=>x!==s.id):[...f.staff,s.id]}))} style={{padding:"5px 14px",borderRadius:20,border:"2px solid "+(fm.staff.includes(s.id)?s.color:"#e5e7eb"),cursor:"pointer",fontSize:12,fontWeight:600,background:fm.staff.includes(s.id)?s.color:"#fff",color:fm.staff.includes(s.id)?"#fff":"#6b7280",display:"flex",alignItems:"center",gap:5}}>
              <Av sid={s.id} size={18}/>{s.name.split(" ")[0]}
            </button>
          ))}
        </div>
        <label style={lb}>Notes</label>
        <textarea value={fm.notes} onChange={e=>setFm(f=>({...f,notes:e.target.value}))} rows={2} style={{...inp,resize:"vertical",marginBottom:14}} placeholder="Site notes..."/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={save} style={{background:"#e85d04",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>Schedule Job</button>
          <button onClick={()=>{setShowAdd(false);setFm(bl);}} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"9px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
        </div>
      </div>}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        {STAFF.map(s=>{
          const sj=up.filter(j=>j.staff.includes(s.id));
          return(
            <div key={s.id} style={{...card,borderTop:"4px solid "+s.color,marginBottom:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <Av sid={s.id} size={32}/>
                <div style={{flex:1}}>
                  <div style={{color:"#111827",fontWeight:700,fontSize:13}}>{s.name}</div>
                  <div style={{color:s.color,fontSize:10,fontWeight:600,textTransform:"uppercase"}}>{s.role}</div>
                </div>
                <span style={{background:s.color+"18",color:s.color,fontSize:12,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{sj.length}</span>
              </div>
              {sj.length===0&&<div style={{color:"#9ca3af",fontSize:12,fontStyle:"italic",textAlign:"center",padding:"8px 0"}}>✅ Available</div>}
              {sj.map(j=>(
                <div key={j.id} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:"8px 10px",marginBottom:6}}>
                  <div style={{color:"#111827",fontSize:12,fontWeight:600}}>{j.client}</div>
                  <div style={{color:"#9ca3af",fontSize:11}}>📅 {j.date} · {j.type}</div>
                  <div style={{color:"#9ca3af",fontSize:10,marginTop:2}}>📍 {j.address}</div>
                </div>
              ))}
            </div>
          );
        })}
      </div>
      <div style={card}>
        <SHd t="🔄 Reassign Jobs" color="#1a1a2e"/>
        {up.length===0&&<div style={{color:"#9ca3af",textAlign:"center",padding:20,fontStyle:"italic"}}>No upcoming jobs to reassign</div>}
        {up.map(j=>(
          <div key={j.id} style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"10px 0",borderBottom:"1px solid #f3f4f6"}}>
            <div style={{flex:1}}>
              <div style={{color:"#111827",fontWeight:700,fontSize:14}}>{j.client}</div>
              <div style={{color:"#9ca3af",fontSize:12}}>{j.date} · {j.type}</div>
            </div>
            <select defaultValue={j.staff[0]||""} onChange={e=>setJobs(jobs.map(x=>x.id===j.id?{...x,staff:[parseInt(e.target.value)]}:x))} style={{...inp,width:"auto",padding:"6px 12px"}}>
              <option value="">Unassigned</option>
              {STAFF.map(s=><option key={s.id} value={s.id}>{s.name} — {s.role}</option>)}
            </select>
          </div>
        ))}
      </div>
    </div>
  );
}

function TimesheetsView({jobs,ts,setTs}){
  const[wk,setWk]=React.useState(0);
  const[sa,setSa]=React.useState(false);
  const[err,setErr]=React.useState("");
  const[selStaff,setSelStaff]=React.useState(null);
  const bl={staffId:"",jobId:"",date:new Date().toISOString().split("T")[0],clockIn:"",clockOut:"",travel:0,notes:""};
  const[en,setEn]=React.useState(bl);
  const today=new Date();const mon=new Date(today);mon.setDate(today.getDate()-today.getDay()+1+wk*7);
  const ws=mon.toISOString().split("T")[0];const we=new Date(mon.getTime()+6*86400000).toISOString().split("T")[0];
  const wl=mon.toLocaleDateString("en-NZ",{day:"numeric",month:"short"})+" – "+new Date(mon.getTime()+6*86400000).toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"});
  const filt=ts.filter(t=>t.date>=ws&&t.date<=we&&(!selStaff||t.staffId===selStaff));
  const totH=t=>t.reduce((a,x)=>a+calcH(x.clockIn,x.clockOut),0).toFixed(1);
  function add(){
    setErr("");
    const missing=[];
    if(!en.staffId)missing.push("Staff member");
    if(!en.date)missing.push("Date");
    if(!en.clockIn)missing.push("Clock in time");
    if(!en.clockOut)missing.push("Clock out time");
    if(missing.length>0){setErr("Please fill in: "+missing.join(", "));return;}
    // Validate clock out is after clock in
    if(en.clockOut<=en.clockIn){setErr("Clock out time must be after clock in time");return;}
    setTs(t=>[...t,{...en,id:Date.now(),staffId:parseInt(en.staffId),jobId:parseInt(en.jobId)||null,approved:false}]);
    setEn(bl);setSa(false);setErr("");
  }
  return(
    <div>
      <div style={{...card,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={()=>setWk(w=>w-1)} style={{background:"#f9fafb",color:"#374151",border:"1px solid #e5e7eb",fontSize:18,width:36,height:36,borderRadius:8,cursor:"pointer"}}>‹</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:800,fontSize:20,color:"#1a1a2e"}}>WEEK</div>
            <div style={{color:"#6b7280",fontSize:12}}>{wl}</div>
          </div>
          <button onClick={()=>setWk(w=>w+1)} style={{background:"#f9fafb",color:"#374151",border:"1px solid #e5e7eb",fontSize:18,width:36,height:36,borderRadius:8,cursor:"pointer"}}>›</button>
        </div>
      </div>
      {/* Staff summary cards — click to filter */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
        {STAFF.map(s=>{
          const sh=ts.filter(t=>t.date>=ws&&t.date<=we&&t.staffId===s.id);
          const hrs=sh.reduce((a,t)=>a+calcH(t.clockIn,t.clockOut)+(t.travel||0)/60,0).toFixed(1);
          const isSel=selStaff===s.id;
          return(
            <div key={s.id} onClick={()=>setSelStaff(isSel?null:s.id)} style={{...card,textAlign:"center",padding:12,marginBottom:0,borderTop:"3px solid "+s.color,cursor:"pointer",background:isSel?s.color+"15":"#fff",boxShadow:isSel?"0 0 0 2px "+s.color:""}}>
              <Av sid={s.id} size={28}/>
              <div style={{color:"#374151",fontSize:12,fontWeight:600,marginTop:6}}>{s.name.split(" ")[0]}</div>
              <div style={{color:s.color,fontSize:22,fontWeight:800,fontFamily:"'Barlow Condensed',sans-serif"}}>{hrs}h</div>
              {isSel&&<div style={{fontSize:9,color:s.color,fontWeight:700,textTransform:"uppercase",marginTop:2}}>✓ Selected</div>}
            </div>
          );
        })}
      </div>
      
      {/* Selected staff breakdown */}
      {selStaff&&(()=>{
        const s=STAFF.find(x=>x.id===selStaff);
        if(!s)return null;
        const staffTs=ts.filter(t=>t.date>=ws&&t.date<=we&&t.staffId===selStaff).sort((a,b)=>a.date.localeCompare(b.date));
        const totalH=staffTs.reduce((a,t)=>a+calcH(t.clockIn,t.clockOut)+(t.travel||0)/60,0);
        const approvedH=staffTs.filter(t=>t.approved).reduce((a,t)=>a+calcH(t.clockIn,t.clockOut)+(t.travel||0)/60,0);
        const pendingH=totalH-approvedH;
        const ordinary=Math.min(totalH,40);
        const overtime=Math.max(0,totalH-40);
        
        // Day-by-day
        const days=[];
        for(let i=0;i<7;i++){
          const d=new Date(mon);d.setDate(mon.getDate()+i);
          const dateStr=d.toISOString().split("T")[0];
          const dayTs=staffTs.filter(t=>t.date===dateStr);
          const dayH=dayTs.reduce((a,t)=>a+calcH(t.clockIn,t.clockOut)+(t.travel||0)/60,0);
          days.push({date:dateStr,dayName:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i],dayNum:d.getDate(),hours:dayH,entries:dayTs,isToday:dateStr===new Date().toISOString().split("T")[0],isWeekend:i>=5});
        }
        
        const jobsWorked=[...new Set(staffTs.map(t=>t.jobId).filter(Boolean))].map(jid=>jobs.find(j=>j.id===jid)).filter(Boolean);
        
        return(
          <div style={{...card,borderTop:"4px solid "+s.color,marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
              <Av sid={s.id} size={44}/>
              <div style={{flex:1}}>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#1a1a2e"}}>{s.name}</div>
                <div style={{color:s.color,fontSize:11,fontWeight:700,textTransform:"uppercase"}}>{s.role} · {wl}</div>
              </div>
              <button onClick={()=>setSelStaff(null)} style={{background:"#f4f5f7",border:"1px solid #e5e7eb",padding:"6px 12px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",color:"#6b7280"}}>✕ Close</button>
            </div>
            
            {/* Hours stats */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:14}}>
              <div style={{background:s.color+"10",borderRadius:8,padding:"10px 6px",textAlign:"center",border:"1px solid "+s.color+"30"}}>
                <div style={{fontSize:20,fontWeight:800,color:s.color,fontFamily:"'Barlow Condensed',sans-serif"}}>{totalH.toFixed(1)}h</div>
                <div style={{fontSize:9,color:"#6b7280",fontWeight:700,textTransform:"uppercase"}}>Total Hours</div>
              </div>
              <div style={{background:"#f0fdf4",borderRadius:8,padding:"10px 6px",textAlign:"center",border:"1px solid #bbf7d0"}}>
                <div style={{fontSize:20,fontWeight:800,color:"#16a34a",fontFamily:"'Barlow Condensed',sans-serif"}}>{approvedH.toFixed(1)}h</div>
                <div style={{fontSize:9,color:"#6b7280",fontWeight:700,textTransform:"uppercase"}}>Approved</div>
              </div>
              <div style={{background:"#fef3c7",borderRadius:8,padding:"10px 6px",textAlign:"center",border:"1px solid #fde68a"}}>
                <div style={{fontSize:20,fontWeight:800,color:"#d97706",fontFamily:"'Barlow Condensed',sans-serif"}}>{pendingH.toFixed(1)}h</div>
                <div style={{fontSize:9,color:"#6b7280",fontWeight:700,textTransform:"uppercase"}}>Pending</div>
              </div>
            </div>
            
            {overtime>0&&<div style={{background:"#fef3c7",border:"1px solid #fde68a",padding:"8px 12px",borderRadius:6,fontSize:11,color:"#92400e",fontWeight:600,marginBottom:14}}>
              ⚠️ Overtime: {overtime.toFixed(1)}h this week ({ordinary.toFixed(1)}h ordinary + {overtime.toFixed(1)}h OT)
            </div>}
            
            {/* Day-by-day grid */}
            <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6,textTransform:"uppercase"}}>Daily Breakdown</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:14}}>
              {days.map(d=>(
                <div key={d.date} style={{background:d.isToday?s.color+"15":d.isWeekend?"#f9fafb":"#fff",border:"1px solid "+(d.isToday?s.color:"#e5e7eb"),borderRadius:6,padding:"6px 3px",textAlign:"center",opacity:d.hours===0?0.5:1}}>
                  <div style={{fontSize:9,color:"#6b7280",fontWeight:700,textTransform:"uppercase"}}>{d.dayName}</div>
                  <div style={{fontSize:12,color:"#111827",fontWeight:700,margin:"2px 0"}}>{d.dayNum}</div>
                  <div style={{fontSize:10,fontWeight:700,color:d.hours>0?s.color:"#d1d5db"}}>{d.hours>0?d.hours.toFixed(1)+"h":"—"}</div>
                </div>
              ))}
            </div>
            
            {/* Entries list */}
            {staffTs.length>0?(
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6,textTransform:"uppercase"}}>Entries ({staffTs.length})</div>
                {staffTs.map(t=>{
                  const j=jobs.find(x=>x.id===t.jobId);
                  const h=calcH(t.clockIn,t.clockOut)+(t.travel||0)/60;
                  return(
                    <div key={t.id} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:6,padding:10,marginBottom:6}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:700,color:"#111827"}}>{new Date(t.date).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"})} · {t.clockIn||"—"} to {t.clockOut||"—"}</div>
                          {j&&<div style={{fontSize:11,color:"#6b7280",marginTop:2}}>🔨 {j.client} — {j.type}</div>}
                          {t.travel>0&&<div style={{fontSize:10,color:"#9ca3af",marginTop:1}}>+ {t.travel}min travel</div>}
                          {t.notes&&<div style={{fontSize:10,color:"#6b7280",marginTop:3,fontStyle:"italic"}}>"{t.notes}"</div>}
                        </div>
                        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                          <div style={{fontSize:14,fontWeight:800,color:s.color,fontFamily:"'Barlow Condensed',sans-serif"}}>{h.toFixed(1)}h</div>
                          <span style={{background:t.approved?"#f0fdf4":"#fef3c7",color:t.approved?"#16a34a":"#92400e",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:8}}>{t.approved?"✓ APPROVED":"⏳ PENDING"}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ):(
              <div style={{textAlign:"center",padding:20,color:"#9ca3af",fontSize:12,fontStyle:"italic",background:"#f9fafb",borderRadius:8}}>
                No hours logged for {s.name.split(" ")[0]} this week. Tap + Add Entry to log hours.
              </div>
            )}
            
            {/* Jobs worked */}
            {jobsWorked.length>0&&<div style={{marginTop:14}}>
              <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6,textTransform:"uppercase"}}>🔨 Jobs This Week ({jobsWorked.length})</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {jobsWorked.map(j=>(
                  <div key={j.id} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:14,padding:"5px 10px",fontSize:11,color:"#374151"}}>
                    {j.client} · {j.type}
                  </div>
                ))}
              </div>
            </div>}
          </div>
        );
      })()}
      
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:"#374151"}}>
          {selStaff?"All Entries (filtered)":"Timesheet Entries"}
        </div>
        <button onClick={()=>{setSa(s=>!s);if(!sa&&selStaff)setEn(f=>({...f,staffId:selStaff}));}} style={{border:"none",padding:"7px 16px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:700,background:"#e85d04",color:"#fff"}}>+ Add Entry</button>
      </div>
      {sa&&<div style={card}>
        <SHd t="New Timesheet Entry"/>
        {err&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",color:"#991b1b",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:12,fontWeight:600}}>⚠️ {err}</div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div><label style={lb}>Staff Member *</label><select value={en.staffId} onChange={e=>setEn(f=>({...f,staffId:e.target.value}))} style={inp}><option value="">Select staff...</option>{STAFF.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
          <div><label style={lb}>Linked Job</label><select value={en.jobId} onChange={e=>setEn(f=>({...f,jobId:e.target.value}))} style={inp}><option value="">No job linked</option>{jobs.map(j=><option key={j.id} value={j.id}>{j.client}</option>)}</select></div>
          <div><label style={lb}>Date *</label><input type="date" value={en.date} onChange={e=>setEn(f=>({...f,date:e.target.value}))} style={inp}/></div>
          <div><label style={lb}>Clock In *</label><input type="time" value={en.clockIn} onChange={e=>setEn(f=>({...f,clockIn:e.target.value}))} style={inp}/></div>
          <div><label style={lb}>Clock Out *</label><input type="time" value={en.clockOut} onChange={e=>setEn(f=>({...f,clockOut:e.target.value}))} style={inp}/></div>
          <div><label style={lb}>Travel Time (mins)</label><input type="number" value={en.travel} onChange={e=>setEn(f=>({...f,travel:parseInt(e.target.value)||0}))} style={inp}/></div>
        </div>
        {/* Quick time buttons */}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10,alignItems:"center"}}>
          <span style={{fontSize:11,color:"#6b7280",fontWeight:600}}>Quick fill:</span>
          <button onClick={()=>setEn(f=>({...f,clockIn:"07:00",clockOut:"15:30"}))} style={{background:"#f0fdf4",color:"#16a34a",border:"1px solid #bbf7d0",padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>Standard 7-3:30</button>
          <button onClick={()=>setEn(f=>({...f,clockIn:"06:45",clockOut:"16:00"}))} style={{background:"#f0fdf4",color:"#16a34a",border:"1px solid #bbf7d0",padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>Long 6:45-4</button>
          <button onClick={()=>setEn(f=>({...f,clockIn:"07:00",clockOut:"12:00"}))} style={{background:"#eff6ff",color:"#2563eb",border:"1px solid #bfdbfe",padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>Half 7-12</button>
        </div>
        <label style={{...lb,marginTop:10}}>Notes</label>
        <input value={en.notes} onChange={e=>setEn(f=>({...f,notes:e.target.value}))} style={{...inp,marginTop:4,marginBottom:14}} placeholder="e.g. materials run, delay on site..."/>
        {/* Live hours preview */}
        {en.clockIn&&en.clockOut&&en.clockOut>en.clockIn&&<div style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:10,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:12,color:"#6b7280",fontWeight:600}}>Hours worked:</span>
          <span style={{fontSize:16,fontWeight:800,color:"#e85d04",fontFamily:"'Barlow Condensed',sans-serif"}}>{(calcH(en.clockIn,en.clockOut)+(en.travel||0)/60).toFixed(2)}h {en.travel>0?"(incl. "+en.travel+"min travel)":""}</span>
        </div>}
        <div style={{display:"flex",gap:8}}>
          <button onClick={add} style={{background:"#e85d04",color:"#fff",border:"none",padding:"9px 20px",borderRadius:8,fontWeight:700,cursor:"pointer"}}>💾 Save Entry</button>
          <button onClick={()=>{setSa(false);setErr("");setEn(bl);}} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"9px 14px",borderRadius:8,cursor:"pointer"}}>Cancel</button>
        </div>
      </div>}
      {filt.length===0&&<div style={{...card,textAlign:"center",padding:30,color:"#9ca3af",fontStyle:"italic"}}>No entries this week</div>}
      {filt.map(t=>{
        const s=STAFF.find(x=>x.id===t.staffId);
        const j=jobs.find(x=>x.id===t.jobId);
        const hrs=calcH(t.clockIn,t.clockOut);
        const ov=hrs>8;
        return(
          <div key={t.id} style={{...card,borderLeft:"4px solid "+(t.approved?"#16a34a":ov?"#dc2626":"#e85d04")}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <Av sid={t.staffId} size={32}/>
                <div>
                  <div style={{color:"#111827",fontWeight:700,fontSize:14}}>{s?.name}</div>
                  <div style={{color:"#6b7280",fontSize:12}}>{t.date} · {j?j.client:"No job linked"}</div>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{color:ov?"#dc2626":"#16a34a",fontSize:22,fontWeight:800,fontFamily:"'Barlow Condensed',sans-serif"}}>{hrs.toFixed(1)}h</div>
                {ov&&<div style={{color:"#dc2626",fontSize:10,fontWeight:700}}>OVERTIME</div>}
              </div>
            </div>
            <div style={{display:"flex",gap:12,marginTop:8,flexWrap:"wrap"}}>
              <span style={{color:"#6b7280",fontSize:12}}>⏰ {t.clockIn} – {t.clockOut}</span>
              {t.travel>0&&<span style={{color:"#6b7280",fontSize:12}}>🚗 {t.travel} min travel</span>}
              {t.notes&&<span style={{color:"#9ca3af",fontSize:12,fontStyle:"italic"}}>{t.notes}</span>}
            </div>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button onClick={()=>setTs(x=>x.map(y=>y.id===t.id?{...y,approved:!y.approved}:y))} style={{fontSize:12,padding:"5px 14px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,background:t.approved?"#f0fdf4":"#e85d04",color:t.approved?"#16a34a":"#fff"}}>{t.approved?"✓ Approved":"Approve"}</button>
              <button onClick={()=>setTs(x=>x.filter(y=>y.id!==t.id))} style={{fontSize:12,padding:"5px 12px",borderRadius:8,border:"1px solid #fecaca",cursor:"pointer",background:"#fef2f2",color:"#dc2626"}}>Delete</button>
            </div>
          </div>
        );
      })}
      {filt.length>0&&(
        <div style={{...card,background:"#f9fafb"}}>
          <div style={{display:"flex",justifyContent:"space-around",textAlign:"center"}}>
            <div><div style={{color:"#16a34a",fontSize:28,fontWeight:800,fontFamily:"'Barlow Condensed',sans-serif"}}>{totH(filt)}h</div><div style={{color:"#6b7280",fontSize:11,fontWeight:600}}>TOTAL HOURS</div></div>
            <div><div style={{color:"#2563eb",fontSize:28,fontWeight:800,fontFamily:"'Barlow Condensed',sans-serif"}}>{filt.reduce((a,t)=>a+(t.travel||0),0)}min</div><div style={{color:"#6b7280",fontSize:11,fontWeight:600}}>TRAVEL TIME</div></div>
            <div><div style={{color:"#e85d04",fontSize:28,fontWeight:800,fontFamily:"'Barlow Condensed',sans-serif"}}>{filt.filter(t=>t.approved).length}/{filt.length}</div><div style={{color:"#6b7280",fontSize:11,fontWeight:600}}>APPROVED</div></div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── INCIDENT REGISTER (WorkSafe NZ compliant) ─────────────
const INCIDENT_TYPES = {
  "injury":{label:"Injury",icon:"🩹",color:"#dc2626"},
  "near-miss":{label:"Near Miss",icon:"⚠️",color:"#d97706"},
  "property-damage":{label:"Property Damage",icon:"🏚️",color:"#7c3aed"},
  "equipment":{label:"Equipment Failure",icon:"🔧",color:"#0891b2"},
  "environment":{label:"Environmental",icon:"🌿",color:"#16a34a"},
  "vehicle":{label:"Vehicle Incident",icon:"🚗",color:"#2563eb"},
  "other":{label:"Other",icon:"📝",color:"#6b7280"},
};
const INCIDENT_SEVERITY = {
  "minor":{label:"Minor",color:"#16a34a",bg:"#f0fdf4"},
  "moderate":{label:"Moderate",color:"#d97706",bg:"#fef3c7"},
  "serious":{label:"Serious",color:"#dc2626",bg:"#fef2f2"},
  "notifiable":{label:"Notifiable to WorkSafe",color:"#991b1b",bg:"#fef2f2"},
};

function IncidentRegister({incidents,setIncidents,jobs,onBack}){
  const[showForm,setShowForm]=React.useState(false);
  const[editing,setEditing]=React.useState(null);
  const[selected,setSelected]=React.useState(null);
  const[yearFilter,setYearFilter]=React.useState("all");
  const[typeFilter,setTypeFilter]=React.useState("all");
  const bl={
    date:new Date().toISOString().split("T")[0],
    time:"",
    type:"near-miss",
    severity:"minor",
    location:"",
    address:"",
    personInvolved:"",
    personRole:"",
    witnesses:"",
    description:"",
    immediateAction:"",
    contributingFactors:"",
    preventativeAction:"",
    reportedBy:"Fasa Sopi",
    reportedDate:new Date().toISOString().split("T")[0],
    linkedJobId:"",
    worksafeNotified:false,
    worksafeRefNumber:"",
    closedOut:false,
    closedOutDate:"",
    closedOutBy:"",
    photos:[],
  };
  const[fm,setFm]=React.useState(bl);

  function openAdd(){setEditing(null);setFm(bl);setShowForm(true);}
  function openEdit(inc){setEditing(inc);setFm({...bl,...inc});setShowForm(true);setSelected(null);}
  function save(){
    if(!fm.date||!fm.description){alert("Please fill in at least the date and description.");return;}
    if(editing){
      setIncidents(incidents.map(i=>i.id===editing.id?{...editing,...fm}:i));
    }else{
      setIncidents(i=>[...i,{...fm,id:Date.now()}]);
    }
    setShowForm(false);setEditing(null);setFm(bl);
  }
  function del(inc){
    if(confirm("Delete this incident record? This cannot be undone — incidents should generally be kept for 5+ years per WorkSafe NZ requirements.")){
      setIncidents(incidents.filter(i=>i.id!==inc.id));
      setSelected(null);
    }
  }
  function closeOut(inc){
    const date=prompt("Closeout date (YYYY-MM-DD):",new Date().toISOString().split("T")[0]);
    if(!date)return;
    const by=prompt("Closed out by:","Fasa Sopi");
    if(!by)return;
    const updated={...inc,closedOut:true,closedOutDate:date,closedOutBy:by};
    setIncidents(incidents.map(i=>i.id===inc.id?updated:i));
    setSelected(updated);
  }
  
  function generatePDF(inc){
    const win=window.open("","_blank");
    if(!win)return;
    const t=INCIDENT_TYPES[inc.type]||INCIDENT_TYPES.other;
    const sev=INCIDENT_SEVERITY[inc.severity]||INCIDENT_SEVERITY.minor;
    const linkedJob=inc.linkedJobId?jobs.find(j=>j.id.toString()===inc.linkedJobId.toString()):null;
    const row=(label,value)=>'<tr><td style="font-weight:700;padding:8px 10px;background:#f9fafb;width:40%;border:1px solid #ddd;font-size:12px;">'+label+'</td><td style="padding:8px 10px;border:1px solid #ddd;font-size:12px;white-space:pre-wrap;">'+(value||"—")+'</td></tr>';
    win.document.write('<!DOCTYPE html><html><head><title>Incident Report<\/title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;}.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:3px solid #dc2626;}.biz{text-align:right;font-size:11px;color:#555;line-height:1.7;}.content{padding:20px 30px;}h1{font-size:22px;font-weight:800;color:#dc2626;margin-bottom:4px;}.sub{color:#6b7280;margin-bottom:20px;font-size:12px;}h2{font-size:14px;color:#dc2626;border-bottom:1px solid #dc2626;padding-bottom:4px;margin-top:20px;margin-bottom:10px;}table{width:100%;border-collapse:collapse;margin-bottom:10px;}.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-right:6px;}.tag-'+inc.severity+'{background:'+sev.bg+';color:'+sev.color+';}.foot{margin-top:30px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#999;}<\/style><\/head><body><div class="hdr"><img src="'+LOGO+'" style="height:100px;object-fit:contain;"/><div class="biz"><strong style="font-size:13px;color:#1a1a1a;">The Roof Hub Limited<\/strong><br/>98 Hillsborough Road, Hillsborough, Auckland 1042<br/>fasa@theroofhub.co.nz · 02041739390<\/div><\/div><div class="content"><h1>⚠️ Incident Report</h1><div class="sub">WorkSafe NZ Compliant — Health & Safety at Work Act 2015</div><div><span class="badge tag-'+inc.severity+'">'+sev.label+'</span><span class="badge" style="background:#f3f4f6;color:#374151;">'+t.icon+' '+t.label+'</span>'+(inc.closedOut?'<span class="badge" style="background:#f0fdf4;color:#16a34a;">✓ Closed Out</span>':'<span class="badge" style="background:#fef3c7;color:#92400e;">Open</span>')+'<\/div><h2>Incident Details<\/h2><table>'+row("Date of Incident",inc.date)+row("Time",inc.time)+row("Type",t.label)+row("Severity",sev.label)+row("Location",inc.location)+row("Site Address",inc.address)+(linkedJob?row("Linked Job",linkedJob.client+" — "+linkedJob.type):"")+'<\/table><h2>People Involved<\/h2><table>'+row("Person(s) Involved",inc.personInvolved)+row("Role / Position",inc.personRole)+row("Witnesses",inc.witnesses)+'<\/table><h2>What Happened<\/h2><table>'+row("Description",inc.description)+row("Immediate Action Taken",inc.immediateAction)+row("Contributing Factors",inc.contributingFactors)+row("Preventative Action",inc.preventativeAction)+'<\/table><h2>Reporting<\/h2><table>'+row("Reported By",inc.reportedBy)+row("Date Reported",inc.reportedDate)+row("WorkSafe Notified",inc.worksafeNotified?"Yes":"No")+(inc.worksafeRefNumber?row("WorkSafe Reference",inc.worksafeRefNumber):"")+'<\/table>'+(inc.closedOut?'<h2>Closeout<\/h2><table>'+row("Closed Out Date",inc.closedOutDate)+row("Closed Out By",inc.closedOutBy)+'<\/table>':"")+'<div class="foot">This report is part of The Roof Hub Limited\'s incident register as required under the Health & Safety at Work Act 2015. Records are retained for a minimum of 5 years.<br/>Generated: '+new Date().toLocaleString("en-NZ")+'<\/div><\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>');
    win.document.close();
  }
  
  function exportCSV(){
    const h=["Date","Time","Type","Severity","Location","Address","Person Involved","Description","Immediate Action","Preventative Action","Reported By","WorkSafe Notified","Closed Out","Closed Out Date"];
    const rows=incidents.map(i=>[i.date,i.time,INCIDENT_TYPES[i.type]?.label||i.type,INCIDENT_SEVERITY[i.severity]?.label||i.severity,i.location,i.address,i.personInvolved,i.description,i.immediateAction,i.preventativeAction,i.reportedBy,i.worksafeNotified?"Yes":"No",i.closedOut?"Yes":"No",i.closedOutDate]);
    const csv=[h,...rows].map(r=>r.map(x=>'"'+String(x||"").replace(/"/g,'""')+'"').join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="incident-register-"+new Date().toISOString().split("T")[0]+".csv";a.click();URL.revokeObjectURL(url);
  }

  // Build list of years available (4 years back + current)
  const currentYear=new Date().getFullYear();
  const years=[];
  for(let y=currentYear;y>=currentYear-4;y--)years.push(y);
  incidents.forEach(i=>{const y=new Date(i.date).getFullYear();if(!years.includes(y))years.push(y);});
  years.sort((a,b)=>b-a);

  // Filter
  const filtered=incidents.filter(i=>{
    if(yearFilter!=="all"&&new Date(i.date).getFullYear().toString()!==yearFilter)return false;
    if(typeFilter!=="all"&&i.type!==typeFilter)return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  const stats={
    total:incidents.length,
    open:incidents.filter(i=>!i.closedOut).length,
    thisYear:incidents.filter(i=>new Date(i.date).getFullYear()===currentYear).length,
    notifiable:incidents.filter(i=>i.severity==="notifiable").length,
  };

  // DETAIL VIEW
  if(selected){
    const t=INCIDENT_TYPES[selected.type]||INCIDENT_TYPES.other;
    const sev=INCIDENT_SEVERITY[selected.severity]||INCIDENT_SEVERITY.minor;
    const linkedJob=selected.linkedJobId?jobs.find(j=>j.id.toString()===selected.linkedJobId.toString()):null;
    return(
      <div>
        <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Register</button>
        <div style={{...card,borderLeft:"4px solid "+sev.color}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                <span style={{background:sev.bg,color:sev.color,fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12,textTransform:"uppercase"}}>{sev.label}</span>
                <span style={{background:"#f3f4f6",color:"#374151",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12}}>{t.icon} {t.label}</span>
                {selected.closedOut?<span style={{background:"#f0fdf4",color:"#16a34a",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12}}>✓ Closed Out</span>:<span style={{background:"#fef3c7",color:"#92400e",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12}}>⏳ Open</span>}
              </div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#1a1a2e"}}>Incident on {selected.date}{selected.time?" at "+selected.time:""}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <button onClick={()=>openEdit(selected)} style={{background:"#e85d04",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>✏️ Edit</button>
              <button onClick={()=>generatePDF(selected)} style={{background:"#2563eb",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>📄 PDF</button>
              {!selected.closedOut&&<button onClick={()=>closeOut(selected)} style={{background:"#16a34a",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>✓ Close Out</button>}
              <button onClick={()=>del(selected)} style={{background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",padding:"7px 14px",borderRadius:6,fontWeight:600,cursor:"pointer",fontSize:12}}>🗑 Delete</button>
            </div>
          </div>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            {selected.location&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Location</div><div style={{fontSize:13,color:"#111827"}}>📍 {selected.location}</div></div>}
            {selected.address&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Site Address</div><div style={{fontSize:13,color:"#111827"}}>{selected.address}</div></div>}
            {selected.personInvolved&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Person Involved</div><div style={{fontSize:13,color:"#111827",fontWeight:600}}>👤 {selected.personInvolved}{selected.personRole?" ("+selected.personRole+")":""}</div></div>}
            {selected.witnesses&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Witnesses</div><div style={{fontSize:13,color:"#111827"}}>{selected.witnesses}</div></div>}
            {linkedJob&&<div style={{gridColumn:"span 2"}}><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Linked Job</div><div style={{fontSize:13,color:"#111827"}}>🔨 {linkedJob.client} — {linkedJob.type}</div></div>}
          </div>
          
          {selected.description&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>📝 What Happened</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",whiteSpace:"pre-wrap"}}>{selected.description}</div>
          </div>}
          {selected.immediateAction&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🚨 Immediate Action Taken</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#fef2f2",borderRadius:8,border:"1px solid #fca5a5",whiteSpace:"pre-wrap"}}>{selected.immediateAction}</div>
          </div>}
          {selected.contributingFactors&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🔍 Contributing Factors</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",whiteSpace:"pre-wrap"}}>{selected.contributingFactors}</div>
          </div>}
          {selected.preventativeAction&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🛡️ Preventative Action</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f0fdf4",borderRadius:8,border:"1px solid #bbf7d0",whiteSpace:"pre-wrap"}}>{selected.preventativeAction}</div>
          </div>}
          
          <div style={{padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",fontSize:11,color:"#6b7280",display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            <div><strong>Reported by:</strong> {selected.reportedBy}</div>
            <div><strong>Reported on:</strong> {selected.reportedDate}</div>
            {selected.worksafeNotified&&<div style={{gridColumn:"span 2",color:"#dc2626",fontWeight:600}}>⚠️ Notified to WorkSafe NZ {selected.worksafeRefNumber?"— Ref: "+selected.worksafeRefNumber:""}</div>}
            {selected.closedOut&&<div style={{gridColumn:"span 2",color:"#16a34a",fontWeight:600}}>✓ Closed out by {selected.closedOutBy} on {selected.closedOutDate}</div>}
          </div>
        </div>
      </div>
    );
  }

  // FORM VIEW
  if(showForm){
    return(
      <div>
        <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Register</button>
        <div style={card}>
          <SHd t={editing?"✏️ Edit Incident":"⚠️ Record New Incident"} color="#dc2626"/>
          <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,padding:10,marginBottom:14,fontSize:11,color:"#991b1b"}}>
            <strong>⚖️ Legal requirement:</strong> Under the HSW Act 2015, all workplace incidents must be recorded. "Notifiable events" must be reported to WorkSafe NZ within the required timeframe.
          </div>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Date *</label><input type="date" value={fm.date} onChange={e=>setFm(f=>({...f,date:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Time</label><input type="time" value={fm.time} onChange={e=>setFm(f=>({...f,time:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Type *</label><select value={fm.type} onChange={e=>setFm(f=>({...f,type:e.target.value}))} style={inp}>{Object.entries(INCIDENT_TYPES).map(([k,t])=><option key={k} value={k}>{t.icon} {t.label}</option>)}</select></div>
            <div><label style={lb}>Severity *</label><select value={fm.severity} onChange={e=>setFm(f=>({...f,severity:e.target.value}))} style={inp}>{Object.entries(INCIDENT_SEVERITY).map(([k,s])=><option key={k} value={k}>{s.label}</option>)}</select></div>
            <div><label style={lb}>Location (on-site)</label><input value={fm.location} onChange={e=>setFm(f=>({...f,location:e.target.value}))} style={inp} placeholder="e.g. Front ridge, scaffold level 2..."/></div>
            <div><label style={lb}>Linked Job</label><select value={fm.linkedJobId} onChange={e=>{const jid=e.target.value;const j=jobs.find(jj=>jj.id.toString()===jid);setFm(f=>({...f,linkedJobId:jid,address:j?j.address:f.address}));}} style={inp}><option value="">— None —</option>{jobs.map(j=><option key={j.id} value={j.id}>{j.client} — {j.address}</option>)}</select></div>
            <div style={{gridColumn:"span 2"}}><label style={lb}>🔍 Site Address</label><AddressInput value={fm.address} onChange={v=>setFm(f=>({...f,address:v}))} placeholder="Start typing..."/></div>
          </div>

          <SHd t="👤 People Involved" color="#dc2626"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Person Involved</label><input value={fm.personInvolved} onChange={e=>setFm(f=>({...f,personInvolved:e.target.value}))} style={inp} placeholder="Full name"/></div>
            <div><label style={lb}>Role / Position</label><input value={fm.personRole} onChange={e=>setFm(f=>({...f,personRole:e.target.value}))} style={inp} placeholder="e.g. Labourer, Site Foreman, Visitor"/></div>
            <div style={{gridColumn:"span 2"}}><label style={lb}>Witnesses</label><input value={fm.witnesses} onChange={e=>setFm(f=>({...f,witnesses:e.target.value}))} style={inp} placeholder="Names of any witnesses"/></div>
          </div>

          <SHd t="📝 What Happened" color="#dc2626"/>
          <label style={lb}>Description of Incident *</label>
          <textarea value={fm.description} onChange={e=>setFm(f=>({...f,description:e.target.value}))} rows={4} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="Detailed description of what happened, how it happened, and what injuries/damage occurred..."/>
          <label style={lb}>Immediate Action Taken</label>
          <textarea value={fm.immediateAction} onChange={e=>setFm(f=>({...f,immediateAction:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="What was done straight away — first aid, stopped work, called 111, etc."/>
          <label style={lb}>Contributing Factors</label>
          <textarea value={fm.contributingFactors} onChange={e=>setFm(f=>({...f,contributingFactors:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="Why did this happen? Weather, fatigue, missing PPE, faulty equipment, training gap..."/>
          <label style={lb}>Preventative Action</label>
          <textarea value={fm.preventativeAction} onChange={e=>setFm(f=>({...f,preventativeAction:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:14}} placeholder="What will we do to stop this happening again?"/>

          <SHd t="📋 Reporting" color="#dc2626"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Reported By</label><input value={fm.reportedBy} onChange={e=>setFm(f=>({...f,reportedBy:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Date Reported</label><input type="date" value={fm.reportedDate} onChange={e=>setFm(f=>({...f,reportedDate:e.target.value}))} style={inp}/></div>
            <div style={{gridColumn:"span 2",display:"flex",alignItems:"center",gap:10,padding:10,background:fm.worksafeNotified?"#fef2f2":"#f9fafb",borderRadius:8,border:"1px solid "+(fm.worksafeNotified?"#fca5a5":"#e5e7eb")}}>
              <input type="checkbox" checked={fm.worksafeNotified} onChange={e=>setFm(f=>({...f,worksafeNotified:e.target.checked}))} style={{width:18,height:18,cursor:"pointer"}}/>
              <span style={{fontSize:13,color:"#374151",fontWeight:600}}>Notified to WorkSafe NZ (0800 030 040)</span>
            </div>
            {fm.worksafeNotified&&<div style={{gridColumn:"span 2"}}><label style={lb}>WorkSafe Reference Number</label><input value={fm.worksafeRefNumber} onChange={e=>setFm(f=>({...f,worksafeRefNumber:e.target.value}))} style={inp} placeholder="Reference provided by WorkSafe"/></div>}
          </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={save} style={{background:"#dc2626",color:"#fff",border:"none",padding:"10px 24px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>{editing?"💾 Update Incident":"💾 Save Incident"}</button>
            <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
      </div>
    );
  }

  // MAIN LIST VIEW
  return(
    <div>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Forms</button>
      
      <div style={{...card,background:"linear-gradient(135deg,#fef2f2,#fecaca)",borderLeft:"4px solid #dc2626",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#991b1b"}}>⚠️ Incident Register</div>
            <div style={{fontSize:11,color:"#7f1d1d"}}>WorkSafe NZ compliant · HSW Act 2015 · Retained for 5+ years</div>

        {Object.entries(INCIDENT_TYPES).map(([k,t])=>(

                  {inc.closedOut?<span style={{background:"#f0fdf4",color:"#16a34a",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>✓ CLOSED</span>:<span style={{background:"#fef3c7",color:"#92400e",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>⏳ OPEN</span>}
                  {inc.worksafeNotified&&<span style={{background:"#fef2f2",color:"#991b1b",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,border:"1px solid #fca5a5"}}>⚠️ WORKSAFE</span>}
                </div>
                <div style={{fontSize:13,fontWeight:700,color:"#111827"}}>{inc.date}{inc.time?" at "+inc.time:""}{inc.location?" · "+inc.location:""}</div>

                {inc.address&&<div style={{fontSize:11,color:"#6b7280"}}>📍 {inc.address}</div>}
                {inc.description&&<div style={{fontSize:12,color:"#374151",marginTop:6,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{inc.description}</div>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function QuotesView({quotes,setQuotes,clients,jobs,setJobs,setTab,onBack}){

  const[statusFilter,setStatusFilter]=React.useState("all");
  const[searchTerm,setSearchTerm]=React.useState("");
  
  const today=new Date().toISOString().split("T")[0];

  const bl={
    quoteNumber:"",
    client:"",
    email:"",
    phone:"",
    address:"",

    validUntil:validTo.toISOString().split("T")[0],

nThe Roof Hub Limited carries public liability insurance. A copy of our certificate of currency is available on request.\n\nCANCELLATION\nIf work is cancelled after materials have been ordered, the client is liable for material costs plus a 15% administration fee. Cancellations within 48 hours of scheduled start incur a $500 scheduling fee.\n\nDISPUTES\nAny disputes will first be resolved through direct discussion. If unresolved, both parties agree to mediation before pursuing legal action.\n\nGST\nAll prices include GST at 15% unless otherwise stated.",
    status:"draft",
    sentDate:"",
    decisionDate:"",
    estHours:0,
    estMaterialCost:0,
  };
  const[fm,setFm]=React.useState(bl);

  function generateQuoteNumber(){
    const year=new Date().getFullYear();
    const yearQuotes=quotes.filter(q=>q.quoteNumber&&q.quoteNumber.startsWith("Q"+year));
    const maxNum=yearQuotes.reduce((max,q)=>{
      const num=parseInt(q.quoteNumber.split("-")[1]||"0");
      return num>max?num:max;
    },0);
    return"Q"+year+"-"+String(maxNum+1).padStart(3,"0");
  }
  
  function openAdd(){
    setEditing(null);
    setFm({...bl,quoteNumber:generateQuoteNumber()});
    setShowForm(true);
  }
  
  function openEdit(q){
    setEditing(q);
    setFm({...bl,...q,items:q.items&&q.items.length>0?q.items:[{desc:"",qty:1,unit:"m²",rate:0}]});
    setShowForm(true);
    setSelected(null);
  }
  
  function save(){
    if(!fm.client||!fm.address){alert("Please fill in client and address at minimum.");return;}
    if(editing){
      setQuotes(quotes.map(q=>q.id===editing.id?{...editing,...fm}:q));
    }else{
      setQuotes(q=>[...q,{...fm,id:Date.now()}]);
    }
    setShowForm(false);setEditing(null);setFm(bl);
  }
  
  function del(q){
    if(confirm("Delete this quote? This cannot be undone.")){
      setQuotes(quotes.filter(x=>x.id!==q.id));
      setSelected(null);
    }
  }
  
  function markStatus(q,newStatus){
    const date=new Date().toISOString().split("T")[0];
    const updated={...q,status:newStatus};
    if(newStatus==="sent")updated.sentDate=date;
    if(newStatus==="accepted"||newStatus==="declined")updated.decisionDate=date;
    setQuotes(quotes.map(x=>x.id===q.id?updated:x));
    setSelected(updated);
  }
  
  function convertToJob(q){
    if(!confirm("Convert this quote into a new job? A new job will be created with the quote details."))return;
    const newJob={
      id:Date.now(),
      client:q.client,
      address:q.address,
      email:q.email||"",
      phone:q.phone||"",
      type:"Full Re-roof",
      status:"scheduled",
      date:new Date().toISOString().split("T")[0],
      endDate:"",
      startTime:"07:00",
      endTime:"15:30",
      staff:[],
      notes:"Converted from quote "+q.quoteNumber+"\n\nQuoted total: $"+calculateTotal(q).toFixed(2)+"\n\n"+(q.notes||""),
      ssspRequired:true,
      ssspCompleted:false,
      photos:[],
      quoteId:q.id,
      quoteNumber:q.quoteNumber,

  function calculateSubtotal(q){
    return(q.items||[]).reduce((sum,item)=>sum+(parseFloat(item.qty)||0)*(parseFloat(item.rate)||0),0);
  }
  function calculateGST(q){return calculateSubtotal(q)*0.15;}
  function calculateTotal(q){return calculateSubtotal(q)*1.15;}
  
  function addLineItem(){
    setFm(f=>({...f,items:[...f.items,{desc:"",qty:1,unit:"m²",rate:0}]}));
  }
  function updateLineItem(idx,changes){
    setFm(f=>({...f,items:f.items.map((item,i)=>i===idx?{...item,...changes}:item)}));
  }
  function removeLineItem(idx){
    setFm(f=>({...f,items:f.items.filter((_,i)=>i!==idx)}));
  }
  function insertCommonItem(idx,template){
    updateLineItem(idx,{desc:template.desc,unit:template.unit,rate:template.rate});

    }).join("");

eNumber+'<\/strong><\/div><div class="grid"><div><div class="section-title">Quote to<\/div><div class="section-content"><strong>'+q.client+'<\/strong><br/>'+(q.address||"")+'<br/>'+(q.email||"")+(q.email&&q.phone?" · ":"")+(q.phone||"")+'<\/div><\/div><div><div class="section-title">Quote details<\/div><div class="section-content"><strong>Date:<\/strong> '+q.date+'<br/><strong>Valid until:<\/strong> '+q.validUntil+'<br/><strong>Status:<\/strong> '+(QUOTE_STATUS[q.status]?.label||q.status)+'<\/div><\/div><\/div><table><thead><tr><th style="width:50%;">Description<\/th><th style="width:15%;text-align:center;">Qty / Unit<\/th><th style="width:15%;text-align:right;">Rate<\/th><th style="width:20%;text-align:right;">Amount<\/th><\/tr><\/thead><tbody>'+itemsRows+'<\/tbody><\/table><div class="totals"><div class="totals-row"><span>Subtotal<\/span><span>$'+subtotal.toFixed(2)+'<\/span><\/div><div class="totals-row"><span>GST (15%)<\/span><span>$'+gst.toFixed(2)+'<\/span><\/div><div class="totals-row grand"><span>TOTAL<\/span><span>$'+total.toFixed(2)+'<\/span><\/div><\/div>'+(q.notes?'<div style="margin-top:24px;padding:14px;background:#f9fafb;border-radius:6px;font-size:12px;"><div class="section-title">Notes<\/div><div style="white-space:pre-wrap;">'+q.notes+'<\/div><\/div>':"")+'<div class="terms"><div class="section-title" style="color:#991b1b;">Terms & Conditions<\/div>'+q.terms+'<\/div><div class="foot">Thank you for considering The Roof Hub Limited.<br/>Generated: '+new Date().toLocaleString("en-NZ")+'<\/div><\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>';
    win.document.write(htmlContent);
    win.document.close();
  }

  // Client autocomplete
  const clientSuggestions=fm.client&&fm.client.length>1?clients.filter(c=>c.name&&c.name.toLowerCase().includes(fm.client.toLowerCase())).slice(0,5):[];

    draft:quotes.filter(q=>q.status==="draft").length,

            <button onClick={()=>openEdit(q)} style={{background:"#6b7280",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>✏️ Edit</button>
            {q.status==="draft"&&<button onClick={()=>markStatus(q,"sent")} style={{background:"#2563eb",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>📤 Mark as Sent</button>}
            {q.status==="sent"&&<>

            {q.phone&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Phone</div><div style={{fontSize:13,color:"#111827"}}>📱 {q.phone}</div></div>}
          </div>
          
          {/* Line items */}
          <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase"}}>Line Items</div>
          <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:8,overflow:"hidden",marginBottom:14}}>
            <div style={{display:"grid",gridTemplateColumns:"3fr 1fr 1fr 1fr",gap:6,padding:"8px 10px",background:"#f9fafb",borderBottom:"1px solid #e5e7eb",fontSize:10,color:"#6b7280",fontWeight:700,textTransform:"uppercase"}}>

            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:13}}>

            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:13}}>
              <span style={{color:"#6b7280"}}>GST (15%)</span>

  // ── FORM VIEW ─────────────────────────────────
  if(showForm){

    const total=calculateTotal(fm);
    return(
      <div>
        <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"none",border:"none",color:"#16a34a",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Quotes</button>
        <div style={card}>
          <SHd t={editing?"✏️ Edit Quote":"💲 New Quote"} color="#16a34a"/>
          
          {/* Quote header */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Quote Number</label><input value={fm.quoteNumber} onChange={e=>setFm(f=>({...f,quoteNumber:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Date</label><input type="date" value={fm.date} onChange={e=>setFm(f=>({...f,date:e.target.value}))} style={inp}/></div>
          </div>

          <div style={{position:"relative",marginBottom:14}}>

            {showSuggest&&clientSuggestions.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"1px solid #e5e7eb",borderRadius:6,maxHeight:200,overflowY:"auto",zIndex:100,marginTop:2,boxShadow:"0 4px 12px rgba(0,0,0,0.08)"}}>

                </div>

            </div>}
          </div>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Email</label><input type="email" value={fm.email} onChange={e=>setFm(f=>({...f,email:e.target.value}))} style={inp} placeholder="client@email.com"/></div>
            <div><label style={lb}>Phone</label><input value={fm.phone} onChange={e=>setFm(f=>({...f,phone:e.target.value}))} style={inp} placeholder="021 XXX XXXX"/></div>
          </div>
          
          <label style={lb}>🔍 Site Address *</label>
          <AddressInput value={fm.address} onChange={v=>setFm(f=>({...f,address:v}))} placeholder="Start typing address..."/>
          
          <div style={{marginTop:14,marginBottom:14}}>
            <label style={lb}>Valid Until</label>
            <input type="date" value={fm.validUntil} onChange={e=>setFm(f=>({...f,validUntil:e.target.value}))} style={{...inp,maxWidth:200}}/>
          </div>
          
          {/* Line items */}
          <SHd t="Line Items" color="#16a34a"/>
          <div style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:10,marginBottom:14}}>
            {fm.items.map((item,idx)=>{
              const amount=(parseFloat(item.qty)||0)*(parseFloat(item.rate)||0);
              return(
                <div key={idx} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:6,padding:10,marginBottom:8}}>
                  <div style={{display:"flex",gap:6,marginBottom:6}}>
                    <select onChange={e=>{if(e.target.value){const t=COMMON_LINE_ITEMS[parseInt(e.target.value)];insertCommonItem(idx,t);e.target.value="";}}} style={{...inp,flex:1,fontSize:11}}>
                      <option value="">+ Insert common item...</option>
                      {COMMON_LINE_ITEMS.map((t,i)=><option key={i} value={i}>{t.desc} ({t.unit}) - ${t.rate}</option>)}
                    </select>
                    {fm.items.length>1&&<button onClick={()=>removeLineItem(idx)} style={{background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",padding:"0 12px",borderRadius:6,cursor:"pointer",fontSize:14}}>✕</button>}
                  </div>
                  <input value={item.desc} onChange={e=>updateLineItem(idx,{desc:e.target.value})} style={{...inp,marginBottom:6}} placeholder="Description of work"/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6}}>
                    <input type="number" step="0.01" value={item.qty} onChange={e=>updateLineItem(idx,{qty:e.target.value})} style={{...inp,textAlign:"center"}} placeholder="Qty"/>
                    <select value={item.unit} onChange={e=>updateLineItem(idx,{unit:e.target.value})} style={inp}>
                      <option value="m²">m²</option><option value="m">m</option><option value="each">each</option>
                      <option value="hr">hr</option><option value="day">day</option><option value="week">week</option>
                      <option value="lot">lot</option><option value="job">job</option><option value="load">load</option>
                    </select>
                    <input type="number" step="0.01" value={item.rate} onChange={e=>updateLineItem(idx,{rate:e.target.value})} style={{...inp,textAlign:"right"}} placeholder="Rate"/>
                    <div style={{padding:"8px 10px",background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:6,textAlign:"right",fontSize:13,fontWeight:700,color:"#16a34a"}}>${amount.toFixed(2)}</div>
                  </div>
                </div>
              );
            })}
            <button onClick={addLineItem} style={{background:"#16a34a",color:"#fff",border:"none",padding:"8px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12,width:"100%"}}>+ Add Line Item</button>
          </div>
          
          {/* Live totals */}
          <div style={{background:"linear-gradient(135deg,#f0fdf4,#bbf7d0)",borderRadius:8,padding:14,marginBottom:14,border:"1px solid #bbf7d0"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:13,color:"#166534"}}>
              <span>Subtotal</span><span style={{fontWeight:600}}>${subtotal.toFixed(2)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:13,color:"#166534"}}>
              <span>GST (15%)</span><span style={{fontWeight:600}}>${gst.toFixed(2)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",paddingTop:8,borderTop:"2px solid #16a34a"}}>
              <span style={{fontWeight:800,fontSize:16,color:"#14532d"}}>TOTAL</span>
              <span style={{fontWeight:800,fontSize:20,color:"#14532d",fontFamily:"'Barlow Condensed',sans-serif"}}>${total.toFixed(2)}</span>

              <div>

              </div>
            </div>
            {(fm.estHours>0)&&(()=>{
              const labourRevenue=subtotal-(fm.estMaterialCost||0);
              const effectiveRate=fm.estHours>0?labourRevenue/fm.estHours:0;
              const BREAK_EVEN=86;
              const TARGET=110;
              const EXCELLENT=120;
              let status,color,bg,border,msg;
              if(effectiveRate<BREAK_EVEN){status="LOSING MONEY";color="#dc2626";bg="#fef2f2";border="#fca5a5";msg="⚠️ Below your $86/hr break-even — this job will cost you money. Increase price or walk away.";}
              else if(effectiveRate<TARGET){status="BELOW TARGET";color="#d97706";bg="#fef3c7";border="#fde68a";msg="🟡 Between break-even and $110 target — you'll cover costs but not hit your profit goal.";}
              else if(effectiveRate<EXCELLENT){status="ON TARGET";color="#16a34a";bg="#f0fdf4";border="#bbf7d0";msg="✅ At or above your $110/hr target — profitable job.";}
              else{status="EXCELLENT";color="#059669";bg="#d1fae5";border="#a7f3d0";msg="🔥 Above $120/hr — highly profitable. This is the kind of work to prioritise.";}
              return(
                <div style={{background:bg,border:"1px solid "+border,borderRadius:8,padding:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:6}}>
                    <div>
                      <div style={{fontSize:10,color:color,fontWeight:700,textTransform:"uppercase"}}>Effective Rate</div>
                      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,color}}>${effectiveRate.toFixed(2)}/hr</div>
                    </div>
                    <div style={{background:color,color:"#fff",padding:"6px 12px",borderRadius:14,fontSize:11,fontWeight:800}}>{status}</div>
                  </div>
                  <div style={{fontSize:11,color,lineHeight:1.5,marginTop:6}}>{msg}</div>
                  <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid "+border,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4,fontSize:10}}>
                    <div><div style={{color:"#6b7280",fontWeight:700}}>Labour Revenue</div><div style={{fontWeight:700,color:"#111827"}}>${labourRevenue.toFixed(2)}</div></div>
                    <div><div style={{color:"#6b7280",fontWeight:700}}>Material Cost</div><div style={{fontWeight:700,color:"#111827"}}>${(fm.estMaterialCost||0).toFixed(2)}</div></div>
                    <div><div style={{color:"#6b7280",fontWeight:700}}>Labour Hours</div><div style={{fontWeight:700,color:"#111827"}}>{fm.estHours}h</div></div>
                  </div>
                </div>
              );
            })()}
            {(!fm.estHours||fm.estHours===0)&&<div style={{fontSize:11,color:"#92400e",textAlign:"center",padding:8,fontStyle:"italic"}}>Enter estimated hours above to see your effective hourly rate</div>}
          </div>
          
          <label style={lb}>Notes (optional)</label>
          <textarea value={fm.notes} onChange={e=>setFm(f=>({...f,notes:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="Any additional info for the client..."/>
          
          <label style={lb}>Terms & Conditions</label>
          <textarea value={fm.terms} onChange={e=>setFm(f=>({...f,terms:e.target.value}))} rows={5} style={{...inp,resize:"vertical",marginBottom:14,fontSize:11}}/>
          
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={save} style={{background:"#16a34a",color:"#fff",border:"none",padding:"10px 24px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>{editing?"💾 Update Quote":"💾 Save Quote"}</button>
            <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
      </div>
    );
  }

  // ── LIST VIEW ─────────────────────────────────
  return(

      <div style={{...card,background:"linear-gradient(135deg,#f0fdf4,#bbf7d0)",borderLeft:"4px solid #16a34a",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#14532d"}}>💲 Quotes</div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:12}}>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #bbf7d0"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#14532d",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.total}</div>
            <div style={{fontSize:9,color:"#166534",fontWeight:700,textTransform:"uppercase"}}>Total</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #bbf7d0"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#2563eb",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.sent}</div>
            <div style={{fontSize:9,color:"#166534",fontWeight:700,textTransform:"uppercase"}}>Sent</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #bbf7d0"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#16a34a",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.accepted}</div>
            <div style={{fontSize:9,color:"#166534",fontWeight:700,textTransform:"uppercase"}}>Won</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #bbf7d0"}}>
            <div style={{fontSize:14,fontWeight:800,color:"#16a34a",fontFamily:"'Barlow Condensed',sans-serif"}}>${(stats.totalValue/1000).toFixed(1)}k</div>
            <div style={{fontSize:9,color:"#166534",fontWeight:700,textTransform:"uppercase"}}>Won $</div>
          </div>
        </div>
        {stats.pipelineValue>0&&<div style={{marginTop:8,padding:"6px 10px",background:"#fff",border:"1px solid #bbf7d0",borderRadius:6,fontSize:11,color:"#166534",fontWeight:600,textAlign:"center"}}>
          💼 Pipeline value (sent + draft): <strong>${stats.pipelineValue.toFixed(2)}</strong>
        </div>}
      </div>
      
      {/* Search + Filters */}
      <div style={{display:"flex",gap:6,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <input value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="🔍 Search by client, address, quote #" style={{...inp,flex:1,minWidth:200}}/>
      </div>
      <div style={{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
        <button onClick={()=>setStatusFilter("all")} style={{background:statusFilter==="all"?"#16a34a":"#fff",color:statusFilter==="all"?"#fff":"#6b7280",border:"1px solid "+(statusFilter==="all"?"#16a34a":"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>All ({stats.total})</button>
        {Object.entries(QUOTE_STATUS).map(([k,s])=>{
          const count=quotes.filter(q=>q.status===k).length;
          return(
            <button key={k} onClick={()=>setStatusFilter(k)} style={{background:statusFilter===k?s.color:"#fff",color:statusFilter===k?"#fff":"#6b7280",border:"1px solid "+(statusFilter===k?s.color:"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>{s.icon} {s.label} ({count})</button>
          );
        })}
      </div>

      {/* List */}
      {filtered.length===0&&<div style={{...card,textAlign:"center",padding:40,color:"#9ca3af"}}>
        {quotes.length===0?"No quotes yet. Tap '+ New Quote' to create your first one.":"No quotes match your filters."}
      </div>}
      {filtered.map(q=>{
        const st=QUOTE_STATUS[q.status]||QUOTE_STATUS.draft;
        const total=calculateTotal(q);
        const today=new Date();
        const validUntil=new Date(q.validUntil);
        const expired=q.status==="sent"&&validUntil<today;
        return(
          <div key={q.id} onClick={()=>setSelected(q)} style={{...card,cursor:"pointer",borderLeft:"4px solid "+st.color}}>

              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6,alignItems:"center"}}>
                  <span style={{background:st.bg,color:st.color,fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,textTransform:"uppercase"}}>{st.icon} {st.label}</span>
                  {expired&&<span style={{background:"#fef3c7",color:"#92400e",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>⏰ EXPIRED</span>}
                  <span style={{fontSize:10,color:"#6b7280",fontWeight:700}}>{q.quoteNumber}</span>
                </div>
                <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{q.client}</div>
                <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>📍 {q.address}</div>
                <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{q.date} · Valid until {q.validUntil}</div>

              <div style={{textAlign:"right"}}>
                <div style={{fontSize:10,color:"#6b7280",fontWeight:700,textTransform:"uppercase"}}>inc. GST</div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#16a34a"}}>${total.toFixed(2)}</div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function FormsView({jobs,clients,incidents=[],setIncidents,quotes=[],setQuotes,setJobs,setTab}){
  const[view,setView]=React.useState("select");
  const[linked,setLinked]=React.useState("");
  const[data,setData]=React.useState({});
  const[clientEmail,setClientEmail]=React.useState("");
  const[clientName,setClientName]=React.useState("");
  const templates={
    "job-report":{name:"Job Report",icon:"📋",fields:["Customer","Address","P.O Number","Date","Investigation Notes","Temporary / Permanent Repairs","Recommended Permanent Repairs"]},
    "roof-report":{name:"Roof Report",icon:"🏠",fields:["Address","Work Order Number","Inspection Date","Report Requested By","Report Conducted By","Number of Storeys","Roof Area (m²)","Roof Material","Colour","Age (est. years)","Pitch Degree","Roof Profile","Roof Coat Condition","Roof Surface Condition","Flashing Condition","Ridge Condition","Fixings Condition","Gutter Type","Gutter Material","Gutter Comments","Recommended Work"]},
  };
  function start(id){
    const job=jobs.find(j=>j.id.toString()===linked);
    const pre={};
    let email="";
    let name="";
    if(job){
      templates[id].fields.forEach(f=>{
        if(f.toLowerCase().includes("customer")||f.toLowerCase().includes("client"))pre[f]=job.client;
        if(f.toLowerCase().includes("address"))pre[f]=job.address;
        if(f.toLowerCase().includes("date"))pre[f]=job.date;
      });
      email=job.email||"";
      name=job.client||"";
      // If client is in database, use their email
      if(clients&&!email){
        const dbClient=clients.find(c=>c.name.toLowerCase()===job.client.toLowerCase());
        if(dbClient)email=dbClient.email||"";
      }
    }
    setClientEmail(email);setClientName(name);
    setData(pre);setView(id);
  }
  function genPDF(){
    const tpl=templates[view];
    const win=window.open("","_blank");
    if(!win)return;
    const rows=tpl.fields.map(f=>'<div style="margin-bottom:14px;"><div style="font-size:11px;font-weight:600;color:#777;text-transform:uppercase;margin-bottom:3px;">'+f+'</div><div style="border:1px solid #ddd;border-radius:4px;padding:8px 12px;min-height:28px;background:#fafafa;font-size:13px;white-space:pre-wrap;">'+(data[f]||"")+'</div></div>').join("");
    win.document.write('<!DOCTYPE html><html><head><title>'+tpl.name+'<\/title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;}.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:3px solid #cc0000;}.biz{text-align:right;font-size:11px;color:#555;line-height:1.7;}.content{padding:20px 30px;}h1{font-size:24px;font-weight:800;border-bottom:2px solid #cc0000;padding-bottom:8px;margin-bottom:20px;}<\/style><\/head><body><div class="hdr"><img src="'+LOGO+'" style="height:100px;object-fit:contain;"/><div class="biz"><strong style="font-size:13px;color:#1a1a1a;">The Roof Hub Limited<\/strong><br/>98 Hillsborough Road, Hillsborough, Auckland<br/>fasa@theroofhub.co.nz · 02041739390<\/div><\/div><div class="content"><h1>'+tpl.name+'<\/h1>'+rows+'<\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>');
    win.document.close();
  }
  function emailToClient(){
    const tpl=templates[view];
    if(!clientEmail){
      alert("No email address for this client. Please add one in the Clients tab or enter one below.");
      return;
    }
    // Build a nicely formatted summary for the email body
    const address=data["Address"]||"";
    const summary=tpl.fields.filter(f=>data[f]&&data[f].trim()).map(f=>"• "+f+": "+data[f]).join("\n");
    const subject=tpl.name+(address?" — "+address:"");
    const greeting=clientName?"Hi "+clientName.split(" ")[0]+",":"Hi there,";
    const body=greeting+"\n\nPlease find below the "+tpl.name.toLowerCase()+" for your property"+(address?" at "+address:"")+".\n\n"+
      "═══════════════════════════════\n"+
      tpl.name.toUpperCase()+"\n"+
      "═══════════════════════════════\n\n"+
      summary+"\n\n"+
      "═══════════════════════════════\n\n"+
      "⚠️ Please note: A PDF version of this "+tpl.name.toLowerCase()+" is available — I'll attach it separately or generate it for you on request.\n\n"+
      "If you have any questions or would like to proceed with the recommended work, please get in touch.\n\n"+
      "Kind regards,\n"+
      "Fasa Sopi\n"+
      "The Roof Hub Limited\n"+
      "📞 02041739390\n"+
      "✉️ fasa@theroofhub.co.nz\n"+
      "📍 98 Hillsborough Road, Hillsborough, Auckland 1042";
    const mailto="mailto:"+encodeURIComponent(clientEmail)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    // Open mail app, then also trigger PDF generation so user can attach it
    window.location.href=mailto;
    // After short delay, also generate the PDF so user can save/attach it
    setTimeout(()=>{
      if(confirm("Email opened in your mail app!\n\nWant to also generate the PDF now so you can attach it before sending?\n\n(Click OK to open PDF, then save it and attach to the email)")){
        genPDF();
      }
    },800);
  }
  if(view==="select")return(
    <div>
      <div style={{marginBottom:16}}>
        <label style={lb}>Link to a Job (auto-fills client details)</label>
        <select value={linked} onChange={e=>setLinked(e.target.value)} style={{...inp,maxWidth:360}}>

        </select>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {Object.entries(templates).map(([id,t])=>(
          <div key={id} onClick={()=>start(id)} style={{...card,cursor:"pointer",borderTop:"4px solid #e85d04",textAlign:"center",padding:20,marginBottom:0}}>

            <div style={{color:"#111827",fontWeight:700,fontSize:15,marginBottom:4}}>{t.name}</div>
            <div style={{color:"#6b7280",fontSize:12}}>Fill in, generate PDF, or email to client</div>
            <div style={{marginTop:12,background:"#e85d04",color:"#fff",padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:700,display:"inline-block"}}>Start Form →</div>
          </div>
        ))}
        {/* Incident Register tile */}
        <div onClick={()=>setView("incident-register")} style={{...card,cursor:"pointer",borderTop:"4px solid #dc2626",textAlign:"center",padding:20,marginBottom:0,gridColumn:"span 2"}}>
          <div style={{fontSize:32,marginBottom:10}}>⚠️</div>
          <div style={{color:"#111827",fontWeight:700,fontSize:15,marginBottom:4}}>Incident Register</div>

function StaffCertsModal({staff,certs,allCerts,setCerts,onClose}){
  const[showForm,setShowForm]=React.useState(false);
  const[editing,setEditing]=React.useState(null);
  const bl={staffId:staff.id,type:"heights",issuingBody:"",certNumber:"",issueDate:"",expiryDate:"",notes:"",photoData:""};
  const[fm,setFm]=React.useState(bl);
  const[uploading,setUploading]=React.useState(false);
  
  function openAdd(typeId){
    setEditing(null);
    setFm({...bl,type:typeId||"heights"});
    setShowForm(true);
  }
  
  function openEdit(cert){
    setEditing(cert);
    setFm({...bl,...cert});
    setShowForm(true);
  }
  
  function save(){
    if(!fm.type){alert("Please select a certificate type.");return;}
    if(!fm.expiryDate){alert("Please set an expiry date.");return;}
    if(editing){
      setCerts(allCerts.map(c=>c.id===editing.id?{...editing,...fm}:c));
    }else{
      setCerts(cs=>[...cs,{...fm,id:Date.now()}]);
    }
    setShowForm(false);setEditing(null);setFm(bl);
  }
  
  function del(cert){
    if(confirm("Delete this certificate record?")){
      setCerts(allCerts.filter(c=>c.id!==cert.id));
    }
  }
  
  async function handleFile(e){
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>3*1024*1024){alert("File too large. Please use an image or PDF under 3MB.");return;}
    setUploading(true);
    const reader=new FileReader();
    reader.onload=(ev)=>{
      setFm(f=>({...f,photoData:ev.target.result,photoName:file.name,photoType:file.type}));
      setUploading(false);
    };
    reader.onerror=()=>{alert("Failed to read file.");setUploading(false);};
    reader.readAsDataURL(file);
  }
  
  function viewCertFile(cert){
    if(!cert.photoData)return;
    const win=window.open("","_blank");
    if(cert.photoType&&cert.photoType.startsWith("image/")){
      win.document.write('<html><head><title>'+(cert.photoName||"Certificate")+'<\/title><\/head><body style="margin:0;background:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+cert.photoData+'" style="max-width:100%;max-height:100vh;"/><\/body><\/html>');
    }else{
      win.document.write('<html><head><title>'+(cert.photoName||"Certificate")+'<\/title><\/head><body style="margin:0;"><embed src="'+cert.photoData+'" type="application/pdf" width="100%" height="100%" style="height:100vh;"/><\/body><\/html>');

    win.document.close();
  }
  
  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}}>
