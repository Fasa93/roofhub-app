                const raw=calcH(t.clockIn,t.clockOut);
                const h=calcHours(t.clockIn,t.clockOut);
                const breakDeducted=raw>BREAK_THRESHOLD_HOURS;
                return(
                  <div key={t.id} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:6,padding:10,marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>

                      <div style={{fontSize:12,fontWeight:700,color:"#111827"}}>{t.date} · {t.clockIn||"—"} to {t.clockOut||"—"}</div>
                      {job&&<div style={{fontSize:11,color:"#6b7280",marginTop:2}}>🔨 {job.client} — {job.type}</div>}
                      {breakDeducted&&<div style={{fontSize:10,color:"#9ca3af",marginTop:1}}>− 30min unpaid break</div>}
                      {t.notes&&<div style={{fontSize:10,color:"#6b7280",marginTop:3,fontStyle:"italic"}}>"{t.notes}"</div>}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                      <div style={{fontSize:13,fontWeight:700,color:sel.color,fontFamily:"'Barlow Condensed',sans-serif"}}>{formatHours(h)}</div>
                      <span style={{background:t.approved?"#f0fdf4":"#fef3c7",color:t.approved?"#16a34a":"#92400e",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:8}}>{t.approved?"✓ APPROVED":"⏳ PENDING"}</span>
                    </div>
                  </div>
                );
              })}
            </div>}
            
            {weekTs.length===0&&<div style={{textAlign:"center",padding:20,color:"#9ca3af",fontSize:12,fontStyle:"italic",background:"#f9fafb",borderRadius:8,marginBottom:14}}>
              No timesheet entries for {weekOffset===0?"this week":"this period"}
            </div>}
            
            {/* Jobs worked */}
            {jobsWorked.length>0&&<div style={{marginBottom:14}}>

                </div>

            </div>}
            
            {/* Responsibilities */}
            <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6,textTransform:"uppercase"}}>Responsibilities</div>
            <ul style={{paddingLeft:20,color:"#6b7280",fontSize:12,lineHeight:1.8,marginBottom:0}}>
              {sel.responsibilities.map((r,i)=><li key={i}>{r}</li>)}
            </ul>
          </div>
        );
      })()}
      <div style={card}>
        <SHd t="🏗️ Company Values" color="#1a1a2e"/>
        {VALUES.map(v=>(
          <div key={v.num} style={{display:"flex",gap:12,padding:"10px 0",borderBottom:"1px solid #f3f4f6",alignItems:"flex-start"}}>
            <div style={{background:"#e85d04",color:"#fff",borderRadius:"50%",width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,flexShrink:0}}>{v.num}</div>

          </div>
        ))}
      </div>
      <div style={card}>

          {STANDARDS.map((s,i)=><li key={i}>{s}</li>)}
        </ul>
      </div>
    </div>
  );
}

    asbestosNotes:"",
    hazards:DEFAULT_SSSP_HAZARDS.map(h=>({...h,selected:true})),
    extraHazards:[],
    additionalHazard:"",
    additionalControl:"",
    publicProtection:"",
    emergencyProcedure:"",
    specificInstructions:"",
    signedBy:"David Sopi",
    signedDate:new Date().toISOString().split("T")[0],
  };
  const[s,setS]=React.useState(blankSSSP);

  function startNew(jobId){
    const job = jobs.find(j=>j.id===jobId);
    if(!job) return;
    const existing = job.sssp;
    if(existing){
      setS(existing);
    } else {
      setS({
        ...blankSSSP,
        projectName:job.type+" — "+job.client,
        siteAddress:job.address,
        startDate:job.date,
      });
    }
    setSelJobId(jobId);
    setMode("edit");
    setSaved(false);
  }

  function toggleHazard(idx){
    setS(x=>({...x,hazards:x.hazards.map((h,i)=>i===idx?{...h,selected:!h.selected}:h)}));
  }
  function updateHazardControl(idx,val){
    setS(x=>({...x,hazards:x.hazards.map((h,i)=>i===idx?{...h,control:val}:h)}));
  }
  function toggleExtra(hz){
    setS(x=>({...x,extraHazards:x.extraHazards.includes(hz)?x.extraHazards.filter(h=>h!==hz):[...x.extraHazards,hz]}));
  }

  function save(){
    setJobs(jobs.map(j=>j.id===selJobId?{...j,sssp:s,ssspCompleted:true}:j));
    setSaved(true);
    setTimeout(()=>{setMode("list");setSaved(false);},1500);
  }

    const html='<!DOCTYPE html><html><head><title>SSSP — '+s.projectName+'<\/title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;color:#1a1a1a;font-size:12px;}.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:3px solid '+packColor+';}.pack{background:'+packColor+';color:#fff;padding:4px 12px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;margin-top:4px;display:inline-block;}.biz{text-align:right;font-size:10px;color:#555;line-height:1.6;}.content{padding:18px 28px;}h1{font-size:22px;font-weight:800;margin-bottom:8px;}h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;background:#1a1a2e;color:#fff;padding:7px 11px;border-radius:3px;margin:14px 0 8px;}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}.fl{font-size:10px;font-weight:600;color:#777;text-transform:uppercase;margin-bottom:2px;}.fb{border:1px solid #ddd;border-radius:3px;padding:6px 10px;min-height:20px;background:#fafafa;white-space:pre-wrap;font-size:12px;}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px;}th{background:#1a1a2e;color:#fff;padding:8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;}tr:nth-child(even){background:#f9fafb;}.sig{margin-top:24px;padding-top:14px;border-top:1px dashed #999;font-size:11px;}.warn{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:6px;color:#991b1b;font-size:11px;margin-top:10px;}<\/style><\/head><body><div class="hdr"><div><img src="'+LOGO+'" style="height:90px;object-fit:contain;"/><div class="pack">'+packLabel+' PACK<\/div><\/div><div class="biz"><strong style="font-size:12px;color:#1a1a1a;">The Roof Hub Limited<\/strong><br/>98 Hillsborough Road, Hillsborough, Auckland<br/>fasa@theroofhub.co.nz · 02041739390<br/><em>PCBU Registration under HSW Act 2015<\/em><\/div><\/div><div class="content"><h1>📋 Site Specific Safety Plan (SSSP)<\/h1><h2>Project Details<\/h2><div class="grid2"><div><div class="fl">Project Name<\/div><div class="fb">'+s.projectName+'<\/div><\/div><div><div class="fl">Main Contractor (PCBU)<\/div><div class="fb">'+s.mainContractor+'<\/div><\/div><div><div class="fl">Site Address<\/div><div class="fb">'+s.siteAddress+'<\/div><\/div><div><div class="fl">Start Date<\/div><div class="fb">'+s.startDate+'<\/div><\/div><div><div class="fl">Expected Duration<\/div><div class="fb">'+s.expectedDuration+'<\/div><\/div><div><div class="fl">Site Contact<\/div><div class="fb">'+s.siteContact+' · '+s.siteContactPhone+'<\/div><\/div><\/div><h2>Emergency Procedures<\/h2><div class="grid2"><div><div class="fl">First Aider<\/div><div class="fb">'+s.firstAider+'<\/div><\/div><div><div class="fl">First Aid Kit Location<\/div><div class="fb">'+s.firstAidLocation+'<\/div><\/div><div><div class="fl">Nearest Hospital<\/div><div class="fb">'+s.nearestHospital+'<\/div><\/div><div><div class="fl">Evacuation Point<\/div><div class="fb">'+s.evacuationPoint+'<\/div><\/div><\/div><div style="margin-top:10px;"><div class="fl">Emergency Procedure<\/div><div class="fb" style="min-height:50px;">'+s.emergencyProcedure+'<\/div><\/div><h2>🚨 Key Emergency Contacts<\/h2><table><tr><th>Service<\/th><th>Contact<\/th><\/tr><tr><td style="padding:6px 8px;font-weight:700;color:#dc2626;">Emergency (Fire/Police/Ambulance)<\/td><td style="padding:6px 8px;font-weight:700;">111<\/td><\/tr><tr><td style="padding:6px 8px;">Manager (Fasa Sopi)<\/td><td style="padding:6px 8px;">02041739390<\/td><\/tr><tr><td style="padding:6px 8px;">Site Foreman (David Sopi)<\/td><td style="padding:6px 8px;">021 XXX XXXX<\/td><\/tr><tr><td style="padding:6px 8px;">Nearest Hospital<\/td><td style="padding:6px 8px;">'+s.nearestHospital+'<\/td><\/tr><tr><td style="padding:6px 8px;">Poisons Centre<\/td><td style="padding:6px 8px;">0800 764 766<\/td><\/tr><tr><td style="padding:6px 8px;">WorkSafe NZ<\/td><td style="padding:6px 8px;">0800 030 040<\/td><\/tr><\/table><h2>Site Access & Utilities<\/h2><div class="grid2"><div><div class="fl">Access / Egress Points<\/div><div class="fb" style="min-height:40px;">'+s.accessPoints+'<\/div><\/div><div><div class="fl">Utilities Location (power, gas, water)<\/div><div class="fb" style="min-height:40px;">'+s.utilitiesLocation+'<\/div><\/div><\/div><h2>⚠️ Hazard Register & Risk Controls<\/h2>'+(s.asbestosChecked?'<div class="warn"><strong>⚠️ ASBESTOS IDENTIFIED:<\/strong> '+s.asbestosNotes+'<\/div>':'<div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:8px;border-radius:6px;color:#14532d;font-size:11px;margin-top:6px;">✓ Asbestos check completed — none identified<\/div>')+'<table><tr><th>Hazard<\/th><th>Control Measures<\/th><\/tr>'+hazardRows+extraHazardRows+'<\/table><h2>Public Protection<\/h2><div class="fb" style="min-height:50px;">'+s.publicProtection+'<\/div><h2>Site-Specific Instructions<\/h2><div class="fb" style="min-height:60px;">'+s.specificInstructions+'<\/div><h2>Incident Reporting<\/h2><div class="fb">All incidents including near-misses must be reported immediately to the site foreman (David Sopi) and logged. Notifiable events reported to WorkSafe NZ within timeframes. Serious harm notified to 0800 030 040.<\/div><div class="sig"><strong>Declaration:<\/strong> I confirm this SSSP has been completed, and all workers on site will be briefed on its contents before work commences.<br/><br/>Signed: '+s.signedBy+'<br/>Date: '+s.signedDate+'<br/><br/><em>This SSSP complies with the Health and Safety at Work Act 2015 and WorkSafe NZ guidelines.<\/em><\/div><\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>';
    win.document.write(html);
    win.document.close();
  }

  // LIST VIEW
  if(mode==="list")return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:15,fontWeight:700,color:"#111827"}}>Site Specific Safety Plans</div>
          <div style={{fontSize:11,color:"#6b7280"}}>WorkSafe NZ compliant SSSPs for your jobs</div>
        </div>
      </div>

      {pending.length>0&&<div style={{...card,borderLeft:"4px solid #dc2626",background:"#fef2f2",marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <span style={{fontSize:20}}>⚠️</span>
          <div>
            <div style={{fontWeight:700,color:"#991b1b",fontSize:14}}>{pending.length} SSSP{pending.length>1?"s":""} Pending</div>
            <div style={{fontSize:11,color:"#991b1b"}}>These jobs need an SSSP before work starts</div>
          </div>
        </div>
        {pending.map(j=>(
          <div key={j.id} style={{background:"#fff",border:"1px solid #fca5a5",borderRadius:8,padding:10,marginTop:8,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{color:"#111827",fontWeight:700,fontSize:13}}>{j.client}</div>
              <div style={{color:"#6b7280",fontSize:11}}>{j.type} · 📍 {j.address} · 📅 {j.date}</div>
            </div>
            <button onClick={()=>startNew(j.id)} style={{border:"none",padding:"7px 16px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,background:"#dc2626",color:"#fff"}}>Start SSSP →</button>
          </div>
        ))}
      </div>}

      {done.length>0&&<div style={card}>
        <SHd t={"✓ Completed SSSPs ("+done.length+")"} color="#16a34a"/>
        {done.map(j=>(
          <div key={j.id} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:10,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{color:"#111827",fontWeight:700,fontSize:13}}>{j.client}</div>
              <div style={{color:"#6b7280",fontSize:11}}>{j.type} · 📍 {j.address}</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <span style={{background:"#f0fdf4",color:"#16a34a",border:"1px solid #bbf7d0",padding:"3px 10px",borderRadius:8,fontSize:10,fontWeight:700}}>✓ COMPLETED</span>
              <button onClick={()=>startNew(j.id)} style={{border:"1px solid #e5e7eb",background:"#fff",padding:"3px 12px",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600,color:"#374151"}}>View</button>
            </div>
          </div>
        ))}
      </div>}

      {jobsNeedingSSSP.length===0&&<div style={{...card,textAlign:"center",padding:40,color:"#9ca3af"}}>No jobs currently require an SSSP.<br/>Toggle "SSSP Required" on a job in the Jobs tab to add one here.</div>}

      <div style={{...card,background:"#eff6ff",borderLeft:"4px solid #2563eb",marginTop:10}}>
        <div style={{fontSize:12,fontWeight:700,color:"#1e40af",marginBottom:6}}>💡 What's an SSSP?</div>
        <div style={{fontSize:12,color:"#1e3a8a",lineHeight:1.6}}>A Site Specific Safety Plan is a WorkSafe NZ requirement for medium-to-large jobs. It identifies hazards, lists controls, and ensures your team knows how to work safely on site. Required by law under the Health and Safety at Work Act 2015.</div>
      </div>
    </div>
  );

  // EDIT / NEW SSSP
  return(
    <div>
      <button onClick={()=>setMode("list")} style={{background:"none",border:"none",color:"#e85d04",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to SSSP List</button>

      {saved&&<div style={{...card,background:"#f0fdf4",borderLeft:"4px solid #16a34a",textAlign:"center"}}>
        <div style={{fontSize:16,fontWeight:700,color:"#16a34a"}}>✓ SSSP Saved</div>
        <div style={{fontSize:12,color:"#15803d"}}>Job is now marked as SSSP complete</div>
      </div>}

      <div style={card}>
        <SHd t="📋 Site Specific Safety Plan"/>
        <label style={lb}>Pack Type (Site Safe NZ)</label>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <button onClick={()=>setS(x=>({...x,packType:"red"}))} style={{flex:1,padding:"10px",borderRadius:8,border:"2px solid "+(s.packType==="red"?"#dc2626":"#e5e7eb"),background:s.packType==="red"?"#fef2f2":"#fff",cursor:"pointer",textAlign:"left"}}>
            <div style={{color:"#dc2626",fontWeight:800,fontSize:13}}>🔴 RED</div>
            <div style={{color:"#374151",fontSize:11,fontWeight:600,marginTop:2}}>Main Contractor</div>
            <div style={{color:"#9ca3af",fontSize:10,marginTop:2}}>You're running the job yourself</div>
          </button>
          <button onClick={()=>setS(x=>({...x,packType:"yellow"}))} style={{flex:1,padding:"10px",borderRadius:8,border:"2px solid "+(s.packType==="yellow"?"#d97706":"#e5e7eb"),background:s.packType==="yellow"?"#fffbeb":"#fff",cursor:"pointer",textAlign:"left"}}>
            <div style={{color:"#d97706",fontWeight:800,fontSize:13}}>🟡 YELLOW</div>
            <div style={{color:"#374151",fontSize:11,fontWeight:600,marginTop:2}}>Subcontractor</div>
            <div style={{color:"#9ca3af",fontSize:10,marginTop:2}}>Working under a main contractor</div>
          </button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Project Name</label><input value={s.projectName} onChange={e=>setS(x=>({...x,projectName:e.target.value}))} style={inp}/></div>
          <div style={{gridColumn:"span 2"}}><label style={lb}>🔍 Site Address</label><AddressInput value={s.siteAddress} onChange={v=>setS(x=>({...x,siteAddress:v}))}/></div>
          <div><label style={lb}>Start Date</label><input type="date" value={s.startDate} onChange={e=>setS(x=>({...x,startDate:e.target.value}))} style={inp}/></div>
          <div><label style={lb}>Expected Duration</label><input value={s.expectedDuration} onChange={e=>setS(x=>({...x,expectedDuration:e.target.value}))} style={inp} placeholder="e.g. 3 days, 2 weeks"/></div>
          <div><label style={lb}>Site Contact</label>
            <select value={s.siteContact} onChange={e=>setS(x=>({...x,siteContact:e.target.value}))} style={inp}>
              {STAFF.filter(p=>p.role.includes("Foreman")||p.role.includes("Supervisor")||p.role.includes("Manager")).map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div><label style={lb}>Site Contact Phone</label><input value={s.siteContactPhone} onChange={e=>setS(x=>({...x,siteContactPhone:e.target.value}))} style={inp} placeholder="021 XXX XXXX"/></div>
        </div>
      </div>

      <div style={card}>
        <SHd t="🚨 Emergency Procedures" color="#dc2626"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div><label style={lb}>First Aider on Site</label>
            <select value={s.firstAider} onChange={e=>setS(x=>({...x,firstAider:e.target.value}))} style={inp}>
              {STAFF.map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div><label style={lb}>First Aid Kit Location</label><input value={s.firstAidLocation} onChange={e=>setS(x=>({...x,firstAidLocation:e.target.value}))} style={inp} placeholder="e.g. Truck, site shed"/></div>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Nearest Hospital</label><input value={s.nearestHospital} onChange={e=>setS(x=>({...x,nearestHospital:e.target.value}))} style={inp}/></div>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Evacuation Assembly Point</label><input value={s.evacuationPoint} onChange={e=>setS(x=>({...x,evacuationPoint:e.target.value}))} style={inp} placeholder="e.g. Front driveway, opposite street corner"/></div>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Emergency Procedure</label><textarea value={s.emergencyProcedure} onChange={e=>setS(x=>({...x,emergencyProcedure:e.target.value}))} rows={3} style={{...inp,resize:"vertical"}} placeholder="What to do if someone is injured, fire, etc..."/></div>
        </div>
      </div>

      <div style={card}>
        <SHd t="🏗️ Site Access & Utilities" color="#0ea5e9"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Access / Egress Points</label><textarea value={s.accessPoints} onChange={e=>setS(x=>({...x,accessPoints:e.target.value}))} rows={2} style={{...inp,resize:"vertical"}} placeholder="How to get on/off site, parking, loading zones..."/></div>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Utilities Location</label><textarea value={s.utilitiesLocation} onChange={e=>setS(x=>({...x,utilitiesLocation:e.target.value}))} rows={2} style={{...inp,resize:"vertical"}} placeholder="Power mains, gas shut-off, water mains..."/></div>
        </div>
      </div>

      <div style={card}>
        <SHd t="⚠️ Asbestos Check (Mandatory for pre-2000 buildings)" color="#d97706"/>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,padding:10,background:s.asbestosChecked?"#fef2f2":"#fffbeb",borderRadius:8,border:"1px solid "+(s.asbestosChecked?"#fca5a5":"#fde68a")}}>
          <input type="checkbox" checked={s.asbestosChecked} onChange={e=>setS(x=>({...x,asbestosChecked:e.target.checked}))} style={{width:18,height:18,cursor:"pointer"}}/>

        </div>
        {s.asbestosChecked&&<textarea value={s.asbestosNotes} onChange={e=>setS(x=>({...x,asbestosNotes:e.target.value}))} rows={2} style={{...inp,resize:"vertical"}} placeholder="Where is asbestos located? What removal procedure will be used?"/>}
      </div>

      <div style={card}>
        <SHd t="🚧 Default Roofing Hazards & Controls" color="#dc2626"/>
        <div style={{fontSize:11,color:"#6b7280",marginBottom:10}}>These are pre-filled for all roofing jobs. Untick any that don't apply to this site.</div>
        {s.hazards.map((h,i)=>(
          <div key={i} style={{padding:"10px 12px",marginBottom:6,borderRadius:8,background:h.selected?"#fff":"#f9fafb",border:"1px solid "+(h.selected?"#fca5a5":"#e5e7eb")}}>

              <input type="checkbox" checked={h.selected} onChange={()=>toggleHazard(i)} style={{width:16,height:16,cursor:"pointer"}}/>

            </div>
            {h.selected&&<input value={h.control} onChange={e=>updateHazardControl(i,e.target.value)} style={{...inp,fontSize:12}} placeholder="Control measures..."/>}

      </div>

      <div style={card}>
        <SHd t="🎯 Additional Site-Specific Hazards" color="#d97706"/>
        <div style={{fontSize:11,color:"#6b7280",marginBottom:10}}>Tick any extra hazards present at this specific site</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {EXTRA_HAZARDS.map(h=>(
            <button key={h} onClick={()=>toggleExtra(h)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,border:"1.5px solid "+(s.extraHazards.includes(h)?"#d97706":"#e5e7eb"),cursor:"pointer",background:s.extraHazards.includes(h)?"#fffbeb":"#fff",textAlign:"left"}}>
              <div style={{width:18,height:18,borderRadius:4,background:s.extraHazards.includes(h)?"#d97706":"#fff",border:"1.5px solid "+(s.extraHazards.includes(h)?"#d97706":"#d1d5db"),display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,fontWeight:800,flexShrink:0}}>{s.extraHazards.includes(h)?"!":""}</div>
              <span style={{fontSize:11,color:"#374151",fontWeight:500}}>{h}</span>
            </button>
          ))}
        </div>
      </div>

      <div style={card}>
        <SHd t="👥 Public Protection" color="#7c3aed"/>
        <textarea value={s.publicProtection} onChange={e=>setS(x=>({...x,publicProtection:e.target.value}))} rows={3} style={{...inp,resize:"vertical"}} placeholder="How will you protect neighbours, pedestrians, vehicles? Signage, barriers, exclusion zones..."/>
      </div>

      <div style={card}>
        <SHd t="📝 Site-Specific Instructions"/>
        <textarea value={s.specificInstructions} onChange={e=>setS(x=>({...x,specificInstructions:e.target.value}))} rows={4} style={{...inp,resize:"vertical"}} placeholder="Any other site-specific instructions, procedures or notes..."/>
      </div>

      <div style={card}>
        <SHd t="✍️ Sign Off" color="#16a34a"/>

          <div><label style={lb}>Signed By</label>
            <select value={s.signedBy} onChange={e=>setS(x=>({...x,signedBy:e.target.value}))} style={inp}>
              {STAFF.filter(p=>p.role.includes("Foreman")||p.role.includes("Supervisor")||p.role.includes("Manager")).map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div><label style={lb}>Date</label><input type="date" value={s.signedDate} onChange={e=>setS(x=>({...x,signedDate:e.target.value}))} style={inp}/></div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button onClick={save} style={{background:"#16a34a",color:"#fff",border:"none",padding:"11px 24px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:14,boxShadow:"0 2px 8px rgba(22,163,74,0.25)"}}>✓ Save SSSP</button>
        <button onClick={genPDF} style={{background:"#e85d04",color:"#fff",border:"none",padding:"11px 24px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:14}}>📄 Generate PDF</button>
        <button onClick={()=>setMode("list")} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"11px 18px",borderRadius:8,cursor:"pointer",fontSize:14}}>Cancel</button>
      </div>
    </div>
  );
}

// Convert camelCase keys to snake_case for DB
function toDbRow(key,obj){
  const map=CLOUD_TABLES[key]?.keyMap||{};
  const out={};
  for(const k in obj){
    const dbKey=map[k]||k;
    out[dbKey]=obj[k];
  }
  return out;
}
// Convert snake_case keys from DB back to camelCase
function fromDbRow(key,row){
  const map=CLOUD_TABLES[key]?.keyMap||{};
  const reverseMap={};
  for(const k in map)reverseMap[map[k]]=k;
  const out={};
  for(const k in row){
    if(k==="created_at"||k==="updated_at")continue;
    const jsKey=reverseMap[k]||k;
    out[jsKey]=row[k];
  }
  return out;
}

// Load data from cloud (returns Promise)
// Simple cloud key-value settings store (for shared API key, etc.)
async function cloudLoadSetting(key){
  if(!sb)return null;
  try{
    const{data,error}=await sb.from("app_settings").select("value").eq("key",key).maybeSingle();
    if(error){console.error("Cloud load setting "+key+":",error);return null;}
    return data?data.value:null;
  }catch(e){console.error("Cloud load setting exception:",e);return null;}
}
async function cloudSaveSetting(key,value){
  if(!sb)return false;
  try{
    const{error}=await sb.from("app_settings").upsert({key,value,updated_at:new Date().toISOString()});
    if(error){console.error("Cloud save setting "+key+":",error);return false;}
    return true;
  }catch(e){console.error("Cloud save setting exception:",e);return false;}
}
async function cloudDeleteSetting(key){
  if(!sb)return false;
  try{
    const{error}=await sb.from("app_settings").delete().eq("key",key);
    if(error){console.error("Cloud delete setting "+key+":",error);return false;}
    return true;
  }catch(e){console.error("Cloud delete setting exception:",e);return false;}
}

async function cloudLoad(key){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    // Paginate through all rows (Supabase returns max 1000 per request)
    const all=[];
    const PAGE=1000;
    let from=0;
    let hadError=false;
    while(true){
      const{data,error}=await sb.from(cfg.table).select("*").range(from,from+PAGE-1);
      if(error){
        console.error("Cloud load "+key+":",error);
        hadError=true;
        break;
      }
      if(!data||data.length===0)break;
      all.push(...data);
      if(data.length<PAGE)break; // last page
      from+=PAGE;
    }
    // Return a sentinel on error so caller knows NOT to treat empty as authoritative
    if(hadError){
      return{__loadError:true,data:all.map(r=>fromDbRow(key,r))};
    }
    return all.map(r=>fromDbRow(key,r));
  }catch(e){
    console.error("Cloud load exception:",e);
    return{__loadError:true,data:[]};
  }
}
// Save a single item to cloud
async function cloudUpsert(key,item){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    const row=toDbRow(key,item);
    const{error}=await sb.from(cfg.table).upsert(row);
    if(error){console.error("Cloud upsert "+key+":",error);}
    return!error;
  }catch(e){console.error("Cloud upsert exception:",e);return false;}
}
// Delete an item from cloud
async function cloudDelete(key,id){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    const{error}=await sb.from(cfg.table).delete().eq("id",id);
    if(error)console.error("Cloud delete "+key+":",error);
    return!error;
  }catch(e){console.error("Cloud delete exception:",e);return false;}
}
// Sync entire array to cloud (upsert all in batches, delete items not in the list)
async function cloudSyncAll(key,items){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  let upsertOk=true;
  try{
    // Upsert current items in batches (Supabase has payload limits)
    // NOTE: This is intentionally ADDITIVE — we never delete rows during a sync,
    // because a stale local state could wipe out valid cloud data.
    // Explicit deletions go through cloudDelete() directly on the delete button.
    const rows=(items||[]).map(i=>toDbRow(key,{...i,id:key==="clients"?String(i.id):i.id}));
    const BATCH=200;
    for(let i=0;i<rows.length;i+=BATCH){
      const batch=rows.slice(i,i+BATCH);
      const{error}=await sb.from(cfg.table).upsert(batch);
      if(error){
        console.error("Cloud upsert "+key+" batch "+i+":",error);
        upsertOk=false;
      }
    }
    return upsertOk;
  }catch(e){console.error("Cloud sync-all exception:",e);return false;}
}

// ── CLIENTS DATABASE ───────────────────────────────────────────
function parseCSV(text){
  // Simple but robust CSV parser (handles quoted fields with commas)
  const rows=[];
  let cur=[""];let inQuote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];const n=text[i+1];
    if(c==='"'&&inQuote&&n==='"'){cur[cur.length-1]+='"';i++;}
    else if(c==='"'){inQuote=!inQuote;}
    else if(c===','&&!inQuote){cur.push("");}
    else if((c==='\n'||c==='\r')&&!inQuote){
      if(cur.length>1||cur[0]!==""){rows.push(cur);}
      cur=[""];
      if(c==='\r'&&n==='\n')i++;
    }
    else{cur[cur.length-1]+=c;}
  }
  if(cur.length>1||cur[0]!=="")rows.push(cur);
  return rows;
}

function mapXeroRow(headers,row){
  // Strip asterisks, lowercase, and trim (Xero uses *FieldName for required fields)
  const h=headers.map(x=>x.toLowerCase().replace(/^\*/,"").trim());
  function get(...names){
    for(const n of names){
      const key=n.toLowerCase().replace(/^\*/,"").trim();
      const i=h.indexOf(key);
      if(i>=0&&row[i])return row[i].trim();
    }
    return"";
  }
  // Xero's primary contact name field (required, marked with *)
  const contact=get("contactname","contact name","name");
  const first=get("firstname","first name");
  const last=get("lastname","last name","surname");
  const legal=get("legalname","legal name");
  // Build name: prefer ContactName, then First+Last, then LegalName
  const name=contact||(first+" "+last).trim()||legal;
  if(!name||name===".")return null;
  // Xero has postal (PO) and street (SA) addresses - prefer postal
  const addrParts=[
    get("poaddressline1","poaddress line 1","address line 1","saaddressline1","street","streetaddress"),
    get("poaddressline2","poaddress line 2","address line 2","saaddressline2"),
    get("pocity","city","poaddress city","sacity","suburb"),
    get("poregion","region","state","saregion"),
    get("popostalcode","postcode","zip","sapostalcode")
  ].filter(x=>x&&x!==".");
  // Try multiple phone field names, prefer mobile
  const phone=get("mobilenumber","mobile number","mobile","phonenumber","phone number","phone","ddinumber");
  // Detect if this is a company (legal name differs from contact name, or no first/last name)
  const looksLikeCompany = legal && legal!==name;
  return{
    id:Date.now()+Math.random(),
    name:name,
    email:get("emailaddress","email","email address"),
    phone:phone,
    address:addrParts.join(", "),
    company:looksLikeCompany?legal:"",
    notes:"",
    source:"Xero import",
  };
}

  const[fl,setFl]=React.useState("all");
  const[uploadStatus,setUploadStatus]=React.useState({});
  const bl={type:"team-meeting",title:"",date:"",endDate:"",startTime:"09:00",endTime:"10:00",location:"",staff:[],notes:"",attachments:[],sendToTeam:false};
  const[fm,setFm]=React.useState(bl);

  const filt = fl==="all"?events:events.filter(e=>e.type===fl);

  function openEdit(ev){
    setEditing(ev);
    setFm({type:ev.type,title:ev.title,date:ev.date,endDate:ev.endDate||ev.date,startTime:ev.startTime||"09:00",endTime:ev.endTime||"10:00",location:ev.location||"",staff:ev.staff||[],notes:ev.notes||"",attachments:ev.attachments||[],sendToTeam:ev.sendToTeam||false});
    setShowAdd(true);
  }

  function save(){
    if(!fm.title||!fm.date)return;
    const out={...fm,endDate:fm.endDate||fm.date};
    if(editing){
      setEvents(events.map(e=>e.id===editing.id?{...editing,...out}:e));
    }else{
      setEvents(e=>[...e,{...out,id:Date.now()}]);
    }
    setShowAdd(false);setEditing(null);setFm(bl);
  }

  function del(ev){
    if(confirm("Delete '"+ev.title+"'?")){
      setEvents(events.filter(e=>e.id!==ev.id));
      if(editing&&editing.id===ev.id){setShowAdd(false);setEditing(null);}
    }
  }

  async function handleFile(e){
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>10*1024*1024){alert("File too large (max 10MB)");return;}
    setUploadStatus({uploading:true,name:file.name});
    const reader=new FileReader();
    reader.onload=ev=>{
      const att={
        id:Date.now(),
        name:file.name,
        size:file.size,
        type:file.type,
        data:ev.target.result, // base64
        uploadedAt:new Date().toISOString(),
      };
      setFm(f=>({...f,attachments:[...(f.attachments||[]),att]}));
      setUploadStatus({success:true,name:file.name});
      setTimeout(()=>setUploadStatus({}),2000);
    };
    reader.onerror=()=>{setUploadStatus({error:"Upload failed"});};
    reader.readAsDataURL(file);
    e.target.value="";
  }

  function removeAttachment(attId){
    setFm(f=>({...f,attachments:f.attachments.filter(a=>a.id!==attId)}));
  }

  function downloadAttachment(att){
    const a=document.createElement("a");
    a.href=att.data;
    a.download=att.name;
    a.click();
  }

  function emailToTeam(ev){
    const staffEmails=STAFF.filter(s=>ev.staff.includes(s.id)&&s.email).map(s=>s.email).join(",");
    if(!staffEmails){alert("No staff with emails assigned to this event");return;}
    const subject=encodeURIComponent("["+EVENT_TYPES[ev.type].label+"] "+ev.title);
    const body=encodeURIComponent(
      "Hi team,\n\n"+
      ev.title+"\n"+
      "Date: "+ev.date+(ev.endDate&&ev.endDate!==ev.date?" to "+ev.endDate:"")+"\n"+
      (ev.startTime?"Time: "+ev.startTime+(ev.endTime?" – "+ev.endTime:"")+"\n":"")+
      (ev.location?"Location: "+ev.location+"\n":"")+
      (ev.notes?"\nNotes:\n"+ev.notes+"\n":"")+
      (ev.attachments&&ev.attachments.length>0?"\n⚠️ Attachments: "+ev.attachments.map(a=>a.name).join(", ")+"\n(Download from the app)\n":"")+
      "\nCheers,\nFasa\nThe Roof Hub"
    );
    window.location.href="mailto:"+staffEmails+"?subject="+subject+"&body="+body;
  }

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={()=>setFl("all")} style={{border:"1.5px solid "+(fl==="all"?"#e85d04":"#e5e7eb"),padding:"6px 14px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:600,background:fl==="all"?"#e85d04":"#fff",color:fl==="all"?"#fff":"#6b7280"}}>All</button>
        {Object.entries(EVENT_TYPES).map(([k,t])=>(
          <button key={k} onClick={()=>setFl(k)} style={{border:"1.5px solid "+(fl===k?t.color:"#e5e7eb"),padding:"6px 14px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:600,background:fl===k?t.color:"#fff",color:fl===k?"#fff":"#6b7280"}}>
            {t.icon} {t.label.split(" ")[0]}
          </button>
        ))}
        <button onClick={()=>{setEditing(null);setFm(bl);setShowAdd(true);}} style={{border:"none",padding:"7px 16px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:700,background:"#e85d04",color:"#fff",marginLeft:"auto"}}>+ New Event</button>
      </div>

      {showAdd&&<div style={card}>
        <SHd t={editing?"Edit Event":"New Event"}/>
        <label style={lb}>Event Type</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14,marginTop:6}}>
          {Object.entries(EVENT_TYPES).map(([k,t])=>(
            <button key={k} onClick={()=>setFm(f=>({...f,type:k}))} style={{padding:"10px",borderRadius:8,border:"2px solid "+(fm.type===k?t.color:"#e5e7eb"),background:fm.type===k?t.bg:"#fff",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:20}}>{t.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:fm.type===k?t.color:"#374151"}}>{t.label}</div>
                <div style={{fontSize:10,color:"#6b7280",marginTop:1}}>{t.description}</div>
              </div>
            </button>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Title *</label><input value={fm.title} onChange={e=>setFm(f=>({...f,title:e.target.value}))} style={inp} placeholder={fm.type==="inhouse-toolbox"?"e.g. Monthly Toolbox — April 2026":fm.type==="leave"?"e.g. David — Annual Leave":"Event title..."}/></div>
          <div><label style={lb}>Start Date</label><input type="date" value={fm.date} onChange={e=>{const v=e.target.value;setFm(f=>({...f,date:v,endDate:(!f.endDate||f.endDate<v)?v:f.endDate}));}} style={inp}/></div>
          <div><label style={lb}>End Date</label><input type="date" value={fm.endDate} min={fm.date} onChange={e=>setFm(f=>({...f,endDate:e.target.value}))} style={inp}/></div>
          <div><label style={lb}>Start Time</label><input type="time" value={fm.startTime} onChange={e=>setFm(f=>({...f,startTime:e.target.value}))} style={inp}/></div>
          <div><label style={lb}>End Time</label><input type="time" value={fm.endTime} onChange={e=>setFm(f=>({...f,endTime:e.target.value}))} style={inp}/></div>
          <div style={{gridColumn:"span 2"}}><label style={lb}>Location</label><input value={fm.location} onChange={e=>setFm(f=>({...f,location:e.target.value}))} style={inp} placeholder="e.g. Office, Zoom, 98 Hillsborough Rd..."/></div>
        </div>

        <label style={lb}>{fm.type==="leave"?"Staff on Leave":"Attendees"}</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12,marginTop:6}}>
          {STAFF.map(s=>(
            <button key={s.id} onClick={()=>setFm(f=>({...f,staff:f.staff.includes(s.id)?f.staff.filter(x=>x!==s.id):[...f.staff,s.id]}))} style={{padding:"5px 14px",borderRadius:20,border:"2px solid "+(fm.staff.includes(s.id)?s.color:"#e5e7eb"),cursor:"pointer",fontSize:12,fontWeight:600,background:fm.staff.includes(s.id)?s.color:"#fff",color:fm.staff.includes(s.id)?"#fff":"#6b7280",display:"flex",alignItems:"center",gap:5}}>
              <Av sid={s.id} size={18}/>{s.name.split(" ")[0]}
            </button>
          ))}
        </div>

        {EVENT_TYPES[fm.type].canUpload&&(
          <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:10,padding:12,marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:700,color:"#5b21b6",marginBottom:6}}>📎 PowerPoint / Files</div>
            <div style={{fontSize:11,color:"#6d28d9",marginBottom:10}}>Upload your meeting slides — team members can download them anytime from the Events list.</div>
            <input type="file" accept=".pptx,.ppt,.pdf,.doc,.docx,.jpg,.jpeg,.png" onChange={handleFile} style={{display:"block",fontSize:12,marginBottom:10}}/>
            {uploadStatus.uploading&&<div style={{fontSize:11,color:"#7c3aed"}}>Uploading {uploadStatus.name}...</div>}
            {uploadStatus.success&&<div style={{fontSize:11,color:"#16a34a",fontWeight:600}}>✓ Uploaded {uploadStatus.name}</div>}
            {uploadStatus.error&&<div style={{fontSize:11,color:"#dc2626"}}>{uploadStatus.error}</div>}
            {fm.attachments&&fm.attachments.length>0&&<div style={{marginTop:8,display:"flex",flexDirection:"column",gap:5}}>
              {fm.attachments.map(a=>(
                <div key={a.id} style={{background:"#fff",border:"1px solid #ddd6fe",borderRadius:6,padding:"6px 10px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:600,color:"#111827",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📎 {a.name}</div>
                    <div style={{fontSize:10,color:"#9ca3af"}}>{(a.size/1024).toFixed(0)} KB</div>
                  </div>
                  <button onClick={()=>removeAttachment(a.id)} style={{background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",padding:"3px 8px",borderRadius:5,cursor:"pointer",fontSize:11}}>Remove</button>
                </div>
              ))}
            </div>}
            <div style={{marginTop:10,display:"flex",alignItems:"center",gap:8,padding:8,background:"#fff",borderRadius:6,border:"1px solid #ddd6fe"}}>
              <input type="checkbox" checked={fm.sendToTeam} onChange={e=>setFm(f=>({...f,sendToTeam:e.target.checked}))} style={{width:16,height:16,cursor:"pointer"}}/>
              <span style={{fontSize:12,color:"#374151"}}>📧 Email this to team when saved</span>
            </div>
          </div>
        )}

        <label style={lb}>Notes / Agenda</label>
        <textarea value={fm.notes} onChange={e=>setFm(f=>({...f,notes:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:14}} placeholder={fm.type==="inhouse-toolbox"?"Meeting agenda, topics to cover...":"Notes..."}/>

        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={save} style={{background:"#e85d04",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>{editing?"Update Event":"Create Event"}</button>
          <button onClick={()=>{setShowAdd(false);setEditing(null);setFm(bl);}} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"9px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
          {editing&&<button onClick={()=>del(editing)} style={{background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",padding:"9px 16px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,marginLeft:"auto"}}>🗑 Delete</button>}
        </div>
      </div>}

      {filt.length===0&&<div style={{...card,textAlign:"center",padding:40,color:"#9ca3af"}}>No events yet.<br/>Tap "+ New Event" to schedule meetings, training, leave, or toolbox sessions.</div>}
      {filt.sort((a,b)=>b.date.localeCompare(a.date)).map(ev=>{
        const t=EVENT_TYPES[ev.type];
        return(
          <div key={ev.id} style={{...card,borderLeft:"4px solid "+t.color,cursor:"pointer",position:"relative"}} onClick={()=>openEdit(ev)}>
            <button onClick={(e)=>{e.stopPropagation();del(ev);}} style={{position:"absolute",top:12,right:12,background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:14,padding:0,zIndex:2}}>🗑</button>
            <div style={{display:"flex",alignItems:"flex-start",gap:12,paddingRight:36}}>
              <div style={{background:t.bg,border:"1px solid "+t.border,borderRadius:10,width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{t.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{background:t.bg,color:t.color,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:6,border:"1px solid "+t.border,textTransform:"uppercase"}}>{t.label}</span>
                </div>
                <div style={{color:"#111827",fontWeight:700,fontSize:15,marginTop:4}}>{ev.title}</div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:4,fontSize:12,color:"#6b7280"}}>
                  <span>📅 {ev.date}{ev.endDate&&ev.endDate!==ev.date?" → "+ev.endDate:""}</span>
                  {(ev.startTime||ev.endTime)&&<span>🕐 {formatTimeSlot(ev)}</span>}
                  {ev.location&&<span>📍 {ev.location}</span>}
                </div>
                {ev.staff&&ev.staff.length>0&&<div style={{display:"flex",marginTop:8,gap:2,flexWrap:"wrap"}}>{ev.staff.map(s=><Av key={s} sid={s} size={22}/>)}</div>}
                {ev.attachments&&ev.attachments.length>0&&<div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
                  {ev.attachments.map(a=>(
                    <button key={a.id} onClick={(e)=>{e.stopPropagation();downloadAttachment(a);}} style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:6,padding:"5px 10px",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:14}}>📎</span>
                      <span style={{fontSize:11,color:"#5b21b6",fontWeight:600,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name}</span>
                      <span style={{fontSize:10,color:"#7c3aed"}}>⬇️ {(a.size/1024).toFixed(0)}KB</span>
                    </button>
                  ))}
                </div>}
                {ev.notes&&<div style={{color:"#6b7280",fontSize:12,marginTop:8,padding:"8px 10px",background:"#f9fafb",borderRadius:6,fontStyle:"italic"}}>{ev.notes}</div>}
                {ev.type==="inhouse-toolbox"&&ev.staff.length>0&&<button onClick={(e)=>{e.stopPropagation();emailToTeam(ev);}} style={{marginTop:10,background:"#2563eb",color:"#fff",border:"none",padding:"6px 14px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer"}}>📧 Email Team</button>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── LOGIN SCREEN ──────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[email,setEmail]=React.useState(()=>localStorage.getItem("roofhub_last_email")||"");
  const[password,setPassword]=React.useState("");
  const[error,setError]=React.useState("");
  const[loading,setLoading]=React.useState(false);
  const[staySignedIn,setStaySignedIn]=React.useState(()=>localStorage.getItem("roofhub_stay_signed_in")!=="false");
  const[mode,setMode]=React.useState("login"); // "login" | "forgot" | "resetSent"
  const[resetEmail,setResetEmail]=React.useState("");
  const[resetLoading,setResetLoading]=React.useState(false);
  const[resetMessage,setResetMessage]=React.useState("");
  
  async function handleLogin(){
    setError("");
    if(!email||!password){setError("Please enter your email and password");return;}
    setLoading(true);
    try{
      const{data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){setError(error.message);setLoading(false);return;}
      // Save preferences
      localStorage.setItem("roofhub_last_email",email);
      localStorage.setItem("roofhub_stay_signed_in",staySignedIn?"true":"false");
      onLogin(data.user);
    }catch(e){
      setError("Connection failed. Check your internet and try again.");
      setLoading(false);
    }
  }
  
  async function handleForgotPassword(){
    setResetMessage("");
    if(!resetEmail){setResetMessage("Please enter your email address");return;}
    setResetLoading(true);
    try{
      const redirectTo=window.location.origin+window.location.pathname;
      const{error}=await sb.auth.resetPasswordForEmail(resetEmail,{redirectTo});
      if(error){setResetMessage("Error: "+error.message);setResetLoading(false);return;}
      setMode("resetSent");
      setResetLoading(false);
    }catch(e){
      setResetMessage("Connection failed. Try again.");
      setResetLoading(false);
    }
  }
  
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a1a2e 0%,#cc0000 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:16,padding:"32px 28px",width:"100%",maxWidth:400,boxShadow:"0 25px 60px rgba(0,0,0,0.4)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <img src={LOGO} alt="The Roof Hub" style={{height:80,objectFit:"contain",marginBottom:8}}/>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#1a1a2e",letterSpacing:1}}>BUSINESS MANAGER</div>
          <div style={{fontSize:12,color:"#6b7280",marginTop:4}}>
            {mode==="login"&&"Sign in to access your team dashboard"}
            {mode==="forgot"&&"Reset your password"}
            {mode==="resetSent"&&"Check your email"}
          </div>
        </div>
        
        {mode==="login"&&<>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="your@email.com" style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"}} autoComplete="email" autoFocus={!email}/>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>Password</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="Enter your password" style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"}} autoComplete="current-password" autoFocus={!!email}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:6}}>
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#374151",cursor:"pointer",userSelect:"none"}}>
              <input type="checkbox" checked={staySignedIn} onChange={e=>setStaySignedIn(e.target.checked)} style={{width:15,height:15,accentColor:"#e85d04",cursor:"pointer"}}/>
              Stay signed in
            </label>
            <button onClick={()=>{setMode("forgot");setResetEmail(email);setResetMessage("");setError("");}} style={{background:"none",border:"none",color:"#e85d04",fontSize:12,fontWeight:700,cursor:"pointer",padding:0}}>Forgot password?</button>
          </div>
          {error&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",color:"#991b1b",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>⚠️ {error}</div>}
          <button onClick={handleLogin} disabled={loading} style={{width:"100%",background:loading?"#9ca3af":"#e85d04",color:"#fff",border:"none",padding:"12px",borderRadius:8,fontWeight:700,fontSize:14,cursor:loading?"wait":"pointer",boxShadow:"0 4px 12px rgba(232,93,4,0.3)"}}>{loading?"Signing in...":"Sign In →"}</button>
          <div style={{marginTop:16,padding:10,background:"#f9fafb",borderRadius:8,fontSize:11,color:"#6b7280",textAlign:"center"}}>
            🔒 Secured by Supabase · Your data syncs across all devices
          </div>
        </>}
        
        {mode==="forgot"&&<>
          <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:10,marginBottom:14,fontSize:11,color:"#1e40af",lineHeight:1.5}}>
            💡 Enter your email. We'll send you a link to reset your password.
          </div>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>Email</label>
            <input type="email" value={resetEmail} onChange={e=>setResetEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleForgotPassword()} placeholder="your@email.com" style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"}} autoComplete="email" autoFocus/>
          </div>
          {resetMessage&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",color:"#991b1b",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>⚠️ {resetMessage}</div>}
          <button onClick={handleForgotPassword} disabled={resetLoading} style={{width:"100%",background:resetLoading?"#9ca3af":"#e85d04",color:"#fff",border:"none",padding:"12px",borderRadius:8,fontWeight:700,fontSize:14,cursor:resetLoading?"wait":"pointer",marginBottom:10}}>{resetLoading?"Sending...":"📧 Send Reset Link"}</button>
          <button onClick={()=>{setMode("login");setResetMessage("");}} style={{width:"100%",background:"none",color:"#6b7280",border:"1px solid #e5e7eb",padding:"10px",borderRadius:8,fontWeight:600,fontSize:13,cursor:"pointer"}}>← Back to Sign In</button>
        </>}
        
        {mode==="resetSent"&&<>
          <div style={{textAlign:"center",padding:"10px 0 20px"}}>
            <div style={{fontSize:48,marginBottom:10}}>📧</div>
            <div style={{fontSize:14,fontWeight:700,color:"#111827",marginBottom:8}}>Reset link sent!</div>
            <div style={{fontSize:12,color:"#6b7280",lineHeight:1.6}}>
              We've sent a password reset link to:<br/>
              <strong style={{color:"#111827"}}>{resetEmail}</strong>
            </div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:10,lineHeight:1.6}}>
              Check your inbox (and spam folder). Click the link in the email to set a new password.
            </div>
          </div>
          <button onClick={()=>{setMode("login");setResetEmail("");setResetMessage("");}} style={{width:"100%",background:"#e85d04",color:"#fff",border:"none",padding:"11px",borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer"}}>← Back to Sign In</button>
        </>}
      </div>
    </div>
  );
}

// ── AUTH WRAPPER ──────────────────────────────────────────────
function AuthWrapper(){
  const[user,setUser]=React.useState(null);
  const[checking,setChecking]=React.useState(true);
  const[recoveryMode,setRecoveryMode]=React.useState(false);
  
  React.useEffect(()=>{
    if(!sb){setChecking(false);return;}
    // Check if already logged in
    sb.auth.getSession().then(({data})=>{
      if(data.session)setUser(data.session.user);
      setChecking(false);
    });
    // Listen for auth changes — including PASSWORD_RECOVERY
    const{data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
      if(event==="PASSWORD_RECOVERY"){
        // User clicked the reset link in their email
        setRecoveryMode(true);
        setUser(session?.user||null);
      }else{
        setUser(session?.user||null);
      }
    });
    return()=>subscription.unsubscribe();
  },[]);
  
  async function signOut(){
    if(confirm("Sign out of The Roof Hub?")){
      await sb.auth.signOut();
      setUser(null);
      setRecoveryMode(false);
    }
  }
  
  if(checking){
    return(
      <div style={{minHeight:"100vh",background:"#f4f5f7",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{textAlign:"center"}}>
          <img src={LOGO} alt="" style={{height:80,objectFit:"contain",opacity:0.7,marginBottom:14}}/>
          <div style={{color:"#6b7280",fontSize:13}}>Loading...</div>
        </div>
      </div>
    );
  }
  
  if(!sb){
    return(
      <div style={{minHeight:"100vh",background:"#f4f5f7",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#fff",borderRadius:12,padding:24,maxWidth:400,textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:10}}>⚠️</div>
          <div style={{fontSize:15,fontWeight:700,color:"#dc2626",marginBottom:8}}>Connection Error</div>
          <div style={{fontSize:12,color:"#6b7280"}}>Could not connect to the cloud. Please check your internet connection and refresh the page.</div>
        </div>
      </div>
    );
  }
  
  // Password reset flow — user clicked the email link
  if(recoveryMode){
    return <PasswordResetScreen user={user} onDone={()=>{setRecoveryMode(false);}}/>;
  }
  
  if(!user){
    return <LoginScreen onLogin={setUser}/>;
  }
  
  return <App user={user} onSignOut={signOut}/>;
}

// ── PASSWORD RESET SCREEN (shown after clicking email link) ──────
function PasswordResetScreen({user,onDone}){
  const[newPassword,setNewPassword]=React.useState("");
  const[confirmPassword,setConfirmPassword]=React.useState("");
  const[loading,setLoading]=React.useState(false);
  const[error,setError]=React.useState("");
  const[success,setSuccess]=React.useState(false);
  
  async function handleReset(){
    setError("");
    if(!newPassword||newPassword.length<8){
      setError("Password must be at least 8 characters");return;
    }
    if(newPassword!==confirmPassword){
      setError("Passwords don't match");return;
    }
    setLoading(true);
    try{
      const{error}=await sb.auth.updateUser({password:newPassword});
      if(error){setError(error.message);setLoading(false);return;}
      setSuccess(true);
      setLoading(false);
      // Auto-redirect after 2 sec
      setTimeout(()=>{onDone();},2000);
    }catch(e){
      setError("Connection failed. Try again.");
      setLoading(false);
    }
  }
  
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a1a2e 0%,#cc0000 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:16,padding:"32px 28px",width:"100%",maxWidth:400,boxShadow:"0 25px 60px rgba(0,0,0,0.4)"}}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <img src={LOGO} alt="The Roof Hub" style={{height:80,objectFit:"contain",marginBottom:8}}/>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#1a1a2e",letterSpacing:1}}>
            {success?"✅ PASSWORD UPDATED":"🔑 SET NEW PASSWORD"}
          </div>
          {!success&&user&&<div style={{fontSize:12,color:"#6b7280",marginTop:6}}>For <strong>{user.email}</strong></div>}
        </div>
        
        {success?<>
          <div style={{textAlign:"center",padding:"10px 0 20px"}}>
            <div style={{fontSize:48,marginBottom:10}}>🎉</div>
            <div style={{fontSize:13,color:"#14532d",fontWeight:700,background:"#f0fdf4",border:"1px solid #bbf7d0",padding:12,borderRadius:8}}>
              Your password has been updated successfully!
            </div>
            <div style={{fontSize:11,color:"#6b7280",marginTop:10}}>Redirecting to the app...</div>
          </div>
        </>:<>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>New Password</label>
            <input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleReset()} placeholder="Minimum 8 characters" style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"}} autoComplete="new-password" autoFocus/>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>Confirm New Password</label>
            <input type="password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleReset()} placeholder="Type it again" style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"}} autoComplete="new-password"/>
          </div>
          {error&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",color:"#991b1b",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>⚠️ {error}</div>}
          <button onClick={handleReset} disabled={loading} style={{width:"100%",background:loading?"#9ca3af":"#e85d04",color:"#fff",border:"none",padding:"12px",borderRadius:8,fontWeight:700,fontSize:14,cursor:loading?"wait":"pointer"}}>{loading?"Updating...":"💾 Update Password"}</button>
        </>}
      </div>
    </div>
  );
}

function App({user,onSignOut}){
  const[tab,setTab]=React.useState(()=>loadData("tab","home"));
  const[jobs,setJobs]=React.useState(()=>loadData("jobs",INIT_JOBS));
  const[ts,setTs]=React.useState(()=>loadData("ts",INIT_TS));
  const[clients,setClients]=React.useState(()=>loadData("clients",[]));
  const[events,setEvents]=React.useState(()=>loadData("events",INIT_EVENTS));
  const[incidents,setIncidents]=React.useState(()=>loadData("incidents",[]));
  const[quotes,setQuotes]=React.useState(()=>loadData("quotes",[]));
  const[certs,setCerts]=React.useState(()=>loadData("certs",[]));
  const[savedIndicator,setSavedIndicator]=React.useState(false);
  const[syncStatus,setSyncStatus]=React.useState("loading"); // loading | synced | syncing | offline
  const initialLoadDone=React.useRef(false);
  
  // ── ONE-TIME BREAK POLICY ACKNOWLEDGEMENT ────────────────
  // Shown once per user. They tick the box → stored in localStorage so it never shows again.
  // Uses a versioned key so we can re-prompt if the policy changes.
  const BREAK_POLICY_VERSION="v1-2026-04-22";
  const ackKey="break_policy_ack_"+(user?.email||"anon")+"_"+BREAK_POLICY_VERSION;
  const[showBreakPolicy,setShowBreakPolicy]=React.useState(()=>!localStorage.getItem(ackKey));
  function ackBreakPolicy(){
    localStorage.setItem(ackKey,new Date().toISOString());
    setShowBreakPolicy(false);
  }
  
  // ── CLOUD: Initial load when user logs in ────────────────
  React.useEffect(()=>{
    let cancelled=false;
    async function loadFromCloud(){
      setSyncStatus("loading");
      try{
        const[cloudJobs,cloudClients,cloudEvents,cloudTs,cloudIncidents,cloudQuotes,cloudCerts]=await Promise.all([
          cloudLoad("jobs"),
          cloudLoad("clients"),
          cloudLoad("events"),
          cloudLoad("ts"),
          cloudLoad("incidents"),
          cloudLoad("quotes"),
          cloudLoad("certs"),
        ]);
        if(cancelled)return;
        
        // Load local data
        const localJobs=loadData("jobs",[]);
        const localClients=loadData("clients",[]);
        const localEvents=loadData("events",[]);
        const localTs=loadData("ts",[]);
        const localIncidents=loadData("incidents",[]);
        const localQuotes=loadData("quotes",[]);
        const localCerts=loadData("certs",[]);
        
        // Unwrap error-sentinel objects from cloudLoad — if error, treat as "can't determine cloud state"
        function unwrap(x){
          if(x&&typeof x==="object"&&x.__loadError)return{data:x.data||[],errored:true};
          return{data:x||[],errored:false};
        }
        const cj=unwrap(cloudJobs),cc=unwrap(cloudClients),ce=unwrap(cloudEvents),
              ctx=unwrap(cloudTs),ci=unwrap(cloudIncidents),cq=unwrap(cloudQuotes),cct=unwrap(cloudCerts);
        
        // SAFE merge: if cloud load errored, fall back to local (never overwrite cloud)
        // if both have data, union by ID (prefer cloud version where IDs match, but keep local-only items)
        async function safeMergeOrLoad(key,cloudResult,localData,setter){
          if(cloudResult.errored){
            // Cloud failed to load — use local so user still sees their stuff
            // Do NOT sync back to cloud — we don't know what's actually up there
            console.warn("⚠️ "+key+" cloud load errored, using local only (NOT syncing back to avoid data loss)");
            setter(localData);
            return{syncOnMount:false};
          }
          const cloudData=cloudResult.data;
          if(cloudData.length===0&&localData.length>0){
            // Cloud empty, local has data — migrate local up
            console.log("Migrating "+localData.length+" "+key+" to cloud...");
            const ok=await cloudSyncAll(key,localData);
            setter(localData);
            return{syncOnMount:ok};
          }
          // Merge cloud + local: cloud wins for same IDs, but local-only items are preserved
          const cloudIds=new Set(cloudData.map(i=>String(i.id)));
          const localOnly=localData.filter(i=>!cloudIds.has(String(i.id)));
          if(localOnly.length>0){
            console.log("Found "+localOnly.length+" "+key+" in local not in cloud — merging & pushing up");
            const merged=[...cloudData,...localOnly];
            await cloudSyncAll(key,merged);
            setter(merged);
          }else{
            setter(cloudData);
          }
          return{syncOnMount:true};
        }
        
        await Promise.all([
          safeMergeOrLoad("jobs",cj,localJobs,setJobs),
          safeMergeOrLoad("clients",cc,localClients,setClients),
          safeMergeOrLoad("events",ce,localEvents,setEvents),
          safeMergeOrLoad("ts",ctx,localTs,setTs),
          safeMergeOrLoad("incidents",ci,localIncidents,setIncidents),
          safeMergeOrLoad("quotes",cq,localQuotes,setQuotes),
          safeMergeOrLoad("certs",cct,localCerts,setCerts),
        ]);
        
        setSyncStatus("synced");
        initialLoadDone.current=true;
      }catch(e){
        console.error("Initial cloud load failed:",e);
        setSyncStatus("offline");
        initialLoadDone.current=true;
      }
    }
    loadFromCloud();
    return()=>{cancelled=true;};
  },[]);
  
  // Auto-save whenever data changes (local + cloud)
  React.useEffect(()=>{saveData("tab",tab);},[tab]);
  
  // Local save + cloud sync on every data change
  React.useEffect(()=>{
    saveData("jobs",jobs);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("jobs",jobs).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[jobs]);
  React.useEffect(()=>{
    saveData("ts",ts);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("ts",ts).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[ts]);
  React.useEffect(()=>{
    saveData("clients",clients);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("clients",clients).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);

  React.useEffect(()=>{

    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("events",events).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[events]);
  React.useEffect(()=>{
    saveData("incidents",incidents);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("incidents",incidents).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[incidents]);
  React.useEffect(()=>{
    saveData("quotes",quotes);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("quotes",quotes).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[quotes]);
  React.useEffect(()=>{
    saveData("certs",certs);
    if(!initialLoadDone.current)return;
    setSyncStatus("syncing");
    setSavedIndicator(true);
    cloudSyncAll("certs",certs).then(ok=>{
      setSyncStatus(ok?"synced":"offline");
      setTimeout(()=>setSavedIndicator(false),1500);
    });
  },[certs]);
  
  function resetAllData(){
    if(confirm("⚠️ This will reset ALL your data back to the starting demo data. Are you sure? This cannot be undone.")){
      localStorage.removeItem("roofhub_jobs");
      localStorage.removeItem("roofhub_ts");
      localStorage.removeItem("roofhub_tab");
      localStorage.removeItem("roofhub_clients");
      localStorage.removeItem("roofhub_events");
      localStorage.removeItem("roofhub_incidents");
      localStorage.removeItem("roofhub_quotes");
      localStorage.removeItem("roofhub_certs");
      window.location.reload();
    }
  }

  function exportAllData(){
    const data={jobs,ts,clients,events,incidents,quotes,certs,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="roofhub-backup-"+new Date().toISOString().split("T")[0]+".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.jobs&&data.ts){
          if(confirm("This will replace all current data with the backup from "+new Date(data.exportedAt).toLocaleDateString()+". Continue?")){
            setJobs(data.jobs);
            setTs(data.ts);
            if(data.clients)setClients(data.clients);
            if(data.events)setEvents(data.events);
            if(data.incidents)setIncidents(data.incidents);
            if(data.quotes)setQuotes(data.quotes);
            if(data.certs)setCerts(data.certs);
            alert("✓ Data restored successfully!");
          }
        }else{alert("❌ Invalid backup file");}
      }catch(e){alert("❌ Could not read backup file");}
    };
    reader.readAsText(file);
  }

  const tabs=[
    {id:"home",icon:"🏠",label:"Home"},
    {id:"work",icon:"🔨",label:"Work"},
    {id:"safety",icon:"📋",label:"Safety"},
    {id:"time",icon:"⏱️",label:"Time"},
    {id:"team",icon:"👥",label:"Team"},
  ];
  
  // Sub-tabs for each main section
  const subTabs={
    work:[

      {id:"jobs",icon:"🔨",label:"Jobs"},
      {id:"schedule",icon:"👷",label:"Schedule"},
      {id:"events",icon:"📅",label:"Events"},
    ],
    safety:[
      {id:"toolbox",icon:"📋",label:"Toolbox"},
      {id:"sssp",icon:"⚠️",label:"SSSP"},
      {id:"forms",icon:"📄",label:"Forms"},
    ],
    team:[
      {id:"staff",icon:"👥",label:"Staff"},
      {id:"pay",icon:"💰",label:"Pay"},
      {id:"clients",icon:"👤",label:"Clients"},

  // Migrate old single tab names to new main/sub structure
  const tabMigration={
    home:{main:"home",sub:"home"},
    jobs:{main:"work",sub:"jobs"},

    schedule:{main:"work",sub:"schedule"},

  const current=tabMigration[tab]||{main:"work",sub:"jobs"};

  const activeSub=current.sub;
  
  const[tabResetTick,setTabResetTick]=React.useState(0);
  function switchMain(newMain){
    // If tapping the tab we're already on → bump reset tick (lets views clear their state)
    const currentMainNow=(tabMigration[tab]||{main:"work"}).main;
    if(currentMainNow===newMain){setTabResetTick(t=>t+1);return;}
    // Use first sub-tab of new main section
    if(newMain==="time"){setTab("time");return;}
    if(newMain==="home"){setTab("home");return;}
    const firstSub=(subTabs[newMain]||[])[0];
    if(firstSub)setTab(firstSub.id);
  }
  function switchSub(newSub){
    // If tapping the sub-tab we're already on → bump reset tick
    if(tab===newSub){setTabResetTick(t=>t+1);return;}

  const pendingSSSP = jobs.filter(j=>j.ssspRequired&&!j.ssspCompleted).length;

        <div style={{background:"#fff",borderRadius:16,padding:24,maxWidth:460,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
          <div style={{fontSize:40,textAlign:"center",marginBottom:10}}>☕</div>

          <div style={{fontSize:13,color:"#374151",lineHeight:1.6,marginBottom:14}}>
            Hi <strong>{(STAFF.find(s=>s.email&&s.email.toLowerCase()===currentEmail)?.name||"Team Member").split(" ")[0]}</strong> 👋 — a quick update on how paid hours are calculated:
          </div>
          <div style={{background:"#fff7ed",border:"1.5px solid #fdba74",borderRadius:10,padding:14,marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:700,color:"#9a3412",marginBottom:8}}>📋 New standard break rule:</div>
            <div style={{fontSize:13,color:"#9a3412",lineHeight:1.6}}>
              For any day you work <strong>more than 4 hours</strong>, an <strong>unpaid 30-minute break</strong> will be automatically deducted from your timesheet.
            </div>
          </div>
          <div style={{fontSize:12,color:"#6b7280",lineHeight:1.6,marginBottom:14}}>
            <strong style={{color:"#111827"}}>Example:</strong> If you clock in at 7:00 AM and clock out at 3:30 PM (8.5 hours), you'll be paid for <strong>8.0 hours</strong> (30-min break deducted). For short shifts of 4 hours or less, no break is deducted.
          </div>
          <div style={{fontSize:11,color:"#6b7280",background:"#f9fafb",padding:10,borderRadius:8,marginBottom:16,lineHeight:1.5}}>

          </div>
          <button onClick={ackBreakPolicy} style={{width:"100%",background:"#e85d04",color:"#fff",border:"none",padding:"14px",borderRadius:10,fontWeight:700,fontSize:15,cursor:"pointer",boxShadow:"0 4px 12px rgba(232,93,4,0.3)"}}>
            ✓ I understand — got it
          </button>
          <div style={{fontSize:10,color:"#9ca3af",textAlign:"center",marginTop:10}}>
            You'll only see this once. Policy version {BREAK_POLICY_VERSION}.

        {tab==="calendar"&&<CalendarView jobs={jobs} setJobs={setJobs} clients={clients} events={events}/>}

        {tab==="events"&&<EventsView events={events} setEvents={setEvents}/>}
        {tab==="clients"&&<ClientsView clients={clients} setClients={setClients} jobs={jobs}/>}
        {tab==="toolbox"&&<ToolboxView jobs={jobs}/>}
        {tab==="sssp"&&<SSSPView jobs={jobs} setJobs={setJobs}/>}
        {tab==="time"&&<TimesheetsView jobs={jobs} ts={ts} setTs={setTs} user={user}/>}
        {tab==="forms"&&<FormsView jobs={jobs} clients={clients} incidents={incidents} setIncidents={setIncidents} quotes={quotes} setQuotes={setQuotes} setJobs={setJobs} setTab={setTab}/>}
        {(tab==="staff"||tab==="team")&&<TeamView ts={ts} jobs={jobs} certs={certs} setCerts={setCerts}/>}
        {tab==="pay"&&<PayView ts={ts} jobs={jobs} user={user}/>}
      </div>
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1px solid #e5e7eb",display:"flex",justifyContent:"space-around",padding:"8px 0 10px",boxShadow:"0 -2px 10px rgba(0,0,0,0.06)"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>switchMain(t.id)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"2px 4px",flex:1,minWidth:0}}>
            <span style={{fontSize:22}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:700,color:mainTab===t.id?"#e85d04":"#9ca3af",letterSpacing:0.2,textTransform:"uppercase"}}>{t.label}</span>
            {mainTab===t.id&&<div style={{width:22,height:3,background:"#e85d04",borderRadius:2}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthWrapper/>);
</script>
</body>
</html>
