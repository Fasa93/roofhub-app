          {selected.contributingFactors&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🔍 Contributing Factors</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",whiteSpace:"pre-wrap"}}>{selected.contributingFactors}</div>
          </div>}
          {selected.preventativeAction&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🛡️ Preventative Action</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f0fdf4",borderRadius:8,border:"1px solid #bbf7d0",whiteSpace:"pre-wrap"}}>{selected.preventativeAction}</div>
          </div>}
          
          <div style={{padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",fontSize:11,color:"#6b7280",display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            <div><strong>Reported by:</strong> {selected.reportedBy}</div>
            <div><strong>Reported on:</strong> {selected.reportedDate}</div>
            {selected.worksafeNotified&&<div style={{gridColumn:"span 2",color:"#dc2626",fontWeight:600}}>⚠️ Notified to WorkSafe NZ {selected.worksafeRefNumber?"— Ref: "+selected.worksafeRefNumber:""}</div>}
            {selected.closedOut&&<div style={{gridColumn:"span 2",color:"#16a34a",fontWeight:600}}>✓ Closed out by {selected.closedOutBy} on {selected.closedOutDate}</div>}
          </div>
        </div>
      </div>
    );
  }

  // FORM VIEW
  if(showForm){
    return(
      <div>
        <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Register</button>
        <div style={card}>
          <SHd t={editing?"✏️ Edit Incident":"⚠️ Record New Incident"} color="#dc2626"/>
          <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,padding:10,marginBottom:14,fontSize:11,color:"#991b1b"}}>
            <strong>⚖️ Legal requirement:</strong> Under the HSW Act 2015, all workplace incidents must be recorded. "Notifiable events" must be reported to WorkSafe NZ within the required timeframe.
          </div>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Date *</label><input type="date" value={fm.date} onChange={e=>setFm(f=>({...f,date:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Time</label><input type="time" value={fm.time} onChange={e=>setFm(f=>({...f,time:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Type *</label><select value={fm.type} onChange={e=>setFm(f=>({...f,type:e.target.value}))} style={inp}>{Object.entries(INCIDENT_TYPES).map(([k,t])=><option key={k} value={k}>{t.icon} {t.label}</option>)}</select></div>
            <div><label style={lb}>Severity *</label><select value={fm.severity} onChange={e=>setFm(f=>({...f,severity:e.target.value}))} style={inp}>{Object.entries(INCIDENT_SEVERITY).map(([k,s])=><option key={k} value={k}>{s.label}</option>)}</select></div>
            <div><label style={lb}>Location (on-site)</label><input value={fm.location} onChange={e=>setFm(f=>({...f,location:e.target.value}))} style={inp} placeholder="e.g. Front ridge, scaffold level 2..."/></div>
            <div><label style={lb}>Linked Job</label><select value={fm.linkedJobId} onChange={e=>{const jid=e.target.value;const j=jobs.find(jj=>jj.id.toString()===jid);setFm(f=>({...f,linkedJobId:jid,address:j?j.address:f.address}));}} style={inp}><option value="">— None —</option>{jobs.map(j=><option key={j.id} value={j.id}>{j.client} — {j.address}</option>)}</select></div>
            <div style={{gridColumn:"span 2"}}><label style={lb}>🔍 Site Address</label><AddressInput value={fm.address} onChange={v=>setFm(f=>({...f,address:v}))} placeholder="Start typing..."/></div>
          </div>

          <SHd t="👤 People Involved" color="#dc2626"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Person Involved</label><input value={fm.personInvolved} onChange={e=>setFm(f=>({...f,personInvolved:e.target.value}))} style={inp} placeholder="Full name"/></div>
            <div><label style={lb}>Role / Position</label><input value={fm.personRole} onChange={e=>setFm(f=>({...f,personRole:e.target.value}))} style={inp} placeholder="e.g. Labourer, Site Foreman, Visitor"/></div>
            <div style={{gridColumn:"span 2"}}><label style={lb}>Witnesses</label><input value={fm.witnesses} onChange={e=>setFm(f=>({...f,witnesses:e.target.value}))} style={inp} placeholder="Names of any witnesses"/></div>
          </div>

          <SHd t="📝 What Happened" color="#dc2626"/>
          <label style={lb}>Description of Incident *</label>
          <textarea value={fm.description} onChange={e=>setFm(f=>({...f,description:e.target.value}))} rows={4} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="Detailed description of what happened, how it happened, and what injuries/damage occurred..."/>
          <label style={lb}>Immediate Action Taken</label>
          <textarea value={fm.immediateAction} onChange={e=>setFm(f=>({...f,immediateAction:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="What was done straight away — first aid, stopped work, called 111, etc."/>
          <label style={lb}>Contributing Factors</label>
          <textarea value={fm.contributingFactors} onChange={e=>setFm(f=>({...f,contributingFactors:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="Why did this happen? Weather, fatigue, missing PPE, faulty equipment, training gap..."/>
          <label style={lb}>Preventative Action</label>
          <textarea value={fm.preventativeAction} onChange={e=>setFm(f=>({...f,preventativeAction:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:14}} placeholder="What will we do to stop this happening again?"/>

          <SHd t="📋 Reporting" color="#dc2626"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Reported By</label><input value={fm.reportedBy} onChange={e=>setFm(f=>({...f,reportedBy:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Date Reported</label><input type="date" value={fm.reportedDate} onChange={e=>setFm(f=>({...f,reportedDate:e.target.value}))} style={inp}/></div>
            <div style={{gridColumn:"span 2",display:"flex",alignItems:"center",gap:10,padding:10,background:fm.worksafeNotified?"#fef2f2":"#f9fafb",borderRadius:8,border:"1px solid "+(fm.worksafeNotified?"#fca5a5":"#e5e7eb")}}>
              <input type="checkbox" checked={fm.worksafeNotified} onChange={e=>setFm(f=>({...f,worksafeNotified:e.target.checked}))} style={{width:18,height:18,cursor:"pointer"}}/>
              <span style={{fontSize:13,color:"#374151",fontWeight:600}}>Notified to WorkSafe NZ (0800 030 040)</span>
            </div>
            {fm.worksafeNotified&&<div style={{gridColumn:"span 2"}}><label style={lb}>WorkSafe Reference Number</label><input value={fm.worksafeRefNumber} onChange={e=>setFm(f=>({...f,worksafeRefNumber:e.target.value}))} style={inp} placeholder="Reference provided by WorkSafe"/></div>}
          </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={save} style={{background:"#dc2626",color:"#fff",border:"none",padding:"10px 24px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>{editing?"💾 Update Incident":"💾 Save Incident"}</button>
            <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
      </div>
    );
  }

  // MAIN LIST VIEW
  return(
    <div>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Forms</button>
      
      <div style={{...card,background:"linear-gradient(135deg,#fef2f2,#fecaca)",borderLeft:"4px solid #dc2626",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#991b1b"}}>⚠️ Incident Register</div>
            <div style={{fontSize:11,color:"#7f1d1d"}}>WorkSafe NZ compliant · HSW Act 2015 · Retained for 5+ years</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button onClick={openAdd} style={{background:"#dc2626",color:"#fff",border:"none",padding:"8px 16px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:12}}>+ Log Incident</button>
            {incidents.length>0&&<button onClick={exportCSV} style={{background:"#fff",color:"#991b1b",border:"1px solid #fca5a5",padding:"8px 14px",borderRadius:8,fontWeight:600,cursor:"pointer",fontSize:12}}>📤 Export CSV</button>}
          </div>
        </div>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:12}}>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#991b1b",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.total}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>Total</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#d97706",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.open}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>Open</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#2563eb",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.thisYear}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>{currentYear}</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#991b1b",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.notifiable}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>Notifiable</div>
          </div>
        </div>
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#6b7280",fontWeight:700}}>Year:</span>
        <button onClick={()=>setYearFilter("all")} style={{background:yearFilter==="all"?"#dc2626":"#fff",color:yearFilter==="all"?"#fff":"#6b7280",border:"1px solid "+(yearFilter==="all"?"#dc2626":"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>All</button>
        {years.map(y=>(
          <button key={y} onClick={()=>setYearFilter(y.toString())} style={{background:yearFilter===y.toString()?"#dc2626":"#fff",color:yearFilter===y.toString()?"#fff":"#6b7280",border:"1px solid "+(yearFilter===y.toString()?"#dc2626":"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>{y}</button>
        ))}
        <span style={{fontSize:11,color:"#6b7280",fontWeight:700,marginLeft:8}}>Type:</span>
        <button onClick={()=>setTypeFilter("all")} style={{background:typeFilter==="all"?"#dc2626":"#fff",color:typeFilter==="all"?"#fff":"#6b7280",border:"1px solid "+(typeFilter==="all"?"#dc2626":"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>All</button>
        {Object.entries(INCIDENT_TYPES).map(([k,t])=>(
          <button key={k} onClick={()=>setTypeFilter(k)} style={{background:typeFilter===k?t.color:"#fff",color:typeFilter===k?"#fff":"#6b7280",border:"1px solid "+(typeFilter===k?t.color:"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>{t.icon} {t.label}</button>
        ))}
      </div>

      {/* List */}
      {filtered.length===0&&<div style={{...card,textAlign:"center",padding:40,color:"#9ca3af"}}>
        {incidents.length===0?"No incidents logged yet. Tap '+ Log Incident' when needed.":"No incidents match your filters."}
      </div>}
      {filtered.map(inc=>{
        const t=INCIDENT_TYPES[inc.type]||INCIDENT_TYPES.other;
        const sev=INCIDENT_SEVERITY[inc.severity]||INCIDENT_SEVERITY.minor;
        return(
          <div key={inc.id} onClick={()=>setSelected(inc)} style={{...card,cursor:"pointer",borderLeft:"4px solid "+sev.color,position:"relative"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6,alignItems:"center"}}>
                  <span style={{background:sev.bg,color:sev.color,fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,textTransform:"uppercase"}}>{sev.label}</span>
                  <span style={{background:"#f3f4f6",color:"#374151",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{t.icon} {t.label}</span>
                  {inc.closedOut?<span style={{background:"#f0fdf4",color:"#16a34a",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>✓ CLOSED</span>:<span style={{background:"#fef3c7",color:"#92400e",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>⏳ OPEN</span>}
                  {inc.worksafeNotified&&<span style={{background:"#fef2f2",color:"#991b1b",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,border:"1px solid #fca5a5"}}>⚠️ WORKSAFE</span>}
                </div>
                <div style={{fontSize:13,fontWeight:700,color:"#111827"}}>{inc.date}{inc.time?" at "+inc.time:""}{inc.location?" · "+inc.location:""}</div>
                {inc.personInvolved&&<div style={{fontSize:11,color:"#6b7280",marginTop:2}}>👤 {inc.personInvolved}</div>}
                {inc.address&&<div style={{fontSize:11,color:"#6b7280"}}>📍 {inc.address}</div>}
                {inc.description&&<div style={{fontSize:12,color:"#374151",marginTop:6,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{inc.description}</div>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── QUOTES ────────────────────────────────────────────────────
const QUOTE_STATUS={
  "draft":{label:"Draft",color:"#6b7280",bg:"#f3f4f6",icon:"✏️"},
  "sent":{label:"Sent to Client",color:"#2563eb",bg:"#eff6ff",icon:"📤"},
  "accepted":{label:"Accepted",color:"#16a34a",bg:"#f0fdf4",icon:"✓"},
  "declined":{label:"Declined",color:"#dc2626",bg:"#fef2f2",icon:"✕"},
  "expired":{label:"Expired",color:"#d97706",bg:"#fef3c7",icon:"⏰"},
};

// Based on The Roof Hub's actual pricing model
// Break-even: $86/hr · Target: $110-$120/hr
// Labour only m²: $25 min / $30 target
// Full install m²: $120-$220+ depending on complexity
const COMMON_LINE_ITEMS=[
  // Labour — use $30/m² target minimum
  {desc:"Labour — remove existing roofing",unit:"m²",rate:30},
  {desc:"Labour — install new roofing iron",unit:"m²",rate:30},
  {desc:"Labour only (straightforward job)",unit:"m²",rate:30},
  // Full install (labour + materials) — complexity tiers
  {desc:"Full re-roof — standard complexity",unit:"m²",rate:150},
  {desc:"Full re-roof — medium complexity",unit:"m²",rate:180},
  {desc:"Full re-roof — high complexity / 2-storey",unit:"m²",rate:220},
  // Hourly rate — $110/hr target
  {desc:"Labour (hourly rate)",unit:"hr",rate:110},
  {desc:"Callout / assessment",unit:"job",rate:150},
  // Line items — priced per meter
  {desc:"Ridge cap (supply & install)",unit:"m",rate:85},
  {desc:"Flashings (supply & install)",unit:"m",rate:95},
  {desc:"Gutter replacement",unit:"m",rate:110},
  {desc:"Downpipe replacement",unit:"m",rate:75},
  // Plant & materials pass-through
  {desc:"Scaffolding hire (2-storey residential)",unit:"week",rate:850},
  {desc:"Skip bin (6m³)",unit:"each",rate:450},
  {desc:"Dispose of old roofing",unit:"load",rate:350},
  // Leak repairs
  {desc:"Fix leak — minor",unit:"job",rate:450},
  {desc:"Fix leak — major / investigation",unit:"hr",rate:110},
];

function QuotesView({quotes,setQuotes,clients,jobs,setJobs,setTab,onBack}){
  const[showForm,setShowForm]=React.useState(false);
  const[editing,setEditing]=React.useState(null);
  const[selected,setSelected]=React.useState(null);
  const[statusFilter,setStatusFilter]=React.useState("all");
  const[searchTerm,setSearchTerm]=React.useState("");
  
  const today=new Date().toISOString().split("T")[0];
  const validTo=new Date();validTo.setDate(validTo.getDate()+30);
  const bl={
    quoteNumber:"",
    client:"",
    email:"",
    phone:"",
    address:"",
    date:today,
    validUntil:validTo.toISOString().split("T")[0],
    items:[{desc:"",qty:1,unit:"m²",rate:0}],
    notes:"",
    terms:"QUOTE VALIDITY\nThis quote is valid for 30 days from the date issued. After this period, pricing is subject to change due to material costs and availability.\n\nACCEPTANCE\nAcceptance of this quote must be in writing (email confirmation or signed quote). A deposit may be required on jobs over $10,000 to secure materials and scheduling.\n\nPAYMENT TERMS\n- Payment is due within 7 days of invoice date unless otherwise agreed in writing\n- Progress payments may be required on jobs over 5 working days\n- Overdue accounts incur 2% monthly interest and may be referred to debt collection at the client's cost\n- Preferred payment by direct bank transfer. Bank details provided on invoice\n\nSCOPE OF WORK\nThis quote covers only the work described. Any additional work required (e.g. rotten timber, unforeseen structural issues, additional flashings) will be quoted separately and approved by the client before proceeding.\n\nMATERIALS & WORKMANSHIP\n- All new materials come with the manufacturer's warranty (typically 10-30 years depending on product)\n- Our workmanship is guaranteed for 10 years from completion date\n- Warranty does not cover damage from storms, impact, negligence, or modifications by other parties\n\nACCESS & SITE CONDITIONS\n- Client to provide safe access to the roof, power, and water if required\n- The Roof Hub is not responsible for pre-existing damage to gutters, flashings, or fragile roof surfaces not covered in this quote\n- Client to secure pets and remove valuables from working areas\n\nWEATHER & DELAYS\nRoofing work is weather-dependent. We may need to reschedule due to rain, high winds, or extreme heat for the safety of our team and quality of work. We will communicate any delays promptly.\n\nHEALTH & SAFETY\nAll work complies with the Health and Safety at Work Act 2015. A Site Specific Safety Plan (SSSP) will be provided for jobs requiring one. Clients and occupants must stay clear of working areas while work is in progress.\n\nINSURANCE\nThe Roof Hub Limited carries public liability insurance. A copy of our certificate of currency is available on request.\n\nCANCELLATION\nIf work is cancelled after materials have been ordered, the client is liable for material costs plus a 15% administration fee. Cancellations within 48 hours of scheduled start incur a $500 scheduling fee.\n\nDISPUTES\nAny disputes will first be resolved through direct discussion. If unresolved, both parties agree to mediation before pursuing legal action.\n\nGST\nAll prices include GST at 15% unless otherwise stated.",
    status:"draft",
    sentDate:"",
    decisionDate:"",
    estHours:0,
    estMaterialCost:0,
  };
  const[fm,setFm]=React.useState(bl);

  function generateQuoteNumber(){
    const year=new Date().getFullYear();
    const yearQuotes=quotes.filter(q=>q.quoteNumber&&q.quoteNumber.startsWith("Q"+year));
    const maxNum=yearQuotes.reduce((max,q)=>{
      const num=parseInt(q.quoteNumber.split("-")[1]||"0");
      return num>max?num:max;
    },0);
    return"Q"+year+"-"+String(maxNum+1).padStart(3,"0");
  }
  
  function openAdd(){
    setEditing(null);
    setFm({...bl,quoteNumber:generateQuoteNumber()});
    setShowForm(true);
  }
  
  function openEdit(q){
    setEditing(q);
    setFm({...bl,...q,items:q.items&&q.items.length>0?q.items:[{desc:"",qty:1,unit:"m²",rate:0}]});
    setShowForm(true);
    setSelected(null);
  }
  
  function save(){
    if(!fm.client||!fm.address){alert("Please fill in client and address at minimum.");return;}
    if(editing){
      setQuotes(quotes.map(q=>q.id===editing.id?{...editing,...fm}:q));
    }else{
      setQuotes(q=>[...q,{...fm,id:Date.now()}]);
    }
    setShowForm(false);setEditing(null);setFm(bl);
  }
  
  function del(q){
    if(confirm("Delete this quote? This cannot be undone.")){
      setQuotes(quotes.filter(x=>x.id!==q.id));
      setSelected(null);
    }
  }
  
  function markStatus(q,newStatus){
    const date=new Date().toISOString().split("T")[0];
    const updated={...q,status:newStatus};
    if(newStatus==="sent")updated.sentDate=date;
    if(newStatus==="accepted"||newStatus==="declined")updated.decisionDate=date;
    setQuotes(quotes.map(x=>x.id===q.id?updated:x));
    setSelected(updated);
  }
  
  function convertToJob(q){
    if(!confirm("Convert this quote into a new job? A new job will be created with the quote details."))return;
    const newJob={
      id:Date.now(),
      client:q.client,
      address:q.address,
      email:q.email||"",
      phone:q.phone||"",
      type:"Full Re-roof",
      status:"scheduled",
      date:new Date().toISOString().split("T")[0],
      endDate:"",
      startTime:"07:00",
      endTime:"15:30",
      staff:[],
      notes:"Converted from quote "+q.quoteNumber+"\n\nQuoted total: $"+calculateTotal(q).toFixed(2)+"\n\n"+(q.notes||""),
      ssspRequired:true,
      ssspCompleted:false,
      photos:[],
      quoteId:q.id,
      quoteNumber:q.quoteNumber,
    };
    setJobs(j=>[...j,newJob]);
    setQuotes(quotes.map(x=>x.id===q.id?{...x,status:"accepted",decisionDate:new Date().toISOString().split("T")[0],convertedToJobId:newJob.id}:x));
    alert("✅ Job created!\n\nQuote marked as Accepted.\nGo to Work → Jobs to schedule it.");
    if(setTab)setTab("calendar");
  }
  
  function calculateSubtotal(q){
    return(q.items||[]).reduce((sum,item)=>sum+(parseFloat(item.qty)||0)*(parseFloat(item.rate)||0),0);
  }
  function calculateGST(q){return calculateSubtotal(q)*0.15;}
  function calculateTotal(q){return calculateSubtotal(q)*1.15;}
  
  function addLineItem(){
    setFm(f=>({...f,items:[...f.items,{desc:"",qty:1,unit:"m²",rate:0}]}));
  }
  function updateLineItem(idx,changes){
    setFm(f=>({...f,items:f.items.map((item,i)=>i===idx?{...item,...changes}:item)}));
  }
  function removeLineItem(idx){

              if(effectiveRate<BREAK_EVEN){status="LOSING MONEY";color="#dc2626";bg="#fef2f2";border="#fca5a5";msg="⚠️ Below your $86/hr break-even — this job will cost you money. Increase price or walk away.";}
              else if(effectiveRate<TARGET){status="BELOW TARGET";color="#d97706";bg="#fef3c7";border="#fde68a";msg="🟡 Between break-even and $110 target — you'll cover costs but not hit your profit goal.";}
              else if(effectiveRate<EXCELLENT){status="ON TARGET";color="#16a34a";bg="#f0fdf4";border="#bbf7d0";msg="✅ At or above your $110/hr target — profitable job.";}
              else{status="EXCELLENT";color="#059669";bg="#d1fae5";border="#a7f3d0";msg="🔥 Above $120/hr — highly profitable. This is the kind of work to prioritise.";}
              return(
                <div style={{background:bg,border:"1px solid "+border,borderRadius:8,padding:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:6}}>

                    </div>
                    <div style={{background:color,color:"#fff",padding:"6px 12px",borderRadius:14,fontSize:11,fontWeight:800}}>{status}</div>

                  <div style={{fontSize:11,color,lineHeight:1.5,marginTop:6}}>{msg}</div>
                  <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid "+border,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4,fontSize:10}}>
                    <div><div style={{color:"#6b7280",fontWeight:700}}>Labour Revenue</div><div style={{fontWeight:700,color:"#111827"}}>${labourRevenue.toFixed(2)}</div></div>

                  </div>

              );
            })()}
            {(!fm.estHours||fm.estHours===0)&&<div style={{fontSize:11,color:"#92400e",textAlign:"center",padding:8,fontStyle:"italic"}}>Enter estimated hours above to see your effective hourly rate</div>}
          </div>

  // ── LIST VIEW ─────────────────────────────────
  return(

      {filtered.map(q=>{
        const st=QUOTE_STATUS[q.status]||QUOTE_STATUS.draft;

        const today=new Date();

                  <span style={{background:st.bg,color:st.color,fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,textTransform:"uppercase"}}>{st.icon} {st.label}</span>
                  {expired&&<span style={{background:"#fef3c7",color:"#92400e",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>⏰ EXPIRED</span>}

            </div>

}

          <div>✓ <strong>Price outcomes, not time</strong> — quote for the finished result</div>
          <div>✓ <strong>Charge correctly, control efficiency, prioritise profitable work</strong></div>

      </div>
    </div>
  );
}

function FormsView({jobs,clients,incidents=[],setIncidents,quotes=[],setQuotes,setJobs,setTab}){
  const[view,setView]=React.useState("select");
  const[linked,setLinked]=React.useState("");
  const[data,setData]=React.useState({});
  const[clientEmail,setClientEmail]=React.useState("");
  const[clientName,setClientName]=React.useState("");
  const templates={
    "job-report":{name:"Job Report",icon:"📋",fields:["Customer","Address","P.O Number","Date","Investigation Notes","Temporary / Permanent Repairs","Recommended Permanent Repairs"]},
    "roof-report":{name:"Roof Report",icon:"🏠",fields:["Address","Work Order Number","Inspection Date","Report Requested By","Report Conducted By","Number of Storeys","Roof Area (m²)","Roof Material","Colour","Age (est. years)","Pitch Degree","Roof Profile","Roof Coat Condition","Roof Surface Condition","Flashing Condition","Ridge Condition","Fixings Condition","Gutter Type","Gutter Material","Gutter Comments","Recommended Work"]},
  };
  function start(id){
    const job=jobs.find(j=>j.id.toString()===linked);
    const pre={};
    let email="";
    let name="";
    if(job){
      templates[id].fields.forEach(f=>{
        if(f.toLowerCase().includes("customer")||f.toLowerCase().includes("client"))pre[f]=job.client;
        if(f.toLowerCase().includes("address"))pre[f]=job.address;
        if(f.toLowerCase().includes("date"))pre[f]=job.date;
      });
      email=job.email||"";
      name=job.client||"";
      // If client is in database, use their email
      if(clients&&!email){
        const dbClient=clients.find(c=>c.name.toLowerCase()===job.client.toLowerCase());
        if(dbClient)email=dbClient.email||"";
      }
    }
    setClientEmail(email);setClientName(name);
    setData(pre);setView(id);
  }
  function genPDF(){
    const tpl=templates[view];
    const win=window.open("","_blank");
    if(!win)return;
    const rows=tpl.fields.map(f=>'<div style="margin-bottom:14px;"><div style="font-size:11px;font-weight:600;color:#777;text-transform:uppercase;margin-bottom:3px;">'+f+'</div><div style="border:1px solid #ddd;border-radius:4px;padding:8px 12px;min-height:28px;background:#fafafa;font-size:13px;white-space:pre-wrap;">'+(data[f]||"")+'</div></div>').join("");
    win.document.write('<!DOCTYPE html><html><head><title>'+tpl.name+'<\/title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;}.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:3px solid #cc0000;}.biz{text-align:right;font-size:11px;color:#555;line-height:1.7;}.content{padding:20px 30px;}h1{font-size:24px;font-weight:800;border-bottom:2px solid #cc0000;padding-bottom:8px;margin-bottom:20px;}<\/style><\/head><body><div class="hdr"><img src="'+LOGO+'" style="height:100px;object-fit:contain;"/><div class="biz"><strong style="font-size:13px;color:#1a1a1a;">The Roof Hub Limited<\/strong><br/>98 Hillsborough Road, Hillsborough, Auckland<br/>fasa@theroofhub.co.nz · 02041739390<\/div><\/div><div class="content"><h1>'+tpl.name+'<\/h1>'+rows+'<\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>');
    win.document.close();
  }
  function emailToClient(){
    const tpl=templates[view];
    if(!clientEmail){
      alert("No email address for this client. Please add one in the Clients tab or enter one below.");
      return;
    }
    // Build a nicely formatted summary for the email body
    const address=data["Address"]||"";
    const summary=tpl.fields.filter(f=>data[f]&&data[f].trim()).map(f=>"• "+f+": "+data[f]).join("\n");
    const subject=tpl.name+(address?" — "+address:"");
    const greeting=clientName?"Hi "+clientName.split(" ")[0]+",":"Hi there,";
    const body=greeting+"\n\nPlease find below the "+tpl.name.toLowerCase()+" for your property"+(address?" at "+address:"")+".\n\n"+
      "═══════════════════════════════\n"+
      tpl.name.toUpperCase()+"\n"+
      "═══════════════════════════════\n\n"+
      summary+"\n\n"+
      "═══════════════════════════════\n\n"+
      "⚠️ Please note: A PDF version of this "+tpl.name.toLowerCase()+" is available — I'll attach it separately or generate it for you on request.\n\n"+
      "If you have any questions or would like to proceed with the recommended work, please get in touch.\n\n"+
      "Kind regards,\n"+
      "Fasa Sopi\n"+
      "The Roof Hub Limited\n"+
      "📞 02041739390\n"+
      "✉️ fasa@theroofhub.co.nz\n"+
      "📍 98 Hillsborough Road, Hillsborough, Auckland 1042";
    const mailto="mailto:"+encodeURIComponent(clientEmail)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    // Open mail app, then also trigger PDF generation so user can attach it
    window.location.href=mailto;
    // After short delay, also generate the PDF so user can save/attach it
    setTimeout(()=>{
      if(confirm("Email opened in your mail app!\n\nWant to also generate the PDF now so you can attach it before sending?\n\n(Click OK to open PDF, then save it and attach to the email)")){
        genPDF();
      }
    },800);
  }
  if(view==="select")return(
    <div>
      <div style={{marginBottom:16}}>
        <label style={lb}>Link to a Job (auto-fills client details)</label>
        <select value={linked} onChange={e=>setLinked(e.target.value)} style={{...inp,maxWidth:360}}>
          <option value="">— Select a job —</option>
          {jobs.map(j=><option key={j.id} value={j.id}>{j.client} — {j.type}</option>)}
        </select>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {Object.entries(templates).map(([id,t])=>(
          <div key={id} onClick={()=>start(id)} style={{...card,cursor:"pointer",borderTop:"4px solid #e85d04",textAlign:"center",padding:20,marginBottom:0}}>
            <div style={{fontSize:32,marginBottom:10}}>{t.icon}</div>
            <div style={{color:"#111827",fontWeight:700,fontSize:15,marginBottom:4}}>{t.name}</div>
            <div style={{color:"#6b7280",fontSize:12}}>Fill in, generate PDF, or email to client</div>
            <div style={{marginTop:12,background:"#e85d04",color:"#fff",padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:700,display:"inline-block"}}>Start Form →</div>
          </div>
        ))}
        {/* Incident Register tile */}
        <div onClick={()=>setView("incident-register")} style={{...card,cursor:"pointer",borderTop:"4px solid #dc2626",textAlign:"center",padding:20,marginBottom:0,gridColumn:"span 2"}}>
          <div style={{fontSize:32,marginBottom:10}}>⚠️</div>
          <div style={{color:"#111827",fontWeight:700,fontSize:15,marginBottom:4}}>Incident Register</div>
          <div style={{color:"#6b7280",fontSize:12}}>Log workplace incidents, injuries, near-misses (WorkSafe NZ required)</div>
          <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
            <div style={{background:"#fef2f2",color:"#dc2626",padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,border:"1px solid #fca5a5"}}>{incidents.length} logged</div>
            <div style={{background:"#dc2626",color:"#fff",padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:700}}>Open Register →</div>
          </div>
        </div>
        {/* Business Dashboard tile */}
        <div onClick={()=>setView("dashboard")} style={{...card,cursor:"pointer",borderTop:"4px solid #7c3aed",textAlign:"center",padding:20,marginBottom:0,gridColumn:"span 2"}}>
          <div style={{fontSize:32,marginBottom:10}}>📊</div>
          <div style={{color:"#111827",fontWeight:700,fontSize:15,marginBottom:4}}>Business Dashboard</div>
          <div style={{color:"#6b7280",fontSize:12}}>Weekly costs, break-even rate, pricing targets, profitability</div>
          <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
            <div style={{background:"#faf5ff",color:"#7c3aed",padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,border:"1px solid #e9d5ff"}}>Target: ${BUSINESS_CONFIG.targetRate}/hr</div>
            <div style={{background:"#7c3aed",color:"#fff",padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:700}}>Open Dashboard →</div>
          </div>
        </div>
        {/* Quotes tile */}
        <div onClick={()=>setView("quotes")} style={{...card,cursor:"pointer",borderTop:"4px solid #16a34a",textAlign:"center",padding:20,marginBottom:0,gridColumn:"span 2"}}>
          <div style={{fontSize:32,marginBottom:10}}>💲</div>
          <div style={{color:"#111827",fontWeight:700,fontSize:15,marginBottom:4}}>Quotes</div>
          <div style={{color:"#6b7280",fontSize:12}}>Create, send, and track quotes. Convert accepted quotes into jobs.</div>
          <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
            <div style={{background:"#f0fdf4",color:"#16a34a",padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,border:"1px solid #bbf7d0"}}>{quotes.length} quotes</div>
            <div style={{background:"#16a34a",color:"#fff",padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:700}}>Open Quotes →</div>
          </div>
        </div>
        {[{icon:"✅",name:"QA Checklist"}].map(f=>(
          <div key={f.name} style={{...card,textAlign:"center",padding:20,marginBottom:0,opacity:0.5,borderTop:"4px solid #e5e7eb",gridColumn:"span 2"}}>
            <div style={{fontSize:32,marginBottom:10}}>{f.icon}</div>
            <div style={{color:"#374151",fontWeight:700,fontSize:15,marginBottom:4}}>{f.name}</div>
            <div style={{color:"#9ca3af",fontSize:12}}>Coming soon</div>
          </div>
        ))}
      </div>
    </div>
  );
  
  // ── INCIDENT REGISTER ──────────────────────────────
  if(view==="incident-register"){
    return <IncidentRegister incidents={incidents} setIncidents={setIncidents} jobs={jobs} onBack={()=>setView("select")}/>;
  }
  // ── DASHBOARD ──────────────────────────────
  if(view==="dashboard"){
    return <BusinessDashboard quotes={quotes} jobs={jobs} onBack={()=>setView("select")}/>;
  }
  // ── QUOTES ──────────────────────────────
  if(view==="quotes"){
    return <QuotesView quotes={quotes} setQuotes={setQuotes} clients={clients} jobs={jobs} setJobs={setJobs} setTab={setTab} onBack={()=>setView("select")}/>;
  }
  const tpl=templates[view];
  return(
    <div>
      <button onClick={()=>setView("select")} style={{background:"none",border:"none",color:"#e85d04",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Forms</button>
      <div style={card}>
        <SHd t={tpl.icon+" "+tpl.name}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {tpl.fields.map(f=>(
            <div key={f} style={{gridColumn:(f.toLowerCase()==="address"||f.toLowerCase().includes("notes")||f.toLowerCase().includes("repairs")||f.toLowerCase().includes("work")||f.toLowerCase().includes("comments"))?"span 2":"span 1"}}>
              <label style={lb}>{f==="Address"?"🔍 "+f:f}</label>
              {f==="Address"
                ?<AddressInput value={data[f]||""} onChange={v=>setData(d=>({...d,[f]:v}))} placeholder="Start typing NZ address..."/>

// ── STAFF CERTIFICATES MODAL ────────────────────────────────
function StaffCertsModal({staff,certs,allCerts,setCerts,onClose}){
  const[showForm,setShowForm]=React.useState(false);
  const[editing,setEditing]=React.useState(null);
  const bl={staffId:staff.id,type:"heights",issuingBody:"",certNumber:"",issueDate:"",expiryDate:"",notes:"",photoData:""};
  const[fm,setFm]=React.useState(bl);
  const[uploading,setUploading]=React.useState(false);
  
  function openAdd(typeId){
    setEditing(null);
    setFm({...bl,type:typeId||"heights"});
    setShowForm(true);
  }
  
  function openEdit(cert){
    setEditing(cert);
    setFm({...bl,...cert});
    setShowForm(true);
  }
  
  function save(){
    if(!fm.type){alert("Please select a certificate type.");return;}
    if(!fm.expiryDate){alert("Please set an expiry date.");return;}
    if(editing){
      setCerts(allCerts.map(c=>c.id===editing.id?{...editing,...fm}:c));
    }else{
      setCerts(cs=>[...cs,{...fm,id:Date.now()}]);
    }
    setShowForm(false);setEditing(null);setFm(bl);
  }
  
  function del(cert){
    if(confirm("Delete this certificate record?")){
      setCerts(allCerts.filter(c=>c.id!==cert.id));
    }
  }
  
  async function handleFile(e){
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>3*1024*1024){alert("File too large. Please use an image or PDF under 3MB.");return;}
    setUploading(true);
    const reader=new FileReader();
    reader.onload=(ev)=>{
      setFm(f=>({...f,photoData:ev.target.result,photoName:file.name,photoType:file.type}));
      setUploading(false);
    };
    reader.onerror=()=>{alert("Failed to read file.");setUploading(false);};
    reader.readAsDataURL(file);
  }
  
  function viewCertFile(cert){
    if(!cert.photoData)return;
    const win=window.open("","_blank");
    if(cert.photoType&&cert.photoType.startsWith("image/")){
      win.document.write('<html><head><title>'+(cert.photoName||"Certificate")+'<\/title><\/head><body style="margin:0;background:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+cert.photoData+'" style="max-width:100%;max-height:100vh;"/><\/body><\/html>');
    }else{
      win.document.write('<html><head><title>'+(cert.photoName||"Certificate")+'<\/title><\/head><body style="margin:0;"><embed src="'+cert.photoData+'" type="application/pdf" width="100%" height="100%" style="height:100vh;"/><\/body><\/html>');
    }
    win.document.close();
  }
  
  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}}>
      <div style={{background:"#fff",borderRadius:14,padding:18,maxWidth:560,width:"100%",boxShadow:"0 10px 40px rgba(0,0,0,0.2)",marginTop:20,marginBottom:20}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,paddingBottom:12,borderBottom:"2px solid "+staff.color}}>
          <Av sid={staff.id} size={40}/>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#1a1a2e"}}>🎓 {staff.name}</div>
            <div style={{color:staff.color,fontSize:11,fontWeight:700,textTransform:"uppercase"}}>Certifications & Training</div>
          </div>
          <button onClick={onClose} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:14,fontWeight:700}}>✕</button>
        </div>
        
        {!showForm&&<>
          {/* Each cert type */}
          {CERT_TYPES.map(ct=>{
            const cert=certs.find(c=>c.type===ct.id);
            const st=cert?certStatus(cert):null;
            return(
              <div key={ct.id} style={{background:cert?st.bg:"#f9fafb",border:"1px solid "+(cert?st.color:"#e5e7eb"),borderRadius:10,padding:12,marginBottom:10,borderLeft:"4px solid "+ct.color}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:160}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                      <span style={{fontSize:16}}>{ct.icon}</span>
                      <span style={{fontWeight:700,color:"#111827",fontSize:13}}>{ct.name}</span>
                    </div>
                    {cert?<>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4,marginBottom:4}}>
                        <span style={{background:st.color,color:"#fff",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{st.label}</span>
                        {cert.photoData&&<span style={{background:"#eff6ff",color:"#2563eb",border:"1px solid #bfdbfe",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10}}>📎 File attached</span>}
                      </div>
                      <div style={{fontSize:11,color:"#6b7280",lineHeight:1.5}}>
                        {cert.issuingBody&&<div><strong>Issued by:</strong> {cert.issuingBody}</div>}
                        {cert.certNumber&&<div><strong>Cert #:</strong> {cert.certNumber}</div>}
                        {cert.issueDate&&<div><strong>Issued:</strong> {cert.issueDate}</div>}
                        <div><strong>Expires:</strong> {cert.expiryDate}</div>
                      </div>
                      {cert.notes&&<div style={{marginTop:6,padding:6,background:"rgba(255,255,255,0.6)",borderRadius:4,fontSize:11,color:"#374151",fontStyle:"italic"}}>{cert.notes}</div>}
                    </>:<div style={{fontSize:11,color:"#9ca3af",fontStyle:"italic",marginTop:4}}>No certificate on file</div>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    {cert&&cert.photoData&&<button onClick={()=>viewCertFile(cert)} style={{background:"#eff6ff",color:"#2563eb",border:"1px solid #bfdbfe",padding:"4px 10px",borderRadius:6,fontSize:10,fontWeight:700,cursor:"pointer"}}>View File</button>}
                    {cert?<>
                      <button onClick={()=>openEdit(cert)} style={{background:"#fff7ed",color:"#ea580c",border:"1px solid #fed7aa",padding:"4px 10px",borderRadius:6,fontSize:10,fontWeight:700,cursor:"pointer"}}>Edit</button>
                      <button onClick={()=>del(cert)} style={{background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",padding:"4px 10px",borderRadius:6,fontSize:10,fontWeight:700,cursor:"pointer"}}>Delete</button>
                    </>:<button onClick={()=>openAdd(ct.id)} style={{background:ct.color,color:"#fff",border:"none",padding:"4px 10px",borderRadius:6,fontSize:10,fontWeight:700,cursor:"pointer"}}>+ Add</button>}
                  </div>
                </div>
              </div>
            );
          })}
          <button onClick={onClose} style={{width:"100%",background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,marginTop:6}}>Done</button>
        </>}
        
        {showForm&&<div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:800,color:"#1a1a2e",marginBottom:12}}>{editing?"✏️ Edit Certificate":"+ Add Certificate"}</div>
          
          <label style={lb}>Certificate Type *</label>
          <select value={fm.type} onChange={e=>setFm(f=>({...f,type:e.target.value}))} style={{...inp,marginBottom:10}} disabled={!!editing}>
            {CERT_TYPES.map(ct=><option key={ct.id} value={ct.id}>{ct.icon} {ct.name}</option>)}
          </select>
          
          <label style={lb}>Issuing Body / Trainer</label>
          <input value={fm.issuingBody} onChange={e=>setFm(f=>({...f,issuingBody:e.target.value}))} style={{...inp,marginBottom:10}} placeholder="e.g. Site Safe NZ, St John, Impac"/>
          
          <label style={lb}>Certificate Number</label>
          <input value={fm.certNumber} onChange={e=>setFm(f=>({...f,certNumber:e.target.value}))} style={{...inp,marginBottom:10}} placeholder="Optional"/>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>

            <div>
              <label style={lb}>Expiry Date *</label>
              <input type="date" value={fm.expiryDate} onChange={e=>setFm(f=>({...f,expiryDate:e.target.value}))} style={inp}/>

}

// ── PAY VIEW ──────────────────────────────────────────────
function PayView({ts=[],jobs=[],user}){
  const[payConfig,setPayConfig]=React.useState(PAY_CONFIG_DEFAULTS);
  const[loading,setLoading]=React.useState(true);
  const[editingStaff,setEditingStaff]=React.useState(null);
  const[weekOffset,setWeekOffset]=React.useState(-1); // default to LAST week (completed)
  const[adjustments,setAdjustments]=React.useState({}); // {staffId: {hoursAdjust, notes}}
  const[adminEmails,setAdminEmails]=React.useState([]);
  const[showAdminModal,setShowAdminModal]=React.useState(false);
  const[businessInfo,setBusinessInfo]=React.useState({
    name:"The Roof Hub Limited",
    address:"98 Hillsborough Road, Auckland 1042",
    gstNumber:"",
    irdNumber:"",
    email:"fasa@theroofhub.co.nz",
    phone:"020 417 3939 0",
  });
  
  // Determine if the current user is an admin
  const currentEmail=(user?.email||"").toLowerCase();
  // Fasa is ALWAYS admin (owner — can't be locked out)
  const isOwner=currentEmail==="fasa@theroofhub.co.nz";
  const isAdmin=isOwner||adminEmails.map(e=>e.toLowerCase()).includes(currentEmail);
  
  // Find which staff member this user is (for employee view)
  const myStaff=STAFF.find(s=>s.email&&s.email.toLowerCase()===currentEmail);
  
  // Load pay config from cloud on mount
  React.useEffect(()=>{
    async function load(){
      try{
        const cfgStr=await cloudLoadSetting("pay_config");
        if(cfgStr){
          const parsed=JSON.parse(cfgStr);
          const merged={...PAY_CONFIG_DEFAULTS};
          Object.keys(parsed).forEach(k=>{merged[k]={...merged[k],...parsed[k]};});
          setPayConfig(merged);
        }
        const biz=await cloudLoadSetting("business_info");
        if(biz){setBusinessInfo(JSON.parse(biz));}
        const admins=await cloudLoadSetting("pay_admin_emails");
        if(admins){setAdminEmails(JSON.parse(admins));}
      }catch(e){console.error("Pay config load:",e);}
      setLoading(false);
    }
    load();
  },[]);
  
  async function savePayConfig(newConfig){
    setPayConfig(newConfig);
    try{
      await cloudSaveSetting("pay_config",JSON.stringify(newConfig));
    }catch(e){console.error("Pay config save:",e);}
  }
  
  async function saveBusinessInfo(newInfo){
    setBusinessInfo(newInfo);
    try{
      await cloudSaveSetting("business_info",JSON.stringify(newInfo));
    }catch(e){console.error("Business info save:",e);}
  }
  
  async function saveAdminEmails(newEmails){
    setAdminEmails(newEmails);
    try{
      await cloudSaveSetting("pay_admin_emails",JSON.stringify(newEmails));
    }catch(e){console.error("Admin emails save:",e);}
  }
  
  // Calculate pay period range based on staff frequency
  function getPeriodRange(frequency,offset){
    const now=new Date();
    const day=now.getDay();
    const diffToMon=now.getDate()-day+(day===0?-6:1);
    const thisMon=new Date(now);
    thisMon.setDate(diffToMon);
    thisMon.setHours(0,0,0,0);
    if(frequency==="weekly"){
      const start=new Date(thisMon);
      start.setDate(thisMon.getDate()+offset*7);
      const end=new Date(start);
      end.setDate(start.getDate()+6);
      end.setHours(23,59,59,999);
      return{start,end};
    }else if(frequency==="fortnightly"){
      const start=new Date(thisMon);
      start.setDate(thisMon.getDate()+offset*14);
      const end=new Date(start);
      end.setDate(start.getDate()+13);
      end.setHours(23,59,59,999);
      return{start,end};
    }else{
      const start=new Date(now.getFullYear(),now.getMonth()+offset,1);
      const end=new Date(now.getFullYear(),now.getMonth()+offset+1,0,23,59,59);
      return{start,end};
    }
  }
  
  function calcStaffHours(staffId,start,end){
    const entries=ts.filter(t=>t.staffId===staffId&&t.date);
    let totalHours=0;
    const jobIds=new Set();
    entries.forEach(t=>{
      const tDate=new Date(t.date);
      if(tDate>=start&&tDate<=end){
        if(t.clockIn&&t.clockOut){
          totalHours+=calcPaidHours(t.clockIn,t.clockOut);
        }
        if(t.jobId)jobIds.add(t.jobId);
      }
    });
    return{hours:totalHours,jobIds:Array.from(jobIds)};
  }
  
  function formatDate(d){
    if(!d)return"";
    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
  }
  
  function fmtMoney(n){
    return"$"+(n||0).toLocaleString("en-NZ",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  
  // Calculate a single staff's pay row (shared between admin and employee views)
  function calcPayRow(s,offset){
    const cfg=payConfig[s.id]||{};
    if(cfg.payType==="owner")return null;
    const range=getPeriodRange(cfg.frequency||"weekly",offset);
    const{hours,jobIds}=calcStaffHours(s.id,range.start,range.end);
    const adj=adjustments[s.id]||{};
    const adjHours=Number(adj.hoursAdjust)||0;
    const finalHours=hours+adjHours;
    const subtotal=finalHours*(cfg.rate||0);
    const gst=cfg.payType==="contractor-gst"?subtotal*0.15:0;
    const totalBeforeWT=subtotal+gst;
    const wt=cfg.payType==="contractor-wt"?subtotal*((cfg.withholdingPct||20)/100):0;
    const netPay=totalBeforeWT-wt;
    return{staff:s,config:cfg,range,hours,jobIds,adjHours,finalHours,subtotal,gst,wt,netPay,totalBeforeWT};
  }
  
  // Build pay run rows for admin view
  const defaultRange=getPeriodRange("weekly",weekOffset);
  const payRows=STAFF.map(s=>calcPayRow(s,weekOffset)).filter(Boolean);
  const totals=payRows.reduce((a,r)=>({
    hours:a.hours+r.finalHours,
    subtotal:a.subtotal+r.subtotal,
    gst:a.gst+r.gst,
    wt:a.wt+r.wt,
    net:a.net+r.netPay,

      "</div>"+
      "<div class='box'><h2 style='margin:0 0 8px;'>Work Performed</h2>"+
        "<div class='row'><span class='row-lbl'>Hours worked:</span><span class='row-val'>"+finalHours.toFixed(2)+" hrs</span></div>"+
        (adjHours!==0?"<div class='row'><span class='row-lbl'>(Includes adjustment: "+(adjHours>0?"+":"")+adjHours+" hrs)</span><span class='row-val'></span></div>":"")+
        "<div class='row'><span class='row-lbl'>Rate:</span><span class='row-val'>"+fmtMoney(cfg.rate)+" /hr</span></div>"+
        "<div class='row'><span class='row-lbl'>Labour subtotal:</span><span class='row-val'>"+fmtMoney(subtotal)+"</span></div>"+
        (isGST?"<div class='row'><span class='row-lbl'>GST (15%):</span><span class='row-val'>"+fmtMoney(gst)+"</span></div>":"")+
        (isWT?"<div class='row' style='color:#dc2626;'><span class='row-lbl'>Less Withholding Tax ("+(cfg.withholdingPct||20)+"%):</span><span class='row-val'>-"+fmtMoney(wt)+"</span></div>":"")+
      "</div>"+
      "<div class='total'><span>"+(isWages?"Gross Pay (see Xero for payslip)":"Net Payable")+":</span><span>"+fmtMoney(netPay)+"</span></div>"+
      (jobList.length>0?"<h2>Jobs Worked</h2><ul class='jobs'>"+jobList.map(j=>"<li>"+j+"</li>").join("")+"</ul>":"")+
      (isWT?"<div class='note'>📎 <strong>For your IR3 tax return:</strong> This statement confirms withholding tax of "+fmtMoney(wt)+" has been withheld and paid to IRD on your behalf under IR330C. Keep this record for your annual tax return.</div>":"")+

      "</body></html>";
    
    const win=window.open("","_blank");
    win.document.write(html);
    win.document.close();
    setTimeout(()=>win.print(),400);
  }

            <div style={{fontSize:26}}>💰</div>
          </div>
        </div>
        
        {myRow.finalHours===0&&<div style={{background:"#fff7ed",border:"1px solid #fdba74",borderRadius:10,padding:12,fontSize:11,color:"#9a3412",lineHeight:1.5,marginBottom:14}}>
          ⚠️ <strong>No timesheets logged for this period.</strong> Make sure you've clocked in/out on the Time tab. Ask Fasa if something looks off.
        </div>}
        
        {/* Actions */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
          <button onClick={()=>generateRemittance(myRow)} style={{flex:1,minWidth:140,background:"#e85d04",color:"#fff",border:"none",padding:"11px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>📄 Download My {isGST?"Invoice":"Remittance"}</button>
        </div>
        
        {/* Info box */}
        <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,padding:12,fontSize:11,color:"#1e40af",lineHeight:1.6}}>
          💡 <strong>Privacy:</strong> Only you and Fasa can see this page. Hours come from your timesheets. If something looks wrong, talk to Fasa directly.
          {isWT&&<><br/><br/>📎 <strong>For your IR3:</strong> 20% Withholding Tax is deducted and paid to IRD on your behalf. Your IR3 tax return should declare the gross amount, and you'll get credit for the WT paid.</>}
          {isGST&&<><br/><br/>📎 <strong>GST:</strong> You invoice Roof Hub with GST included. You're responsible for filing your own GST returns.</>}
          {isWages&&<><br/><br/>📎 <strong>Wages:</strong> Your official payslip (PAYE, KiwiSaver, ACC) is generated in Xero Payroll. This view is just for reference.</>}
        </div>
      </div>
    );
  }
  
  // ═══════════════════════════════════════════════════════════
  // ADMIN VIEW (Fasa + Managers) — full pay run access
  // ═══════════════════════════════════════════════════════════
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>

          <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:800,margin:0,color:"#1a1a2e",letterSpacing:1}}>💰 PAY RUN</h1>

        </div>
        <span style={{fontSize:10,fontWeight:700,background:"#fef3c7",color:"#92400e",padding:"4px 9px",borderRadius:10,border:"1px solid #fde68a",whiteSpace:"nowrap"}}>👑 {isOwner?"OWNER":"MANAGER"}</span>
      </div>
      
      {/* Period picker */}
      <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,padding:12,marginBottom:14,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <button onClick={()=>setWeekOffset(w=>w-1)} style={{background:"#f4f5f7",border:"1px solid #e5e7eb",width:34,height:34,borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:700}}>‹</button>
        <div style={{flex:1,minWidth:200}}>
          <div style={{fontSize:11,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Pay period (weekly)</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#1a1a2e"}}>
            {formatDate(defaultRange.start)} → {formatDate(defaultRange.end)}
          </div>
          <div style={{fontSize:10,color:"#6b7280"}}>{weekOffset===-1?"Last week":weekOffset===0?"This week":weekOffset+" weeks"}</div>
        </div>
        <button onClick={()=>setWeekOffset(w=>w+1)} disabled={weekOffset>=0} style={{background:weekOffset>=0?"#f9fafb":"#f4f5f7",border:"1px solid #e5e7eb",width:34,height:34,borderRadius:8,cursor:weekOffset>=0?"not-allowed":"pointer",fontSize:14,fontWeight:700,opacity:weekOffset>=0?0.4:1}}>›</button>
        <button onClick={()=>setWeekOffset(-1)} style={{background:"#e85d04",color:"#fff",border:"none",padding:"7px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700}}>Last week</button>
      </div>
      
      {/* Totals bar */}
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#2d2d4a)",color:"#fff",borderRadius:12,padding:"14px 16px",marginBottom:14,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        <div><div style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>Hours</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800}}>{totals.hours.toFixed(1)}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>Labour</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800}}>{fmtMoney(totals.subtotal)}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>GST in</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#fbbf24"}}>{fmtMoney(totals.gst)}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>Net Out</div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#34d399"}}>{fmtMoney(totals.net)}</div></div>
      </div>
      
      {/* Staff pay rows */}
      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
        {payRows.map(r=>{
          const{staff:s,config:cfg,range,finalHours,subtotal,gst,wt,netPay,jobIds}=r;
          const typeColor=cfg.payType==="contractor-gst"?"#8b5cf6":cfg.payType==="wages-xero"?"#2563eb":"#059669";
          return(
            <div key={s.id} style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:12}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
                <div style={{width:38,height:38,borderRadius:"50%",background:s.color,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>{s.initials}</div>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontWeight:700,fontSize:14}}>{s.name}</div>
                  <div style={{fontSize:11,color:"#6b7280"}}>{s.role}</div>
                </div>
                <div style={{fontSize:10,fontWeight:700,background:typeColor+"15",color:typeColor,padding:"3px 8px",borderRadius:10,border:"1px solid "+typeColor+"40"}}>{PAY_TYPE_LABELS[cfg.payType]}</div>
                <button onClick={()=>setEditingStaff(s.id)} style={{background:"#f4f5f7",border:"1px solid #e5e7eb",padding:"4px 10px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:600}}>⚙️ Setup</button>
              </div>
              
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:8,marginBottom:10,padding:10,background:"#fafafa",borderRadius:8}}>
                <div><div style={{fontSize:9,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>Hours</div><div style={{fontSize:15,fontWeight:800}}>{finalHours.toFixed(1)}</div></div>
                <div><div style={{fontSize:9,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>Rate</div><div style={{fontSize:15,fontWeight:800}}>{fmtMoney(cfg.rate)}</div></div>
                <div><div style={{fontSize:9,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>Labour</div><div style={{fontSize:15,fontWeight:800}}>{fmtMoney(subtotal)}</div></div>
                {cfg.payType==="contractor-gst"&&<div><div style={{fontSize:9,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>GST</div><div style={{fontSize:15,fontWeight:800,color:"#f59e0b"}}>+{fmtMoney(gst)}</div></div>}
                {cfg.payType==="contractor-wt"&&<div><div style={{fontSize:9,color:"#9ca3af",textTransform:"uppercase",fontWeight:600}}>Less WT</div><div style={{fontSize:15,fontWeight:800,color:"#dc2626"}}>-{fmtMoney(wt)}</div></div>}
                <div style={{background:"#dcfce7",margin:-10,padding:10,borderRadius:8,borderLeft:"3px solid #16a34a"}}><div style={{fontSize:9,color:"#14532d",textTransform:"uppercase",fontWeight:700}}>{cfg.payType==="wages-xero"?"Gross":"Net"}</div><div style={{fontSize:16,fontWeight:800,color:"#14532d"}}>{fmtMoney(netPay)}</div></div>
              </div>
              
              <div style={{fontSize:10,color:"#6b7280",marginBottom:8}}>
                Period: {formatDate(range.start)} → {formatDate(range.end)} · {jobIds.length} {jobIds.length===1?"job":"jobs"}
                {finalHours===0&&<span style={{color:"#dc2626",fontWeight:700,marginLeft:6}}>⚠️ No timesheet entries</span>}
              </div>
              
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
                <label style={{fontSize:10,color:"#6b7280",fontWeight:600}}>Adjust hrs:</label>
                <input type="number" step="0.5" value={adjustments[s.id]?.hoursAdjust||""} onChange={e=>setAdjustments(a=>({...a,[s.id]:{...a[s.id],hoursAdjust:e.target.value}}))} placeholder="0" style={{width:70,padding:"4px 8px",border:"1px solid #e5e7eb",borderRadius:6,fontSize:12}}/>
                <span style={{fontSize:10,color:"#9ca3af"}}>(+/- hrs for this period)</span>
              </div>
              
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button onClick={()=>generateRemittance(r)} style={{flex:1,minWidth:130,background:"#e85d04",color:"#fff",border:"none",padding:"8px 10px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:700}}>📄 {cfg.payType==="contractor-gst"?"Tax Invoice":cfg.payType==="wages-xero"?"Summary":"Remittance"}</button>
                {s.email&&<button onClick={()=>emailRemittance(r)} style={{flex:1,minWidth:100,background:"#fff",color:"#374151",border:"1px solid #e5e7eb",padding:"8px 10px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:600}}>📧 Email</button>}
              </div>
            </div>
          );
        })}
      </div>
      
      {/* Export + settings */}
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <button onClick={exportCSV} style={{flex:1,minWidth:140,background:"#fff",border:"1.5px solid #e85d04",color:"#e85d04",padding:"10px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700}}>📊 Export CSV (for accountant)</button>
        <button onClick={()=>setEditingStaff("business")} style={{flex:1,minWidth:140,background:"#fff",border:"1px solid #e5e7eb",color:"#374151",padding:"10px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>🏢 Business Info</button>
        {isOwner&&<button onClick={()=>setShowAdminModal(true)} style={{flex:1,minWidth:140,background:"#fff",border:"1px solid #e5e7eb",color:"#374151",padding:"10px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>👑 Manage Admins ({adminEmails.length+1})</button>}
      </div>
      
      {/* Info box */}
      <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,padding:12,fontSize:11,color:"#1e40af",lineHeight:1.6}}>
        💡 <strong>How this works:</strong> Hours auto-pulled from timesheets for the selected period. WT (20%) is withheld for contractors on IR330C — you pay it to IRD monthly (via accountant). GST contractors (Taylor) invoice you WITH GST. Corey's wages handled fully in Xero Payroll. Each employee can see ONLY their own pay via this tab.
      </div>
      
      {editingStaff&&editingStaff!=="business"&&(()=>{
        const s=STAFF.find(x=>x.id===editingStaff);
        const cfg=payConfig[editingStaff]||{};
        return<PaySetupModal staff={s} config={cfg} onSave={newCfg=>{savePayConfig({...payConfig,[editingStaff]:newCfg});setEditingStaff(null);}} onClose={()=>setEditingStaff(null)}/>;
      })()}
      
      {editingStaff==="business"&&<BusinessInfoModal info={businessInfo} onSave={b=>{saveBusinessInfo(b);setEditingStaff(null);}} onClose={()=>setEditingStaff(null)}/>}
      
      {showAdminModal&&<AdminEmailsModal emails={adminEmails} onSave={saveAdminEmails} onClose={()=>setShowAdminModal(false)}/>}
    </div>
  );
}

// Admin Emails Modal — owner manages who has manager access
function AdminEmailsModal({emails,onSave,onClose}){
  const[list,setList]=React.useState([...emails]);
  const[newEmail,setNewEmail]=React.useState("");
  const inp={width:"100%",padding:"9px 11px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:13,boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif"};
  
  function addEmail(){
    const e=newEmail.trim().toLowerCase();
    if(!e||!e.includes("@")){alert("Please enter a valid email");return;}
    if(e==="fasa@theroofhub.co.nz"){alert("Fasa is already the owner — no need to add.");return;}
    if(list.includes(e)){alert("Already in the list");return;}
    setList([...list,e]);
    setNewEmail("");
  }
  function removeEmail(e){
    setList(list.filter(x=>x!==e));
  }
  function handleSave(){
    onSave(list);
    onClose();
  }
  // Show staff whose email matches existing entries (for visual confirmation)
  const staffForEmail=e=>STAFF.find(s=>s.email&&s.email.toLowerCase()===e.toLowerCase());
  
  return(
    <div onClick={onClose} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:2000,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:14,padding:20,maxWidth:460,width:"100%",boxShadow:"0 10px 40px rgba(0,0,0,0.2)",marginTop:20,marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <div style={{fontSize:24}}>👑</div>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800}}>Manage Pay Admins</div>
          </div>
          <button onClick={onClose} style={{background:"#f4f5f7",border:"1px solid #e5e7eb",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:12,fontWeight:700}}>✕</button>
        </div>
        <div style={{fontSize:11,color:"#6b7280",marginBottom:14,lineHeight:1.5}}>Users with these emails can see the FULL pay run for everyone. Non-admins only see their own pay. <strong>Fasa is always admin</strong> and can't be removed.</div>
        
        <div style={{background:"#fef3c7",border:"1px solid #fde68a",borderRadius:8,padding:"8px 10px",marginBottom:12,fontSize:12,color:"#92400e",display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:16}}>👑</span>
          <span><strong>fasa@theroofhub.co.nz</strong> — Owner (always admin)</span>
        </div>
        
        {list.length>0?<div style={{marginBottom:12}}>
          {list.map(e=>{
            const s=staffForEmail(e);
            return(
              <div key={e} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,marginBottom:6}}>
                {s?<span style={{width:24,height:24,borderRadius:"50%",background:s.color,color:"#fff",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{s.initials}</span>:<span style={{fontSize:16}}>👤</span>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,color:"#111827",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e}</div>
                  {s&&<div style={{fontSize:10,color:"#6b7280"}}>{s.name} · {s.role}</div>}
                </div>
                <button onClick={()=>removeEmail(e)} style={{background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:700}}>Remove</button>
              </div>
            );
          })}
        </div>:<div style={{fontSize:11,color:"#9ca3af",textAlign:"center",padding:10,fontStyle:"italic"}}>No additional admins yet — only Fasa has full access.</div>}
        
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          <input type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEmail()} placeholder="Add email (e.g. taylorsmith13@hotmail.com)" style={{...inp,flex:1}}/>
          <button onClick={addEmail} style={{background:"#e85d04",color:"#fff",border:"none",padding:"9px 14px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}>+ Add</button>
        </div>
        
        {/* Quick-add buttons for existing staff */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,color:"#6b7280",fontWeight:600,textTransform:"uppercase",marginBottom:6}}>Quick add from staff:</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {STAFF.filter(s=>s.email&&s.email.toLowerCase()!=="fasa@theroofhub.co.nz"&&!list.map(e=>e.toLowerCase()).includes(s.email.toLowerCase())).map(s=>(
              <button key={s.id} onClick={()=>{setList([...list,s.email.toLowerCase()]);}} style={{background:"#fff",border:"1px solid "+s.color,color:s.color,padding:"5px 10px",borderRadius:14,cursor:"pointer",fontSize:11,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
                <span style={{width:16,height:16,borderRadius:"50%",background:s.color,color:"#fff",fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{s.initials}</span>
                {s.name.split(" ")[0]}
              </button>
            ))}
          </div>
        </div>
        
        <div style={{display:"flex",gap:8}}>
          <button onClick={onClose} style={{flex:1,background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>Cancel</button>
          <button onClick={handleSave} style={{flex:2,background:"#e85d04",color:"#fff",border:"none",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>💾 Save Admin List</button>
        </div>
      </div>
    </div>
  );
}

// Pay Setup Modal (per staff member)
function PaySetupModal({staff,config,onSave,onClose}){

    payType:config.payType||"contractor-wt",
    rate:config.rate||0,

          </div>
          <button onClick={onClose} style={{background:"#f4f5f7",border:"1px solid #e5e7eb",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:12,fontWeight:700}}>✕</button>

        {fm.payType!=="owner"&&<>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div><label style={lb}>Hourly Rate ($)</label><input type="number" step="0.50" value={fm.rate} onChange={e=>setFm(f=>({...f,rate:Number(e.target.value)}))} style={inp}/></div>

              <option value="monthly">Monthly</option>

              <option value="15">15% (reduced)</option>
              <option value="20">20% (standard IR330C)</option>
              <option value="25">25%</option>
              <option value="30">30%</option>
              <option value="33">33%</option>

            <label style={lb}>{fm.payType==="contractor-gst"?"Business Name (required)":"Business Name (optional)"}</label>

function TeamView({ts=[],jobs=[],certs=[],setCerts}){
  const[sel,setSel]=React.useState(null);
  const[weekOffset,setWeekOffset]=React.useState(0); // 0 = this week, -1 = last week
  const[certView,setCertView]=React.useState(null); // staff member to view certs for
  
  // Calculate week range (Mon-Sun) based on offset
  function getWeekRange(offset){
    const now=new Date();
    const day=now.getDay(); // 0=Sun, 1=Mon...
    const diff=now.getDate()-day+(day===0?-6:1); // adjust to Monday
    const monday=new Date(now.setDate(diff+offset*7));
    monday.setHours(0,0,0,0);
    const sunday=new Date(monday);
    sunday.setDate(monday.getDate()+6);
    sunday.setHours(23,59,59,999);
    return{start:monday,end:sunday};
  }
  
  // Calculate paid hours (automatically deducts 30-min break if shift >4 hours)
  function calcHours(clockIn,clockOut){
    return calcPaidHours(clockIn,clockOut);
  }
  
  function getStaffTimesheets(staffId,offset){
    const{start,end}=getWeekRange(offset);
    return ts.filter(t=>{
      if(t.staffId!==staffId)return false;
      const d=new Date(t.date);
      return d>=start&&d<=end;
    }).sort((a,b)=>a.date.localeCompare(b.date));
  }
  
  function formatHours(h){
    const hours=Math.floor(h);
    const mins=Math.round((h-hours)*60);
    return hours+"h "+(mins<10?"0":"")+mins+"m";
  }
  
  // Calculate overall training stats
  const allStaffCerts=STAFF.map(s=>getStaffCertSummary(s.id,certs));
  const totalExpired=allStaffCerts.reduce((sum,c)=>sum+c.expired,0);
  const totalExpiring=allStaffCerts.reduce((sum,c)=>sum+c.expiring,0);
  const totalRequired=STAFF.length*CERT_TYPES.length;
  const totalCurrent=allStaffCerts.reduce((sum,c)=>sum+c.count,0)-totalExpired;
  
  function generateTrainingMatrixPDF(){
    const win=window.open("","_blank");

        const cert=certs.find(c=>c.staffId===s.id&&c.type===ct.id);

        const st=certStatus(cert);
        return'<td style="text-align:center;padding:8px;background:'+st.bg+';color:'+st.color+';font-weight:700;font-size:11px;">'+cert.expiryDate+'<br/><span style="font-size:9px;font-weight:500;">'+st.label+'<\/span><\/td>';
      }).join("");
      return'<tr><td style="padding:10px;font-weight:700;border-left:4px solid '+s.color+';background:#fafafa;">'+s.name+'<br/><span style="font-size:10px;color:#6b7280;font-weight:500;">'+s.role+'<\/span><\/td>'+cells+'<\/tr>';

    const headerCells=CERT_TYPES.map(ct=>'<th style="padding:10px;background:'+ct.color+';color:#fff;font-size:11px;text-transform:uppercase;">'+ct.icon+' '+ct.name+'<\/th>').join("");
    const html='<!DOCTYPE html><html><head><title>Training Matrix — The Roof Hub<\/title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;color:#1a1a1a;}.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:3px solid #cc0000;}.biz{text-align:right;font-size:11px;color:#555;line-height:1.7;}.content{padding:20px 30px;}h1{font-size:24px;font-weight:800;border-bottom:2px solid #cc0000;padding-bottom:8px;margin-bottom:8px;}.sub{color:#6b7280;margin-bottom:18px;font-size:12px;}table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12px;}th{padding:10px;text-align:left;font-size:11px;}td{padding:8px;border:1px solid #e5e7eb;}.legend{margin-top:16px;padding:12px;background:#f9fafb;border-radius:8px;font-size:11px;}.legend-item{display:inline-block;margin-right:14px;}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;}.foot{margin-top:24px;padding-top:12px;border-top:1px solid #e5e7eb;font-size:10px;color:#9ca3af;text-align:center;}<\/style><\/head><body><div class="hdr"><img src="'+LOGO+'" style="height:100px;object-fit:contain;"/><div class="biz"><strong style="font-size:13px;color:#1a1a1a;">The Roof Hub Limited<\/strong><br/>98 Hillsborough Road, Hillsborough, Auckland<br/>fasa@theroofhub.co.nz · 02041739390<\/div><\/div><div class="content"><h1>🎓 Staff Training Matrix<\/h1><div class="sub">WorkSafe NZ Compliance · Health and Safety at Work Act 2015<\/div><table><thead><tr><th style="padding:10px;background:#1a1a2e;color:#fff;font-size:11px;text-transform:uppercase;width:25%;">Staff Member<\/th>'+headerCells+'<\/tr><\/thead><tbody>'+staffRows+'<\/tbody><\/table><div class="legend"><strong>Legend:<\/strong><div style="margin-top:6px;"><span class="legend-item"><span class="dot" style="background:#16a34a;"><\/span>Current (90+ days)<\/span><span class="legend-item"><span class="dot" style="background:#2563eb;"><\/span>Expiring Soon (31-90 days)<\/span><span class="legend-item"><span class="dot" style="background:#d97706;"><\/span>Expiring Within 30 Days<\/span><span class="legend-item"><span class="dot" style="background:#dc2626;"><\/span>Expired<\/span><span class="legend-item"><span class="dot" style="background:#f3f4f6;border:1px solid #d1d5db;"><\/span>Not on File<\/span><\/div><\/div><div class="foot">Generated: '+new Date().toLocaleString("en-NZ")+' · This matrix is maintained as part of The Roof Hub Limited\'s safety management system.<\/div><\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>';
    win.document.write(html);
    win.document.close();
  }
  
  return(
    <div>
      {/* Training overview banner */}
      <div style={{...card,background:"linear-gradient(135deg,#eff6ff,#dbeafe)",borderLeft:"4px solid #2563eb",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#1e3a8a"}}>🎓 Staff Training Overview</div>
            <div style={{fontSize:11,color:"#1e40af"}}>Track certifications · WorkSafe NZ compliance</div>
          </div>
          <button onClick={generateTrainingMatrixPDF} style={{background:"#2563eb",color:"#fff",border:"none",padding:"6px 12px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer"}}>📄 Training Matrix PDF</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:10}}>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 4px",textAlign:"center",border:"1px solid #bfdbfe"}}>
            <div style={{fontSize:18,fontWeight:800,color:"#1e40af",fontFamily:"'Barlow Condensed',sans-serif"}}>{totalCurrent}</div>
            <div style={{fontSize:9,color:"#1e3a8a",fontWeight:700,textTransform:"uppercase"}}>Current</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 4px",textAlign:"center",border:"1px solid #bfdbfe"}}>
            <div style={{fontSize:18,fontWeight:800,color:totalExpiring>0?"#d97706":"#9ca3af",fontFamily:"'Barlow Condensed',sans-serif"}}>{totalExpiring}</div>
            <div style={{fontSize:9,color:"#1e3a8a",fontWeight:700,textTransform:"uppercase"}}>Expiring &lt; 30d</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 4px",textAlign:"center",border:"1px solid #bfdbfe"}}>
            <div style={{fontSize:18,fontWeight:800,color:totalExpired>0?"#dc2626":"#9ca3af",fontFamily:"'Barlow Condensed',sans-serif"}}>{totalExpired}</div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>

              <div style={{marginTop:8,paddingTop:8,borderTop:"1px dashed #e5e7eb",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

        const pendingHours=totalHours-approvedHours;
        
        // Build day-by-day map (Mon-Sun)

        for(let i=0;i<7;i++){
