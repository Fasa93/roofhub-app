function IncidentRegister({incidents,setIncidents,jobs,onBack}){
  const[showForm,setShowForm]=React.useState(false);
  const[editing,setEditing]=React.useState(null);
  const[selected,setSelected]=React.useState(null);
  const[yearFilter,setYearFilter]=React.useState("all");
  const[typeFilter,setTypeFilter]=React.useState("all");
  const bl={
    date:new Date().toISOString().split("T")[0],
    time:"",
    type:"near-miss",
    severity:"minor",
    location:"",
    address:"",
    personInvolved:"",
    personRole:"",
    witnesses:"",
    description:"",
    immediateAction:"",
    contributingFactors:"",
    preventativeAction:"",
    reportedBy:"Fasa Sopi",
    reportedDate:new Date().toISOString().split("T")[0],
    linkedJobId:"",
    worksafeNotified:false,
    worksafeRefNumber:"",
    closedOut:false,
    closedOutDate:"",
    closedOutBy:"",
    photos:[],
  };
  const[fm,setFm]=React.useState(bl);

  function openAdd(){setEditing(null);setFm(bl);setShowForm(true);}
  function openEdit(inc){setEditing(inc);setFm({...bl,...inc});setShowForm(true);setSelected(null);}
  function save(){
    if(!fm.date||!fm.description){alert("Please fill in at least the date and description.");return;}
    if(editing){
      setIncidents(incidents.map(i=>i.id===editing.id?{...editing,...fm}:i));
    }else{
      setIncidents(i=>[...i,{...fm,id:Date.now()}]);
    }
    setShowForm(false);setEditing(null);setFm(bl);
  }
  function del(inc){
    if(confirm("Delete this incident record? This cannot be undone — incidents should generally be kept for 5+ years per WorkSafe NZ requirements.")){
      setIncidents(incidents.filter(i=>i.id!==inc.id));
      setSelected(null);
    }
  }
  function closeOut(inc){
    const date=prompt("Closeout date (YYYY-MM-DD):",new Date().toISOString().split("T")[0]);
    if(!date)return;
    const by=prompt("Closed out by:","Fasa Sopi");
    if(!by)return;
    const updated={...inc,closedOut:true,closedOutDate:date,closedOutBy:by};
    setIncidents(incidents.map(i=>i.id===inc.id?updated:i));
    setSelected(updated);
  }
  
  function generatePDF(inc){
    const win=window.open("","_blank");
    if(!win)return;
    const t=INCIDENT_TYPES[inc.type]||INCIDENT_TYPES.other;
    const sev=INCIDENT_SEVERITY[inc.severity]||INCIDENT_SEVERITY.minor;
    const linkedJob=inc.linkedJobId?jobs.find(j=>j.id.toString()===inc.linkedJobId.toString()):null;
    const row=(label,value)=>'<tr><td style="font-weight:700;padding:8px 10px;background:#f9fafb;width:40%;border:1px solid #ddd;font-size:12px;">'+label+'</td><td style="padding:8px 10px;border:1px solid #ddd;font-size:12px;white-space:pre-wrap;">'+(value||"—")+'</td></tr>';
    win.document.write('<!DOCTYPE html><html><head><title>Incident Report<\/title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;}.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:3px solid #dc2626;}.biz{text-align:right;font-size:11px;color:#555;line-height:1.7;}.content{padding:20px 30px;}h1{font-size:22px;font-weight:800;color:#dc2626;margin-bottom:4px;}.sub{color:#6b7280;margin-bottom:20px;font-size:12px;}h2{font-size:14px;color:#dc2626;border-bottom:1px solid #dc2626;padding-bottom:4px;margin-top:20px;margin-bottom:10px;}table{width:100%;border-collapse:collapse;margin-bottom:10px;}.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-right:6px;}.tag-'+inc.severity+'{background:'+sev.bg+';color:'+sev.color+';}.foot{margin-top:30px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#999;}<\/style><\/head><body><div class="hdr"><img src="'+LOGO+'" style="height:100px;object-fit:contain;"/><div class="biz"><strong style="font-size:13px;color:#1a1a1a;">The Roof Hub Limited<\/strong><br/>98 Hillsborough Road, Hillsborough, Auckland 1042<br/>fasa@theroofhub.co.nz · 02041739390<\/div><\/div><div class="content"><h1>⚠️ Incident Report</h1><div class="sub">WorkSafe NZ Compliant — Health & Safety at Work Act 2015</div><div><span class="badge tag-'+inc.severity+'">'+sev.label+'</span><span class="badge" style="background:#f3f4f6;color:#374151;">'+t.icon+' '+t.label+'</span>'+(inc.closedOut?'<span class="badge" style="background:#f0fdf4;color:#16a34a;">✓ Closed Out</span>':'<span class="badge" style="background:#fef3c7;color:#92400e;">Open</span>')+'<\/div><h2>Incident Details<\/h2><table>'+row("Date of Incident",inc.date)+row("Time",inc.time)+row("Type",t.label)+row("Severity",sev.label)+row("Location",inc.location)+row("Site Address",inc.address)+(linkedJob?row("Linked Job",linkedJob.client+" — "+linkedJob.type):"")+'<\/table><h2>People Involved<\/h2><table>'+row("Person(s) Involved",inc.personInvolved)+row("Role / Position",inc.personRole)+row("Witnesses",inc.witnesses)+'<\/table><h2>What Happened<\/h2><table>'+row("Description",inc.description)+row("Immediate Action Taken",inc.immediateAction)+row("Contributing Factors",inc.contributingFactors)+row("Preventative Action",inc.preventativeAction)+'<\/table><h2>Reporting<\/h2><table>'+row("Reported By",inc.reportedBy)+row("Date Reported",inc.reportedDate)+row("WorkSafe Notified",inc.worksafeNotified?"Yes":"No")+(inc.worksafeRefNumber?row("WorkSafe Reference",inc.worksafeRefNumber):"")+'<\/table>'+(inc.closedOut?'<h2>Closeout<\/h2><table>'+row("Closed Out Date",inc.closedOutDate)+row("Closed Out By",inc.closedOutBy)+'<\/table>':"")+'<div class="foot">This report is part of The Roof Hub Limited\'s incident register as required under the Health & Safety at Work Act 2015. Records are retained for a minimum of 5 years.<br/>Generated: '+new Date().toLocaleString("en-NZ")+'<\/div><\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>');
    win.document.close();
  }
  
  function exportCSV(){
    const h=["Date","Time","Type","Severity","Location","Address","Person Involved","Description","Immediate Action","Preventative Action","Reported By","WorkSafe Notified","Closed Out","Closed Out Date"];
    const rows=incidents.map(i=>[i.date,i.time,INCIDENT_TYPES[i.type]?.label||i.type,INCIDENT_SEVERITY[i.severity]?.label||i.severity,i.location,i.address,i.personInvolved,i.description,i.immediateAction,i.preventativeAction,i.reportedBy,i.worksafeNotified?"Yes":"No",i.closedOut?"Yes":"No",i.closedOutDate]);
    const csv=[h,...rows].map(r=>r.map(x=>'"'+String(x||"").replace(/"/g,'""')+'"').join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="incident-register-"+new Date().toISOString().split("T")[0]+".csv";a.click();URL.revokeObjectURL(url);
  }

  // Build list of years available (4 years back + current)
  const currentYear=new Date().getFullYear();
  const years=[];
  for(let y=currentYear;y>=currentYear-4;y--)years.push(y);
  incidents.forEach(i=>{const y=new Date(i.date).getFullYear();if(!years.includes(y))years.push(y);});
  years.sort((a,b)=>b-a);

  // Filter
  const filtered=incidents.filter(i=>{
    if(yearFilter!=="all"&&new Date(i.date).getFullYear().toString()!==yearFilter)return false;
    if(typeFilter!=="all"&&i.type!==typeFilter)return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  const stats={
    total:incidents.length,
    open:incidents.filter(i=>!i.closedOut).length,
    thisYear:incidents.filter(i=>new Date(i.date).getFullYear()===currentYear).length,
    notifiable:incidents.filter(i=>i.severity==="notifiable").length,
  };

  // DETAIL VIEW
  if(selected){
    const t=INCIDENT_TYPES[selected.type]||INCIDENT_TYPES.other;
    const sev=INCIDENT_SEVERITY[selected.severity]||INCIDENT_SEVERITY.minor;
    const linkedJob=selected.linkedJobId?jobs.find(j=>j.id.toString()===selected.linkedJobId.toString()):null;
    return(
      <div>
        <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Register</button>
        <div style={{...card,borderLeft:"4px solid "+sev.color}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                <span style={{background:sev.bg,color:sev.color,fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12,textTransform:"uppercase"}}>{sev.label}</span>
                <span style={{background:"#f3f4f6",color:"#374151",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12}}>{t.icon} {t.label}</span>
                {selected.closedOut?<span style={{background:"#f0fdf4",color:"#16a34a",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12}}>✓ Closed Out</span>:<span style={{background:"#fef3c7",color:"#92400e",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12}}>⏳ Open</span>}
              </div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:"#1a1a2e"}}>Incident on {selected.date}{selected.time?" at "+selected.time:""}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <button onClick={()=>openEdit(selected)} style={{background:"#e85d04",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>✏️ Edit</button>
              <button onClick={()=>generatePDF(selected)} style={{background:"#2563eb",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>📄 PDF</button>
              {!selected.closedOut&&<button onClick={()=>closeOut(selected)} style={{background:"#16a34a",color:"#fff",border:"none",padding:"7px 14px",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:12}}>✓ Close Out</button>}
              <button onClick={()=>del(selected)} style={{background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",padding:"7px 14px",borderRadius:6,fontWeight:600,cursor:"pointer",fontSize:12}}>🗑 Delete</button>
            </div>
          </div>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            {selected.location&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Location</div><div style={{fontSize:13,color:"#111827"}}>📍 {selected.location}</div></div>}
            {selected.address&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Site Address</div><div style={{fontSize:13,color:"#111827"}}>{selected.address}</div></div>}
            {selected.personInvolved&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Person Involved</div><div style={{fontSize:13,color:"#111827",fontWeight:600}}>👤 {selected.personInvolved}{selected.personRole?" ("+selected.personRole+")":""}</div></div>}
            {selected.witnesses&&<div><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Witnesses</div><div style={{fontSize:13,color:"#111827"}}>{selected.witnesses}</div></div>}
            {linkedJob&&<div style={{gridColumn:"span 2"}}><div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>Linked Job</div><div style={{fontSize:13,color:"#111827"}}>🔨 {linkedJob.client} — {linkedJob.type}</div></div>}
          </div>
          
          {selected.description&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>📝 What Happened</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",whiteSpace:"pre-wrap"}}>{selected.description}</div>
          </div>}
          {selected.immediateAction&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🚨 Immediate Action Taken</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#fef2f2",borderRadius:8,border:"1px solid #fca5a5",whiteSpace:"pre-wrap"}}>{selected.immediateAction}</div>
          </div>}
          {selected.contributingFactors&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🔍 Contributing Factors</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",whiteSpace:"pre-wrap"}}>{selected.contributingFactors}</div>
          </div>}
          {selected.preventativeAction&&<div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"#9ca3af",fontWeight:600,textTransform:"uppercase",marginBottom:4}}>🛡️ Preventative Action</div>
            <div style={{fontSize:13,color:"#374151",padding:10,background:"#f0fdf4",borderRadius:8,border:"1px solid #bbf7d0",whiteSpace:"pre-wrap"}}>{selected.preventativeAction}</div>
          </div>}
          
          <div style={{padding:10,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",fontSize:11,color:"#6b7280",display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            <div><strong>Reported by:</strong> {selected.reportedBy}</div>
            <div><strong>Reported on:</strong> {selected.reportedDate}</div>
            {selected.worksafeNotified&&<div style={{gridColumn:"span 2",color:"#dc2626",fontWeight:600}}>⚠️ Notified to WorkSafe NZ {selected.worksafeRefNumber?"— Ref: "+selected.worksafeRefNumber:""}</div>}
            {selected.closedOut&&<div style={{gridColumn:"span 2",color:"#16a34a",fontWeight:600}}>✓ Closed out by {selected.closedOutBy} on {selected.closedOutDate}</div>}
          </div>
        </div>
      </div>
    );
  }

  // FORM VIEW
  if(showForm){
    return(
      <div>
        <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Register</button>
        <div style={card}>
          <SHd t={editing?"✏️ Edit Incident":"⚠️ Record New Incident"} color="#dc2626"/>
          <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,padding:10,marginBottom:14,fontSize:11,color:"#991b1b"}}>
            <strong>⚖️ Legal requirement:</strong> Under the HSW Act 2015, all workplace incidents must be recorded. "Notifiable events" must be reported to WorkSafe NZ within the required timeframe.
          </div>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Date *</label><input type="date" value={fm.date} onChange={e=>setFm(f=>({...f,date:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Time</label><input type="time" value={fm.time} onChange={e=>setFm(f=>({...f,time:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Type *</label><select value={fm.type} onChange={e=>setFm(f=>({...f,type:e.target.value}))} style={inp}>{Object.entries(INCIDENT_TYPES).map(([k,t])=><option key={k} value={k}>{t.icon} {t.label}</option>)}</select></div>
            <div><label style={lb}>Severity *</label><select value={fm.severity} onChange={e=>setFm(f=>({...f,severity:e.target.value}))} style={inp}>{Object.entries(INCIDENT_SEVERITY).map(([k,s])=><option key={k} value={k}>{s.label}</option>)}</select></div>
            <div><label style={lb}>Location (on-site)</label><input value={fm.location} onChange={e=>setFm(f=>({...f,location:e.target.value}))} style={inp} placeholder="e.g. Front ridge, scaffold level 2..."/></div>
            <div><label style={lb}>Linked Job</label><select value={fm.linkedJobId} onChange={e=>{const jid=e.target.value;const j=jobs.find(jj=>jj.id.toString()===jid);setFm(f=>({...f,linkedJobId:jid,address:j?j.address:f.address}));}} style={inp}><option value="">— None —</option>{jobs.map(j=><option key={j.id} value={j.id}>{j.client} — {j.address}</option>)}</select></div>
            <div style={{gridColumn:"span 2"}}><label style={lb}>🔍 Site Address</label><AddressInput value={fm.address} onChange={v=>setFm(f=>({...f,address:v}))} placeholder="Start typing..."/></div>
          </div>

          <SHd t="👤 People Involved" color="#dc2626"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Person Involved</label><input value={fm.personInvolved} onChange={e=>setFm(f=>({...f,personInvolved:e.target.value}))} style={inp} placeholder="Full name"/></div>
            <div><label style={lb}>Role / Position</label><input value={fm.personRole} onChange={e=>setFm(f=>({...f,personRole:e.target.value}))} style={inp} placeholder="e.g. Labourer, Site Foreman, Visitor"/></div>
            <div style={{gridColumn:"span 2"}}><label style={lb}>Witnesses</label><input value={fm.witnesses} onChange={e=>setFm(f=>({...f,witnesses:e.target.value}))} style={inp} placeholder="Names of any witnesses"/></div>
          </div>

          <SHd t="📝 What Happened" color="#dc2626"/>
          <label style={lb}>Description of Incident *</label>
          <textarea value={fm.description} onChange={e=>setFm(f=>({...f,description:e.target.value}))} rows={4} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="Detailed description of what happened, how it happened, and what injuries/damage occurred..."/>
          <label style={lb}>Immediate Action Taken</label>
          <textarea value={fm.immediateAction} onChange={e=>setFm(f=>({...f,immediateAction:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="What was done straight away — first aid, stopped work, called 111, etc."/>
          <label style={lb}>Contributing Factors</label>
          <textarea value={fm.contributingFactors} onChange={e=>setFm(f=>({...f,contributingFactors:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:10}} placeholder="Why did this happen? Weather, fatigue, missing PPE, faulty equipment, training gap..."/>
          <label style={lb}>Preventative Action</label>
          <textarea value={fm.preventativeAction} onChange={e=>setFm(f=>({...f,preventativeAction:e.target.value}))} rows={3} style={{...inp,resize:"vertical",marginBottom:14}} placeholder="What will we do to stop this happening again?"/>

          <SHd t="📋 Reporting" color="#dc2626"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div><label style={lb}>Reported By</label><input value={fm.reportedBy} onChange={e=>setFm(f=>({...f,reportedBy:e.target.value}))} style={inp}/></div>
            <div><label style={lb}>Date Reported</label><input type="date" value={fm.reportedDate} onChange={e=>setFm(f=>({...f,reportedDate:e.target.value}))} style={inp}/></div>
            <div style={{gridColumn:"span 2",display:"flex",alignItems:"center",gap:10,padding:10,background:fm.worksafeNotified?"#fef2f2":"#f9fafb",borderRadius:8,border:"1px solid "+(fm.worksafeNotified?"#fca5a5":"#e5e7eb")}}>
              <input type="checkbox" checked={fm.worksafeNotified} onChange={e=>setFm(f=>({...f,worksafeNotified:e.target.checked}))} style={{width:18,height:18,cursor:"pointer"}}/>
              <span style={{fontSize:13,color:"#374151",fontWeight:600}}>Notified to WorkSafe NZ (0800 030 040)</span>
            </div>
            {fm.worksafeNotified&&<div style={{gridColumn:"span 2"}}><label style={lb}>WorkSafe Reference Number</label><input value={fm.worksafeRefNumber} onChange={e=>setFm(f=>({...f,worksafeRefNumber:e.target.value}))} style={inp} placeholder="Reference provided by WorkSafe"/></div>}
          </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={save} style={{background:"#dc2626",color:"#fff",border:"none",padding:"10px 24px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>{editing?"💾 Update Incident":"💾 Save Incident"}</button>
            <button onClick={()=>{setShowForm(false);setEditing(null);}} style={{background:"#f4f5f7",color:"#6b7280",border:"1px solid #e5e7eb",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
      </div>
    );
  }

  // MAIN LIST VIEW
  return(
    <div>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#dc2626",fontWeight:700,cursor:"pointer",marginBottom:12,fontSize:14}}>← Back to Forms</button>
      
      <div style={{...card,background:"linear-gradient(135deg,#fef2f2,#fecaca)",borderLeft:"4px solid #dc2626",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:"#991b1b"}}>⚠️ Incident Register</div>
            <div style={{fontSize:11,color:"#7f1d1d"}}>WorkSafe NZ compliant · HSW Act 2015 · Retained for 5+ years</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button onClick={openAdd} style={{background:"#dc2626",color:"#fff",border:"none",padding:"8px 16px",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:12}}>+ Log Incident</button>
            {incidents.length>0&&<button onClick={exportCSV} style={{background:"#fff",color:"#991b1b",border:"1px solid #fca5a5",padding:"8px 14px",borderRadius:8,fontWeight:600,cursor:"pointer",fontSize:12}}>📤 Export CSV</button>}
          </div>
        </div>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:12}}>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#991b1b",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.total}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>Total</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#d97706",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.open}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>Open</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#2563eb",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.thisYear}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>{currentYear}</div>
          </div>
          <div style={{background:"#fff",borderRadius:8,padding:"8px 6px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:20,fontWeight:800,color:"#991b1b",fontFamily:"'Barlow Condensed',sans-serif"}}>{stats.notifiable}</div>
            <div style={{fontSize:9,color:"#7f1d1d",fontWeight:700,textTransform:"uppercase"}}>Notifiable</div>
          </div>
        </div>
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#6b7280",fontWeight:700}}>Year:</span>
        <button onClick={()=>setYearFilter("all")} style={{background:yearFilter==="all"?"#dc2626":"#fff",color:yearFilter==="all"?"#fff":"#6b7280",border:"1px solid "+(yearFilter==="all"?"#dc2626":"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>All</button>
        {years.map(y=>(
          <button key={y} onClick={()=>setYearFilter(y.toString())} style={{background:yearFilter===y.toString()?"#dc2626":"#fff",color:yearFilter===y.toString()?"#fff":"#6b7280",border:"1px solid "+(yearFilter===y.toString()?"#dc2626":"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>{y}</button>
        ))}
        <span style={{fontSize:11,color:"#6b7280",fontWeight:700,marginLeft:8}}>Type:</span>
        <button onClick={()=>setTypeFilter("all")} style={{background:typeFilter==="all"?"#dc2626":"#fff",color:typeFilter==="all"?"#fff":"#6b7280",border:"1px solid "+(typeFilter==="all"?"#dc2626":"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>All</button>
        {Object.entries(INCIDENT_TYPES).map(([k,t])=>(
          <button key={k} onClick={()=>setTypeFilter(k)} style={{background:typeFilter===k?t.color:"#fff",color:typeFilter===k?"#fff":"#6b7280",border:"1px solid "+(typeFilter===k?t.color:"#e5e7eb"),padding:"4px 10px",borderRadius:14,fontSize:11,fontWeight:700,cursor:"pointer"}}>{t.icon} {t.label}</button>
        ))}
      </div>

      {/* List */}
      {filtered.length===0&&<div style={{...card,textAlign:"center",padding:40,color:"#9ca3af"}}>
        {incidents.length===0?"No incidents logged yet. Tap '+ Log Incident' when needed.":"No incidents match your filters."}
      </div>}
      {filtered.map(inc=>{
        const t=INCIDENT_TYPES[inc.type]||INCIDENT_TYPES.other;
        const sev=INCIDENT_SEVERITY[inc.severity]||INCIDENT_SEVERITY.minor;
        return(
          <div key={inc.id} onClick={()=>setSelected(inc)} style={{...card,cursor:"pointer",borderLeft:"4px solid "+sev.color,position:"relative"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6,alignItems:"center"}}>
                  <span style={{background:sev.bg,color:sev.color,fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,textTransform:"uppercase"}}>{sev.label}</span>
                  <span style={{background:"#f3f4f6",color:"#374151",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{t.icon} {t.label}</span>
                  {inc.closedOut?<span style={{background:"#f0fdf4",color:"#16a34a",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>✓ CLOSED</span>:<span style={{background:"#fef3c7",color:"#92400e",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10}}>⏳ OPEN</span>}
                  {inc.worksafeNotified&&<span style={{background:"#fef2f2",color:"#991b1b",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,border:"1px solid #fca5a5"}}>⚠️ WORKSAFE</span>}
                </div>
                <div style={{fontSize:13,fontWeight:700,color:"#111827"}}>{inc.date}{inc.time?" at "+inc.time:""}{inc.location?" · "+inc.location:""}</div>
                {inc.personInvolved&&<div style={{fontSize:11,color:"#6b7280",marginTop:2}}>👤 {inc.personInvolved}</div>}
                {inc.address&&<div style={{fontSize:11,color:"#6b7280"}}>📍 {inc.address}</div>}
                {inc.description&&<div style={{fontSize:12,color:"#374151",marginTop:6,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{inc.description}</div>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function FormsView({jobs,clients,incidents=[],setIncidents}){
  const[view,setView]=React.useState("select");
  const[linked,setLinked]=React.useState("");
  const[data,setData]=React.useState({});
  const[clientEmail,setClientEmail]=React.useState("");
  const[clientName,setClientName]=React.useState("");
  const templates={
    "job-report":{name:"Job Report",icon:"📋",fields:["Customer","Address","P.O Number","Date","Investigation Notes","Temporary / Permanent Repairs","Recommended Permanent Repairs"]},
    "roof-report":{name:"Roof Report",icon:"🏠",fields:["Address","Work Order Number","Inspection Date","Report Requested By","Report Conducted By","Number of Storeys","Roof Area (m²)","Roof Material","Colour","Age (est. years)","Pitch Degree","Roof Profile","Roof Coat Condition","Roof Surface Condition","Flashing Condition","Ridge Condition","Fixings Condition","Gutter Type","Gutter Material","Gutter Comments","Recommended Work"]},
  };
  function start(id){
    const job=jobs.find(j=>j.id.toString()===linked);
    const pre={};
    let email="";
    let name="";
    if(job){
      templates[id].fields.forEach(f=>{
        if(f.toLowerCase().includes("customer")||f.toLowerCase().includes("client"))pre[f]=job.client;
        if(f.toLowerCase().includes("address"))pre[f]=job.address;
        if(f.toLowerCase().includes("date"))pre[f]=job.date;
      });
      email=job.email||"";
      name=job.client||"";
      // If client is in database, use their email
      if(clients&&!email){
        const dbClient=clients.find(c=>c.name.toLowerCase()===job.client.toLowerCase());
        if(dbClient)email=dbClient.email||"";
      }
    }
    setClientEmail(email);setClientName(name);
    setData(pre);setView(id);
  }
  function genPDF(){
    const tpl=templates[view];
    const win=window.open("","_blank");
    if(!win)return;
    const rows=tpl.fields.map(f=>'<div style="margin-bottom:14px;"><div style="font-size:11px;font-weight:600;color:#777;text-transform:uppercase;margin-bottom:3px;">'+f+'</div><div style="border:1px solid #ddd;border-radius:4px;padding:8px 12px;min-height:28px;background:#fafafa;font-size:13px;white-space:pre-wrap;">'+(data[f]||"")+'</div></div>').join("");
    win.document.write('<!DOCTYPE html><html><head><title>'+tpl.name+'<\/title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;}.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:3px solid #cc0000;}.biz{text-align:right;font-size:11px;color:#555;line-height:1.7;}.content{padding:20px 30px;}h1{font-size:24px;font-weight:800;border-bottom:2px solid #cc0000;padding-bottom:8px;margin-bottom:20px;}<\/style><\/head><body><div class="hdr"><img src="'+LOGO+'" style="height:100px;object-fit:contain;"/><div class="biz"><strong style="font-size:13px;color:#1a1a1a;">The Roof Hub Limited<\/strong><br/>98 Hillsborough Road, Hillsborough, Auckland<br/>fasa@theroofhub.co.nz · 02041739390<\/div><\/div><div class="content"><h1>'+tpl.name+'<\/h1>'+rows+'<\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>');
    win.document.close();
  }
  function emailToClient(){
    const tpl=templates[view];
    if(!clientEmail){
      alert("No email address for this client. Please add one in the Clients tab or enter one below.");
      return;
    }
    // Build a nicely formatted summary for the email body
    const address=data["Address"]||"";
    const summary=tpl.fields.filter(f=>data[f]&&data[f].trim()).map(f=>"• "+f+": "+data[f]).join("\n");
    const subject=tpl.name+(address?" — "+address:"");
    const greeting=clientName?"Hi "+clientName.split(" ")[0]+",":"Hi there,";
    const body=greeting+"\n\nPlease find below the "+tpl.name.toLowerCase()+" for your property"+(address?" at "+address:"")+".\n\n"+
      "═══════════════════════════════\n"+
      tpl.name.toUpperCase()+"\n"+
      "═══════════════════════════════\n\n"+
      summary+"\n\n"+
      "═══════════════════════════════\n\n"+
      "⚠️ Please note: A PDF version of this "+tpl.name.toLowerCase()+" is available — I'll attach it separately or generate it for you on request.\n\n"+
      "If you have any questions or would like to proceed with the recommended work, please get in touch.\n\n"+
      "Kind regards,\n"+

/span>').join("")+'<\/div><h2>🌦️ Weather Conditions<\/h2><div class="fb"><strong>'+(m.weather||"Not recorded")+'<\/strong>'+(m.weatherNotes?"<br/>"+m.weatherNotes:"")+'<\/div><h2>⚠️ Previous Day Incidents / Near Misses<\/h2><div class="fb" style="min-height:40px;">'+(m.previousIncidents||"None reported")+'<\/div><h2>🦺 PPE Confirmation<\/h2><div class="fb">'+m.ppe.map(p=>'<span class="tag">✓ '+p+'<\/span>').join("")+'<\/div><h2>🚧 Site Hazards Identified<\/h2><div class="fb">'+m.hazards.map(h=>'<span class="tag">⚠️ '+h+'<\/span>').join("")+(m.hazardOther?'<br/><strong>Other:<\/strong> '+m.hazardOther:"")+'<\/div><h2>💡 Safety Topic of the Day<\/h2><div class="fb"><strong>'+(m.safetyTopic||"—")+'<\/strong>'+(m.safetyNotes?"<br/>"+m.safetyNotes:"")+'<\/div><h2>🎯 Daily Tasks / Goals<\/h2><div class="fb" style="min-height:40px;">'+(m.dailyTasks||"—")+'<\/div><h2>📞 Emergency Contacts<\/h2><div class="fb">'+EMERGENCY_CONTACTS.map(c=>'<strong>'+c.label+':<\/strong> '+c.number).join('<br/>')+'<\/div>'+(m.additionalNotes?'<h2>📝 Additional Notes<\/h2><div class="fb">'+m.additionalNotes+'<\/div>':'')+'<div class="sig">All attendees acknowledged understanding of the above safety briefing.<br/><br/>Foreman signature: ____________________________    Date: '+m.date+'<\/div><\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>';
    win.document.write(html);

    </div>
  );
}

  const blankSSSP = {
    packType:"red", // red = main contractor, yellow = subcontractor
    projectName:"",
    mainContractor:"The Roof Hub Limited",
    siteAddress:"",
    startDate:"",
    expectedDuration:"",
    siteContact:"David Sopi",
    siteContactPhone:"",
    firstAider:"David Sopi",

    accessPoints:"",
    utilitiesLocation:"",

    asbestosNotes:"",

    additionalHazard:"",
    additionalControl:"",
    publicProtection:"",

    specificInstructions:"",

  function startNew(jobId){
    const job = jobs.find(j=>j.id===jobId);
    if(!job) return;

    if(existing){
      setS(existing);
    } else {
      setS({

        projectName:job.type+" — "+job.client,
        siteAddress:job.address,
        startDate:job.date,

    }
    setSelJobId(jobId);
    setMode("edit");
    setSaved(false);

  function toggleHazard(idx){
    setS(x=>({...x,hazards:x.hazards.map((h,i)=>i===idx?{...h,selected:!h.selected}:h)}));
  }
  function updateHazardControl(idx,val){
    setS(x=>({...x,hazards:x.hazards.map((h,i)=>i===idx?{...h,control:val}:h)}));
  }
  function toggleExtra(hz){
    setS(x=>({...x,extraHazards:x.extraHazards.includes(hz)?x.extraHazards.filter(h=>h!==hz):[...x.extraHazards,hz]}));
  }

  function save(){
    setJobs(jobs.map(j=>j.id===selJobId?{...j,sssp:s,ssspCompleted:true}:j));

Specific Safety Plan (SSSP)<\/h1><h2>Project Details<\/h2><div class="grid2"><div><div class="fl">Project Name<\/div><div class="fb">'+s.projectName+'<\/div><\/div><div><div class="fl">Main Contractor (PCBU)<\/div><div class="fb">'+s.mainContractor+'<\/div><\/div><div><div class="fl">Site Address<\/div><div class="fb">'+s.siteAddress+'<\/div><\/div><div><div class="fl">Start Date<\/div><div class="fb">'+s.startDate+'<\/div><\/div><div><div class="fl">Expected Duration<\/div><div class="fb">'+s.expectedDuration+'<\/div><\/div><div><div class="fl">Site Contact<\/div><div class="fb">'+s.siteContact+' · '+s.siteContactPhone+'<\/div><\/div><\/div><h2>Emergency Procedures<\/h2><div class="grid2"><div><div class="fl">First Aider<\/div><div class="fb">'+s.firstAider+'<\/div><\/div><div><div class="fl">First Aid Kit Location<\/div><div class="fb">'+s.firstAidLocation+'<\/div><\/div><div><div class="fl">Nearest Hospital<\/div><div class="fb">'+s.nearestHospital+'<\/div><\/div><div><div class="fl">Evacuation Point<\/div><div class="fb">'+s.evacuationPoint+'<\/div><\/div><\/div><div style="margin-top:10px;"><div class="fl">Emergency Procedure<\/div><div class="fb" style="min-height:50px;">'+s.emergencyProcedure+'<\/div><\/div><h2>🚨 Key Emergency Contacts<\/h2><table><tr><th>Service<\/th><th>Contact<\/th><\/tr><tr><td style="padding:6px 8px;font-weight:700;color:#dc2626;">Emergency (Fire/Police/Ambulance)<\/td><td style="padding:6px 8px;font-weight:700;">111<\/td><\/tr><tr><td style="padding:6px 8px;">Manager (Fasa Sopi)<\/td><td style="padding:6px 8px;">02041739390<\/td><\/tr><tr><td style="padding:6px 8px;">Site Foreman (David Sopi)<\/td><td style="padding:6px 8px;">021 XXX XXXX<\/td><\/tr><tr><td style="padding:6px 8px;">Nearest Hospital<\/td><td style="padding:6px 8px;">'+s.nearestHospital+'<\/td><\/tr><tr><td style="padding:6px 8px;">Poisons Centre<\/td><td style="padding:6px 8px;">0800 764 766<\/td><\/tr><tr><td style="padding:6px 8px;">WorkSafe NZ<\/td><td style="padding:6px 8px;">0800 030 040<\/td><\/tr><\/table><h2>Site Access & Utilities<\/h2><div class="grid2"><div><div class="fl">Access / Egress Points<\/div><div class="fb" style="min-height:40px;">'+s.accessPoints+'<\/div><\/div><div><div class="fl">Utilities Location (power, gas, water)<\/div><div class="fb" style="min-height:40px;">'+s.utilitiesLocation+'<\/div><\/div><\/div><h2>⚠️ Hazard Register & Risk Controls<\/h2>'+(s.asbestosChecked?'<div class="warn"><strong>⚠️ ASBESTOS IDENTIFIED:<\/strong> '+s.asbestosNotes+'<\/div>':'<div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:8px;border-radius:6px;color:#14532d;font-size:11px;margin-top:6px;">✓ Asbestos check completed — none identified<\/div>')+'<table><tr><th>Hazard<\/th><th>Control Measures<\/th><\/tr>'+hazardRows+extraHazardRows+'<\/table><h2>Public Protection<\/h2><div class="fb" style="min-height:50px;">'+s.publicProtection+'<\/div><h2>Site-Specific Instructions<\/h2><div class="fb" style="min-height:60px;">'+s.specificInstructions+'<\/div><h2>Incident Reporting<\/h2><div class="fb">All incidents including near-misses must be reported immediately to the site foreman (David Sopi) and logged. Notifiable events reported to WorkSafe NZ within timeframes. Serious harm notified to 0800 030 040.<\/div><div class="sig"><strong>Declaration:<\/strong> I confirm this SSSP has been completed, and all workers on site will be briefed on its contents before work commences.<br/><br/>Signed: '+s.signedBy+'<br/>Date: '+s.signedDate+'<br/><br/><em>This SSSP complies with the Health and Safety at Work Act 2015 and WorkSafe NZ guidelines.<\/em><\/div><\/div><script>window.onload=function(){window.print();};<\/script><\/body><\/html>';

// Which data types sync to cloud (each maps to a table)
const CLOUD_TABLES={
  jobs:{table:"jobs",keyMap:{endDate:"end_date",startTime:"start_time",endTime:"end_time",ssspRequired:"sssp_required",ssspCompleted:"sssp_completed"}},
  clients:{table:"clients",keyMap:{}},
  events:{table:"events",keyMap:{endDate:"end_date",startTime:"start_time",endTime:"end_time",sendToTeam:"send_to_team"}},
  ts:{table:"timesheets",keyMap:{staffId:"staff_id",jobId:"job_id",clockIn:"clock_in",clockOut:"clock_out"}},
  incidents:{table:"incidents",keyMap:{personInvolved:"person_involved",personRole:"person_role",immediateAction:"immediate_action",contributingFactors:"contributing_factors",preventativeAction:"preventative_action",reportedBy:"reported_by",reportedDate:"reported_date",linkedJobId:"linked_job_id",worksafeNotified:"worksafe_notified",worksafeRefNumber:"worksafe_ref_number",closedOut:"closed_out",closedOutDate:"closed_out_date",closedOutBy:"closed_out_by"}},
};

// Convert camelCase keys to snake_case for DB
function toDbRow(key,obj){
  const map=CLOUD_TABLES[key]?.keyMap||{};
  const out={};
  for(const k in obj){
    const dbKey=map[k]||k;
    out[dbKey]=obj[k];
  }
  return out;
}
// Convert snake_case keys from DB back to camelCase
function fromDbRow(key,row){
  const map=CLOUD_TABLES[key]?.keyMap||{};
  const reverseMap={};
  for(const k in map)reverseMap[map[k]]=k;
  const out={};
  for(const k in row){
    if(k==="created_at"||k==="updated_at")continue;
    const jsKey=reverseMap[k]||k;
    out[jsKey]=row[k];
  }
  return out;
}

// ── DATA PERSISTENCE (local + cloud) ───────────────────────────
function loadData(key,fallback){
  try{
    const d=localStorage.getItem("roofhub_"+key);
    return d?JSON.parse(d):fallback;
  }catch(e){return fallback;}
}
function saveData(key,value){
  try{localStorage.setItem("roofhub_"+key,JSON.stringify(value));}catch(e){console.error(e);}
}

// Load data from cloud (returns Promise)
async function cloudLoad(key){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    const{data,error}=await sb.from(cfg.table).select("*");
    if(error){console.error("Cloud load "+key+":",error);return null;}
    return(data||[]).map(r=>fromDbRow(key,r));
  }catch(e){console.error("Cloud load exception:",e);return null;}
}
// Save a single item to cloud
async function cloudUpsert(key,item){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    const row=toDbRow(key,item);
    const{error}=await sb.from(cfg.table).upsert(row);
    if(error){console.error("Cloud upsert "+key+":",error);}
    return!error;
  }catch(e){console.error("Cloud upsert exception:",e);return false;}
}
// Delete an item from cloud
async function cloudDelete(key,id){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  try{
    const{error}=await sb.from(cfg.table).delete().eq("id",id);
    if(error)console.error("Cloud delete "+key+":",error);
    return!error;
  }catch(e){console.error("Cloud delete exception:",e);return false;}
}
// Sync entire array to cloud (upsert all in batches, delete items not in the list)
async function cloudSyncAll(key,items){
  if(!sb)return null;
  const cfg=CLOUD_TABLES[key];
  if(!cfg)return null;
  let upsertOk=true;
  try{
    // First, upsert current items in batches (Supabase has payload limits)
    const rows=(items||[]).map(i=>toDbRow(key,{...i,id:key==="clients"?String(i.id):i.id}));
    const BATCH=200;
    for(let i=0;i<rows.length;i+=BATCH){
      const batch=rows.slice(i,i+BATCH);
      const{error}=await sb.from(cfg.table).upsert(batch);
      if(error){
        console.error("Cloud upsert "+key+" batch "+i+":",error);
        upsertOk=false;
      }
    }
    // Then try to delete any stale rows (non-critical — if this fails we still consider sync successful)
    try{
      const currentIds=(items||[]).map(i=>key==="clients"?String(i.id):i.id);
      const{data:cloudRows}=await sb.from(cfg.table).select("id");
      if(cloudRows){
        const toDelete=cloudRows.filter(r=>!currentIds.includes(r.id)).map(r=>r.id);
        for(let i=0;i<toDelete.length;i+=BATCH){
          await sb.from(cfg.table).delete().in("id",toDelete.slice(i,i+BATCH));
        }
      }
    }catch(e){
      console.warn("Cloud cleanup "+key+" failed (non-critical):",e);
    }
    return upsertOk;
  }catch(e){console.error("Cloud sync-all exception:",e);return false;}
}

// ── CLIENTS DATABASE ───────────────────────────────────────────
function parseCSV(text){
  // Simple but robust CSV parser (handles quoted fields with commas)
  const rows=[];
  let cur=[""];let inQuote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];const n=text[i+1];
    if(c==='"'&&inQuote&&n==='"'){cur[cur.length-1]+='"';i++;}
    else if(c==='"'){inQuote=!inQuote;}
    else if(c===','&&!inQuote){cur.push("");}
    else if((c==='\n'||c==='\r')&&!inQuote){
      if(cur.length>1||cur[0]!==""){rows.push(cur);}
      cur=[""];
      if(c==='\r'&&n==='\n')i++;
    }
    else{cur[cur.length-1]+=c;}
  }
  if(cur.length>1||cur[0]!=="")rows.push(cur);
  return rows;
}

function mapXeroRow(headers,row){
  // Strip asterisks, lowercase, and trim (Xero uses *FieldName for required fields)
  const h=headers.map(x=>x.toLowerCase().replace(/^\*/,"").trim());
  function get(...names){
    for(const n of names){
      const key=n.toLowerCase().replace(/^\*/,"").trim();
      const i=h.indexOf(key);
      if(i>=0&&row[i])return row[i].trim();
    }
    return"";
  }
  // Xero's primary contact name field (required, marked with *)
  const contact=get("contactname","contact name","name");
  const first=get("firstname","first name");
  const last=get("lastname","last name","surname");
  const legal=get("legalname","legal name");
  // Build name: prefer ContactName, then First+Last, then LegalName
  const name=contact||(first+" "+last).trim()||legal;
  if(!name||name===".")return null;
  // Xero has postal (PO) and street (SA) addresses - prefer postal
  const addrParts=[
    get("poaddressline1","poaddress line 1","address line 1","saaddressline1","street","streetaddress"),
    get("poaddressline2","poaddress line 2","address line 2","saaddressline2"),
    get("pocity","city","poaddress city","sacity","suburb"),
    get("poregion","region","state","saregion"),
    get("popostalcode","postcode","zip","sapostalcode")
  ].filter(x=>x&&x!==".");
  // Try multiple phone field names, prefer mobile
  const phone=get("mobilenumber","mobile number","mobile","phonenumber","phone number","phone","ddinumber");
  // Detect if this is a company (legal name differs from contact name, or no first/last name)
  const looksLikeCompany = legal && legal!==name;
  return{
    id:Date.now()+Math.random(),
    name:name,
    email:get("emailaddress","email","email address"),
    phone:phone,
    address:addrParts.join(", "),
    company:looksLikeCompany?legal:"",
    notes:"",
    source:"Xero import",
  };
}

  function handleImport(e){
    const file=e.target.files[0];
    if(!file)return;
    setImporting(true);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const rows=parseCSV(ev.target.result);
        if(rows.length<2){setImportResult({error:"CSV appears empty"});setImporting(false);return;}
        const headers=rows[0];
        const imported=[];
        const skipped=[];
        for(let i=1;i<rows.length;i++){
          const c=mapXeroRow(headers,rows[i]);

            const exists=clients.some(x=>x.name.toLowerCase()===c.name.toLowerCase()&&(x.email||"").toLowerCase()===(c.email||"").toLowerCase());
